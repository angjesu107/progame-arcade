const stars=Array.from({length:70},()=>[R(0,W),R(0,330),R(1,2.5)]);
const keys={};
// ---------- audio ----------
let ac;
function boom(r){try{const a=au(),t=a.currentTime,v=Math.min(1,r/40+.35);
 const nb=a.createBuffer(1,a.sampleRate*.9|0,a.sampleRate),x=nb.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=(Math.random()*2-1)*Math.pow(1-i/x.length,2);
 const sb=a.createBufferSource(),f=a.createBiquadFilter(),gn=a.createGain();f.type='lowpass';f.frequency.setValueAtTime(2500,t);f.frequency.exponentialRampToValueAtTime(120,t+.8);gn.gain.value=1.1*v;sb.buffer=nb;sb.connect(f).connect(gn).connect(a.destination);sb.start(t);
 const o=a.createOscillator(),og=a.createGain();o.type='sine';o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(30,t+.5);og.gain.setValueAtTime(.9*v,t);og.gain.exponentialRampToValueAtTime(.001,t+.55);o.connect(og).connect(a.destination);o.start(t);o.stop(t+.6)}catch(e){}}
function sadT(){[[330,.28],[311,.28],[294,.28],[220,.7]].forEach((n,i)=>setTimeout(()=>tone(n[0],n[1],'sawtooth',.1,i===3?-60:0),i*260))}
function fanfare(){[523,659,784,1047,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.2,'square',.1,0),i*120))}
function cha(){[988,1319,1568].forEach((f,i)=>setTimeout(()=>tone(f,.12,'sine',.12,0),i*70))}
function uiPop(){tone(520,.07,'square',.07,260)}
function rumble(d){try{const a=au(),t=a.currentTime,nb=a.createBuffer(1,a.sampleRate*d|0,a.sampleRate),x=nb.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=Math.random()*2-1;
 const sb=a.createBufferSource(),f=a.createBiquadFilter(),gn=a.createGain();f.type='lowpass';f.frequency.value=140;gn.gain.setValueAtTime(.05,t);gn.gain.linearRampToValueAtTime(1.2,t+d);sb.buffer=nb;sb.connect(f).connect(gn).connect(a.destination);sb.start(t);
 const o=a.createOscillator(),og=a.createGain();o.type='sawtooth';o.frequency.setValueAtTime(40,t);o.frequency.linearRampToValueAtTime(90,t+d);og.gain.setValueAtTime(.02,t);og.gain.linearRampToValueAtTime(.25,t+d);o.connect(og).connect(a.destination);o.start(t);o.stop(t+d)}catch(e){}}
function whoosh(){try{const a=au(),t=a.currentTime,nb=a.createBuffer(1,a.sampleRate*.4|0,a.sampleRate),x=nb.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/x.length);
 const sb=a.createBufferSource(),f=a.createBiquadFilter(),gn=a.createGain();f.type='bandpass';f.Q.value=2;f.frequency.setValueAtTime(400,t);f.frequency.exponentialRampToValueAtTime(3000,t+.35);gn.gain.value=.8;sb.buffer=nb;sb.connect(f).connect(gn).connect(a.destination);sb.start(t)}catch(e){}}const au=()=>{ac=ac||new(window.AudioContext||webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac};
function tone(f,d,t='square',v=.1,s=0){try{const a=au(),o=a.createOscillator(),n=a.createGain();o.type=t;o.frequency.setValueAtTime(f,a.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(20,f+s),a.currentTime+d);n.gain.setValueAtTime(v,a.currentTime);n.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(n).connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}
function noise(d,v){try{const a=au(),b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=(Math.random()*2-1)*(1-i/x.length);const s=a.createBufferSource(),n=a.createGain();n.gain.value=v;s.buffer=b;s.connect(n).connect(a.destination);s.start()}catch(e){}}
let bub=null;const pk=a=>a[Math.random()*a.length|0];
const VS={b:['¡Toma esto!','¡Fuego en el hoyo!','¡Que viene, que viene!','¡Pa\' ti, cariño!'],h:['¡Misil intenso!','¡Búscalo, bichito!'],g:['¡La papa caliente!','¡Pásala, pásala!'],d:['¡Dinamita, mamita!','¡Esto va a quedar pelao!'],a:['¡Llueven misiles!','¡Aviones, aviones!'],s:['¡Beee, ovejita!','¡Ovejita bomba!'],r:['¡Pum, pum!','¡Cachetada de plomo!'],k:['¡Ay, mi madre!','¡Me voy pa\' el cielo!','¡Adiós, mundo cruel!','¡Mamita!'],w:['¡Glu, glu, glu!','¡Me mojé!'],v:['¡Ganamos, ganamos!','¡Soy el mejor gusano!'],h2:['¡Ouch!','¡Eso dolió!','¡Ay, ay, ay!'],t:['¡Mi turno!','¡Ahora me toca a mí!','¡Vamos, gusanitos!'],o:['¡Oh! Eso dolió','¡Ay! Eso dolió','¡Auch, mi colita!','¡Qué aterrizaje!']};
const VE={b:['Fire!','Take that!','Watch this!'],h:['Watch this!','Get him!'],g:['Incoming!','Catch!'],d:['Dynamite!','Run away!'],a:['Air strike!','Incoming!'],s:['Baaa!','Sheep!'],r:['Take that!','Boom!'],k:['Oh dear!','Aargh!','Bye bye!'],w:['Splash!','Glug glug!'],v:['Victory!','Yes!'],h2:['Ow!','Ouch!','Oh no!'],t:['My turn!','Here I come!','Ready!'],o:['Oh! That hurt!','Ouch! My tail!','Ow! What a landing!']};
let V=VS,vm='c';

let mus=false,mi=0;const sc=[0,3,7,10,7,3];
const MEL=[0,4,7,9,7,4,2,4,0,4,7,12,9,7,4,2],BAS=[0,0,7,7,5,5,7,7];
setInterval(()=>{if(!mus||!ac||ac.state!=='running')return;const i=mi++;if(i%2===0)_tone(110*2**(BAS[(i>>1)%8]/12),.25,'triangle',.07,0);if(i%2===0||i%4===3)_tone(440*2**(MEL[i%16]/12),.14,'square',.022,0);if(i%4===0)_tone(70,.09,'sine',.12,-30)},170);
// ---------- terrain ----------
const solid=(x,y)=>{x|=0;y|=0;return x<0||x>=W||y<0||y>=H?0:mask[y*W+x]};
function genTerrain(){
 tg.globalCompositeOperation='source-over';tg.clearRect(0,0,W,H);
 const p=[R(0,6),R(0,6),R(0,6)];
 const hy=x=>330+60*Math.sin(x/170+p[0])+35*Math.sin(x/70+p[1])+15*Math.sin(x/31+p[2])+230*Math.pow(Math.abs(x-W/2)/(W/2),4);
 const gr=tg.createLinearGradient(0,250,0,H);gr.addColorStop(0,th.a);gr.addColorStop(1,th.b);
 tg.fillStyle=gr;tg.beginPath();tg.moveTo(0,H);
 for(let x=0;x<=W;x+=4)tg.lineTo(x,hy(x));
 tg.lineTo(W,H);tg.fill();
 tg.strokeStyle=th.top;tg.lineWidth=5;tg.beginPath();
 for(let x=0;x<=W;x+=4)x?tg.lineTo(x,hy(x)):tg.moveTo(x,hy(x));tg.stroke();
 for(let i=0;i<6;i++){const bx=100+i*(W-200)/5+R(-40,40),by=R(95,170),rx=R(55,100),ry=R(16,26);
  tg.fillStyle='#74747c';tg.strokeStyle='#2a1c14';tg.lineWidth=2;tg.beginPath();
  for(let k=0;k<14;k++){const an=k/14*6.283,q=R(.82,1.12),px=bx+Math.cos(an)*rx*q,py=by+Math.sin(an)*ry*q;k?tg.lineTo(px,py):tg.moveTo(px,py)}tg.closePath();tg.fill();tg.stroke();
  tg.strokeStyle='#b4b4bc';tg.lineWidth=3;tg.beginPath();tg.ellipse(bx,by-2,rx*.9,ry*.8,0,Math.PI*1.1,Math.PI*1.9);tg.stroke()}
 tg.globalCompositeOperation='source-atop';
 for(let i=0;i<1400;i++){tg.fillStyle=Math.random()<.5?'rgba(0,0,0,.22)':'rgba(255,230,180,.16)';tg.fillRect(R(0,W),R(250,H),R(1,3),R(1,3))}
 const RC=['#8a8a92','#6c6c74','#a04a3c','#585860','#b0804e','#587a3e'];
 for(let i=0;i<90;i++){const cx=R(0,W),cy=R(hy(cx)+14,H-20),rr=R(7,22),n=5+(Math.random()*3|0);tg.fillStyle=RC[Math.random()*6|0];tg.strokeStyle='#2a1c14';tg.lineWidth=1.5;tg.beginPath();
  for(let k=0;k<n;k++){const an=k/n*6.283,q=R(.6,1.1),px=cx+Math.cos(an)*rr*q,py=cy+Math.sin(an)*rr*q*.8;k?tg.lineTo(px,py):tg.moveTo(px,py)}tg.closePath();tg.fill();tg.stroke()}
 tg.strokeStyle='#6f8f3c';tg.lineWidth=6;for(let x=0;x<W;x+=6){if(Math.sin(x/37+p[0])>.35){tg.beginPath();tg.moveTo(x,hy(x)+1);tg.lineTo(x+6,hy(x+6)+1);tg.stroke()}}
 tg.globalCompositeOperation='source-over';
 for(let i=0;i<10;i++){const x=R(0,W),r=R(6,20),y=hy(x)+r+R(12,200);
  tg.globalCompositeOperation='source-atop';tg.fillStyle=th.rim;tg.beginPath();tg.arc(x,y,r+3,0,7);tg.fill();
  tg.globalCompositeOperation='destination-out';tg.beginPath();tg.arc(x,y,r,0,7);tg.fill();}
 tg.globalCompositeOperation='source-over';
 const d=tg.getImageData(0,0,W,H).data;mask=new Uint8Array(W*H);
 for(let i=0;i<W*H;i++)mask[i]=d[i*4+3]>128?1:0;

}
function carve(x,y,r){
 tg.globalCompositeOperation='destination-out';tg.beginPath();tg.arc(x,y,r,0,7);tg.fill();tg.globalCompositeOperation='source-over';
 for(let j=Math.max(0,y-r|0);j<Math.min(H,y+r);j++)for(let i=Math.max(0,x-r|0);i<Math.min(W,x+r);i++)if((i-x)**2+(j-y)**2<r*r)mask[j*W+i]=0;
}
// ---------- worms ----------
const blocked=(x,y)=>solid(x,y-2)||solid(x-3,y-4)||solid(x+3,y-4)||solid(x,y-8);
const ground=(x,y)=>solid(x,y+1)||solid(x-2,y+1)||solid(x+2,y+1);
function hurt(w,d){if(isClient||w.dead||d<=0)return;w.hp-=d;if(d>=15&&Math.random()<.5)say(pk(V.h2),w);if(w.n){w.hu=45;tone(1100,.12,'sine',.12,500);pops.push({x:w.x,y:w.y-78,s:''+d,l:60})}if(w.hp<=0)kill(w)}
function kill(w,water){if(w.dead)return;w.dead=true;w.hp=0;w.dt=0;if(water){w.water=1;w.wd=1;for(let i=0;i<20;i++)parts.push({x:w.x,y:WL,vx:R(-2,2),vy:R(-6,-2),l:40,c:'#c8d4ff'})}noise(.4,.2);if(!water)sadT();else tone(300,.5,'sawtooth',.1,-250);if(Math.random()<.8)say(pk(water?V.w:V.k),w)}
function stepWorm(w){
 if(w.dead&&w.wd)return;if(w.dead)w.vx*=.8;
 const gr=ground(w.x,w.y);
 if(gr&&w.vy>=0){w.flip=0;w.rot=0;if(w.drop){w.drop=0;w.hu=60;tone(90,.2,'sine',.2,-50);tone(950,.12,'sine',.12,-300);if(Math.random()<.65&&(!bub||bub.l<=0))say(pk(V.o),w)}else if(w.vy>7)hurt(w,Math.floor((w.vy-6)*4));if(w.vy>2.5&&w.n)tone(90,.1,'sine',.15,-50);if(w.vy>2.5&&w.n)for(let i=0;i<5;i++)parts.push({x:w.x+R(-4,4),y:w.y,vx:R(-1,1),vy:R(-1,0),l:20,a:20,g:0,r:R(1.5,3),c:'#e8d8b0'});w.vy=0;w.vx*=.8;if(Math.abs(w.vx)<.1)w.vx=0}
 else{w.vy=Math.min(12,w.vy+.28)}
 if(w.vx){const nx=w.x+w.vx;let ok=false;for(let h=0;h<=(gr?4:0);h++)if(!blocked(nx,w.y-h)){w.x=nx;w.y-=h;ok=true;break}if(!ok)w.vx*=-.3}

 if(w.rope){const q=w.rope,dx=w.x-q.x,dy=w.y-5-q.y,d=Math.hypot(dx,dy);if(d>q.len){const nx=dx/d,ny=dy/d,px=q.x+nx*q.len,py=q.y+ny*q.len+5;if(!blocked(px,py)){w.x=px;w.y=py}const vr=w.vx*nx+w.vy*ny;if(vr>0){w.vx-=vr*nx;w.vy-=vr*ny}}}

 else if(wk==='s')projs.push({k:'s',x:w.x,y:w.y,vx:0,vy:0,hp:9e9,d:w.d,t:0});
 else if(wk==='h'){const a2=w.a*Math.PI/180;projs.push({k:'b',h:1,tx:ax,ty:ay,x:w.x+w.d*Math.cos(a2)*12,y:w.y-14-Math.sin(a2)*12,vx:w.d*Math.cos(a2)*5,vy:-Math.sin(a2)*5,t:0,r:36,dm:55});ax=null}
 else if(wk==='a'){tone(1400,.9,'sine',.06,-1000);for(let i=0;i<5;i++)projs.push({k:'b',x:ax-80+i*40,y:-20-i*45,vx:0,vy:5,t:0,r:30,dm:30});ax=null}
 
 else projs.push({k:wk,x:w.x+w.d*Math.cos(a)*10,y:w.y-6-Math.sin(a)*10,vx:w.d*Math.cos(a)*sp,vy:-Math.sin(a)*sp,t:0});
