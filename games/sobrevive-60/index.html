<!DOCTYPE html>
<!-- SOBREVIVE 60 SEGUNDOS — versión de UN SOLO ARCHIVO: el juego completo (HTML + CSS + todos los scripts) dentro de este .html. Funciona sin conexión; basta con abrirlo. -->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#08050f">
  <title>Sobrevive 60 segundos</title>
  <style>
/* ==========================================================
   SOBREVIVE 60 SEGUNDOS — estilo arcade / neón
   Solo fuentes del sistema: funciona sin conexión.
   ========================================================== */

:root {
  --bg: #08050f;
  --cyan: #22f3ff;
  --magenta: #ff2d8a;
  --yellow: #ffe04a;
  --violet: #7b4dff;
  --ink: #f3efff;
  --muted: #a79fc9;
  --xp: #3dffb0;

  --font-display: "Impact", "Haettenschweiler", "Arial Narrow Bold", "sans-serif-condensed", "Arial Narrow", sans-serif;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

*,
*::before,
*::after { box-sizing: border-box; }

[hidden] { display: none !important; }

html, body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}

#app {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  background: radial-gradient(ellipse at 50% 40%, #1a0d38 0%, var(--bg) 70%);
}

/* ---------------------------- HUD ---------------------------- */

.hud {
  position: relative;
  z-index: 2;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 12px;
  padding:
    calc(env(safe-area-inset-top, 0px) + 10px)
    calc(env(safe-area-inset-right, 0px) + 14px)
    8px
    calc(env(safe-area-inset-left, 0px) + 14px);
}

.hud.is-off { visibility: hidden; }

.hud-hp {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.hp-track {
  position: relative;
  flex: 1 1 auto;
  max-width: 240px;
  height: 16px;
  border: 2px solid var(--cyan);
  background: rgba(8, 5, 15, 0.85);
  box-shadow: 0 0 12px rgba(34, 243, 255, 0.35), inset 0 0 8px rgba(34, 243, 255, 0.2);
  transform: skewX(-14deg);
  overflow: hidden;
}

.hp-fill,
.hp-ghost {
  position: absolute;
  top: 0;
  left: 0;
  bottom: 0;
  width: 100%;
}

.hp-fill {
  background: linear-gradient(90deg, #12b8ff, var(--cyan));
  transition: width 0.12s linear;
}

/* Rastro amarillo del daño recibido: se vacía más despacio que la barra */
.hp-ghost {
  background: var(--yellow);
  transition: width 0.7s ease 0.25s;
}

.hud-hp.is-low .hp-track {
  border-color: var(--magenta);
  box-shadow: 0 0 14px rgba(255, 45, 138, 0.55), inset 0 0 8px rgba(255, 45, 138, 0.3);
}
.hud-hp.is-low .hp-fill { background: linear-gradient(90deg, var(--magenta), #ff7ab5); }

.hp-value {
  font-family: var(--font-display);
  font-size: 26px;
  line-height: 1;
  min-width: 3ch;
  color: var(--ink);
  text-shadow: 0 0 10px rgba(34, 243, 255, 0.6);
  font-variant-numeric: tabular-nums;
}
.hud-hp.is-low .hp-value { text-shadow: 0 0 10px rgba(255, 45, 138, 0.8); }

.hud-time {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}

.time-value {
  min-width: 2ch;
  text-align: center;
  font-family: var(--font-display);
  font-size: clamp(42px, 9vw, 62px);
  line-height: 0.9;
  color: var(--ink);
  text-shadow: 0 0 12px rgba(255, 224, 74, 0.75), 0 0 34px rgba(255, 224, 74, 0.35);
  font-variant-numeric: tabular-nums;
}

.time-value.is-danger {
  color: #ff9cc8;
  text-shadow: 0 0 12px var(--magenta), 0 0 34px rgba(255, 45, 138, 0.55);
  animation: tick 1s ease-in-out infinite;
}

/* Una barra por oleada: se rellena con el tiempo y marca en qué tramo estás */
.time-segs { display: flex; gap: 3px; }

.seg {
  width: clamp(16px, 4.6vw, 28px);
  height: 5px;
  background: rgba(255, 255, 255, 0.12);
  transform: skewX(-20deg);
  overflow: hidden;
}

.seg > i {
  display: block;
  height: 100%;
  background: var(--yellow);
  transform-origin: left center;
  transform: scaleX(0);
}

.hud-phase {
  justify-self: end;
  text-align: right;
  min-width: 0;
  font-family: var(--font-display);
  font-size: clamp(14px, 3.6vw, 18px);
  letter-spacing: 0.08em;
  color: var(--muted);
}

/* ---------------------------- Arena ---------------------------- */

.stage {
  position: relative;
  flex: 1 1 0;
  min-width: 0;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  overflow: hidden;
  touch-action: none;
}

#game {
  display: block;
  touch-action: none;
}

.banner {
  position: absolute;
  left: 0;
  right: 0;
  top: 15%;
  text-align: center;
  font-family: var(--font-display);
  font-size: clamp(30px, 8vw, 62px);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink);
  text-shadow: 0 0 16px var(--cyan), 0 0 42px rgba(34, 243, 255, 0.5);
  opacity: 0;
  pointer-events: none;
}

.banner.is-hot {
  text-shadow: 0 0 16px var(--magenta), 0 0 42px rgba(255, 45, 138, 0.6);
}

/* Joystick virtual flotante: aparece donde pones el dedo */
.joystick {
  position: fixed;
  z-index: 4;
  border-radius: 50%;
  border: 2px solid rgba(34, 243, 255, 0.55);
  background: radial-gradient(circle, rgba(34, 243, 255, 0.16), rgba(34, 243, 255, 0.04) 70%);
  box-shadow: 0 0 18px rgba(34, 243, 255, 0.25);
  pointer-events: none;
}

.joystick-knob {
  position: absolute;
  left: 50%;
  top: 50%;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #ffffff, var(--cyan) 55%, #0aa5b3);
  box-shadow: 0 0 16px var(--cyan);
  pointer-events: none;
}

/* ------------------------- Pantallas ------------------------- */

.screen {
  position: absolute;
  inset: 0;
  z-index: 5;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start; /* con margin:auto en el primero y el último queda centrado si cabe, y se desplaza desde arriba si no */
  gap: clamp(8px, 1.9vh, 22px);
  padding: 24px;
  text-align: center;
  overflow-y: auto;
  background: radial-gradient(ellipse at center, rgba(8, 5, 15, 0.5) 0%, rgba(8, 5, 15, 0.9) 85%);
  animation: screen-in 0.35s ease-out both;
}

.title {
  margin: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  font-family: var(--font-display);
  font-weight: 400;
  line-height: 0.85;
}

.title-top {
  font-size: clamp(24px, min(9vw, 8vh), 68px);
  letter-spacing: 0.16em;
  margin-right: -0.16em;
  color: var(--ink);
  text-shadow: 0 0 16px rgba(34, 243, 255, 0.55);
}

/* El "60" es el rótulo de neón: lo único que parpadea al encender */
.title-big {
  font-size: clamp(72px, min(30vw, 24vh), 260px);
  color: #ffffff;
  text-shadow:
    0 0 6px #ffffff,
    0 0 22px var(--cyan),
    0 0 60px var(--cyan),
    0 0 110px rgba(34, 243, 255, 0.5);
  animation: neon-on 1.4s linear both, title-hue 18s linear infinite; /* el resplandor recorre todos los colores */
}

.title-bottom {
  font-size: clamp(20px, min(7vw, 6.5vh), 52px);
  letter-spacing: 0.42em;
  margin-right: -0.42em;
  color: var(--magenta);
  text-shadow: 0 0 14px var(--magenta), 0 0 36px rgba(255, 45, 138, 0.5);
}

.lead {
  margin: 0;
  max-width: 34ch;
  font-size: clamp(16px, 2.6vw, 20px);
  line-height: 1.45;
  color: var(--ink);
}

.hint {
  margin: 0;
  font-size: 15px;
  color: var(--muted);
}
.hint-touch { display: none; }

@media (pointer: coarse) {
  .hint-keys { display: none; }
  .hint-touch { display: inline; }
}

.result-title {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(48px, min(13vw, 14vh), 112px);
  letter-spacing: 0.06em;
  line-height: 0.95;
}

.result-title.is-lose {
  color: #ffd0e6;
  text-shadow: 0 0 14px var(--magenta), 0 0 46px var(--magenta), 0 0 90px rgba(255, 45, 138, 0.5);
}

.result-title.is-win {
  color: #fff8d6;
  text-shadow: 0 0 14px var(--yellow), 0 0 46px var(--yellow), 0 0 90px rgba(255, 224, 74, 0.5);
}

.result-detail {
  margin: 0;
  max-width: 30ch;
  font-size: clamp(17px, 2.8vw, 22px);
  line-height: 1.4;
  color: var(--ink);
}

.actions {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

/* ------------------------- Botones ------------------------- */

.btn {
  min-width: min(270px, 78vw);
  min-height: 54px;
  padding: 0 34px;
  border: 2px solid var(--cyan);
  background: rgba(34, 243, 255, 0.06);
  color: var(--cyan);
  font-family: var(--font-display);
  font-size: clamp(22px, 4.5vw, 28px);
  letter-spacing: 0.14em;
  cursor: pointer;
  transform: skewX(-12deg);
  transition: transform 0.12s ease, background-color 0.12s ease, box-shadow 0.12s ease, color 0.12s ease;
}

.btn > span { display: block; transform: skewX(12deg); }

.btn:hover {
  background: rgba(34, 243, 255, 0.18);
  box-shadow: 0 0 22px rgba(34, 243, 255, 0.45);
  transform: skewX(-12deg) translateY(-2px);
}

.btn:active { transform: skewX(-12deg) scale(0.97); }

.btn:focus-visible {
  outline: 3px solid var(--yellow);
  outline-offset: 4px;
}

.btn-primary {
  background: var(--cyan);
  color: #05121a;
  box-shadow: 0 0 24px rgba(34, 243, 255, 0.55);
}

.btn-primary:hover {
  background: #7ffaff;
  box-shadow: 0 0 36px rgba(34, 243, 255, 0.85);
}

.btn-small {
  min-width: 0;
  min-height: 44px;
  padding: 0 22px;
  font-size: 16px;
  letter-spacing: 0.1em;
}

.btn-quiet {
  border-color: rgba(167, 159, 201, 0.55);
  color: var(--muted);
  background: transparent;
}

.btn-quiet:hover {
  color: var(--ink);
  border-color: var(--ink);
  background: rgba(255, 255, 255, 0.06);
  box-shadow: none;
}

/* ------------------------- Animaciones ------------------------- */

@keyframes screen-in {
  from { opacity: 0; transform: scale(1.03); }
  to   { opacity: 1; transform: none; }
}

@keyframes neon-on {
  0%   { opacity: 0.1; }
  8%   { opacity: 1; }
  12%  { opacity: 0.15; }
  20%  { opacity: 1; }
  26%  { opacity: 0.4; }
  32%  { opacity: 1; }
  100% { opacity: 1; }
}

@keyframes tick {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.14); }
}

@media (prefers-reduced-motion: reduce) {
  .screen, .title-big, .combo.is-pop .combo-num, .time-value.is-danger { animation: none; }
  .btn, .hp-fill, .hp-ghost { transition: none; }
}

/* ------------------------- XP y nivel (HUD) ------------------------- */

.hud-xp {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 2px;
}

.level-label {
  min-width: 4.4ch;
  font-family: var(--font-display);
  font-size: 15px;
  letter-spacing: 0.08em;
  color: var(--xp);
  text-shadow: 0 0 8px rgba(61, 255, 176, 0.6);
}

.xp-track {
  position: relative;
  flex: 1 1 auto;
  height: 8px;
  border: 1.5px solid var(--xp);
  background: rgba(8, 5, 15, 0.85);
  box-shadow: 0 0 10px rgba(61, 255, 176, 0.25);
  transform: skewX(-14deg);
  overflow: hidden;
}

.xp-fill {
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, #17c98a, var(--xp));
  transform-origin: left center;
  transform: scaleX(0);
  transition: transform 0.12s linear;
}

.hud-xp.is-pop .level-label { animation: pop 0.55s ease-out; }
.hud-xp.is-pop .xp-track { animation: glow-pulse 0.55s ease-out; }

/* ------------------------- Dash y mejoras en pantalla ------------------------- */

.dash-btn {
  position: absolute;
  z-index: 3;
  right: calc(env(safe-area-inset-right, 0px) + 14px);
  bottom: 14px;
  width: 70px;
  height: 70px;
  padding: 0;
  display: grid;
  place-items: center;
  border: 2px solid rgba(34, 243, 255, 0.5);
  border-radius: 50%;
  background: rgba(8, 5, 15, 0.72);
  color: var(--ink);
  cursor: pointer;
  overflow: hidden;
  touch-action: none;
  transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease;
}

/* El velo oscuro se "vacía" a medida que se recarga (--cd = % de recarga pendiente) */
.dash-btn::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: conic-gradient(rgba(8, 5, 15, 0.82) var(--cd, 0%), transparent 0);
  pointer-events: none;
}

.dash-btn.is-ready {
  border-color: var(--cyan);
  box-shadow: 0 0 18px rgba(34, 243, 255, 0.55);
}

.dash-btn:active { transform: scale(0.94); }
.dash-btn:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }

.dash-icon { position: relative; font-size: 28px; line-height: 1; margin-top: -6px; }

.dash-key {
  position: absolute;
  bottom: 9px;
  left: 0;
  right: 0;
  text-align: center;
  font-family: var(--font-display);
  font-size: 9px;
  letter-spacing: 0.1em;
  color: var(--muted);
}

@media (pointer: coarse) { .dash-key { display: none; } .dash-icon { margin-top: 0; } }

.buffs {
  position: absolute;
  z-index: 2;
  left: calc(env(safe-area-inset-left, 0px) + 10px);
  bottom: 12px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  max-width: 62%;
  pointer-events: none;
}

.buff {
  padding: 2px 8px;
  border: 1px solid var(--c, var(--cyan));
  background: rgba(8, 5, 15, 0.72);
  font-size: 13px;
  line-height: 1.5;
  color: var(--ink);
  transform: skewX(-10deg);
}

.buff.is-max { background: rgba(255, 255, 255, 0.14); }

@keyframes pop {
  0%   { transform: scale(1); }
  35%  { transform: scale(1.35); }
  100% { transform: scale(1); }
}

@keyframes glow-pulse {
  0%   { box-shadow: 0 0 10px rgba(61, 255, 176, 0.25); }
  35%  { box-shadow: 0 0 26px rgba(61, 255, 176, 0.95); }
  100% { box-shadow: 0 0 10px rgba(61, 255, 176, 0.25); }
}

@media (prefers-reduced-motion: reduce) {
  .hud-xp.is-pop .level-label, .hud-xp.is-pop .xp-track, .toast { animation: none; }
}

/* Aviso si el juego no puede arrancar (faltan archivos o hay un error) */
.boot-error {
  margin: 0;
  max-width: 46ch;
  padding: 12px 16px;
  border: 2px solid var(--magenta);
  background: rgba(255, 45, 138, 0.12);
  box-shadow: 0 0 18px rgba(255, 45, 138, 0.35);
  font-size: 15px;
  line-height: 1.45;
  color: #ffd0e6;
  -webkit-user-select: text;
  user-select: text;
}

.screen > :first-child { margin-top: auto; }
.screen > :last-child { margin-bottom: auto; }

/* Pantallas muy bajas (móvil apaisado): menú más compacto */
@media (max-height: 700px) {
  #menuScreen .lead { display: none; }
}

@media (max-height: 460px) {
  .screen { gap: 6px; padding: 10px 24px; }
  #menuScreen .lead, #menuScreen .hint, .mode-label, .mode-desc { display: none; }
  .title-big { font-size: min(22vh, 120px); }
  .title-top { font-size: min(8vh, 40px); }
  .title-bottom { font-size: min(6vh, 28px); }
}

/* ------------------------- Niveles (1-99) ------------------------- */

.hud-level {
  display: block;
  font-size: clamp(15px, 3.8vw, 20px);
  letter-spacing: 0.12em;
  color: var(--yellow);
  text-shadow: 0 0 10px rgba(255, 224, 74, 0.55);
}

.menu-level {
  margin: -6px 0 0;
  font-size: 15px;
  color: var(--yellow);
  letter-spacing: 0.04em;
}

.menu-row {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
}

.levels-title {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(34px, min(8vw, 8vh), 64px);
  letter-spacing: 0.1em;
  color: #ffffff;
  text-shadow: 0 0 10px rgba(255, 255, 255, 0.7), 0 0 34px rgba(255, 224, 74, 0.55);
}

.level-grid {
  display: grid;
  grid-template-columns: repeat(10, minmax(0, 1fr));
  gap: 8px;
  width: min(720px, 100%);
  max-height: min(52vh, 440px);
  padding: 10px;
  overflow-y: auto;
  border: 1px solid rgba(167, 159, 201, 0.3);
  background: rgba(8, 5, 15, 0.55);
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}

.lvl {
  min-height: 44px;
  padding: 0;
  border: 2px solid rgba(34, 243, 255, 0.55);
  background: rgba(34, 243, 255, 0.07);
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 18px;
  cursor: pointer;
  transition: transform 0.1s ease, background-color 0.12s ease, box-shadow 0.12s ease;
}

.lvl:hover:not(:disabled) { background: rgba(34, 243, 255, 0.22); box-shadow: 0 0 14px rgba(34, 243, 255, 0.5); transform: translateY(-2px); }
.lvl:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
.lvl.is-done { border-color: var(--xp); background: rgba(61, 255, 176, 0.14); color: var(--xp); }
.lvl.is-current { border-color: var(--yellow); background: rgba(255, 224, 74, 0.2); color: var(--yellow); box-shadow: 0 0 16px rgba(255, 224, 74, 0.5); }
.lvl.is-locked, .lvl:disabled { border-color: rgba(167, 159, 201, 0.22); background: transparent; color: rgba(167, 159, 201, 0.4); cursor: not-allowed; }

@media (max-width: 640px) {
  .level-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); max-height: min(50vh, 420px); }
}

/* ------------------------- Avisos de poder (no pausan el juego) ------------------------- */

.toasts {
  position: absolute;
  z-index: 3;
  left: 0;
  right: 0;
  top: 14%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  pointer-events: none;
}

.toast {
  --c: var(--cyan);
  display: flex;
  align-items: center;
  gap: 12px;
  max-width: min(92%, 440px);
  padding: 8px 18px 8px 12px;
  border: 2px solid var(--c);
  background: rgba(8, 5, 15, 0.84);
  box-shadow: 0 0 22px color-mix(in srgb, var(--c) 45%, transparent);
  animation: toast-in 0.35s cubic-bezier(0.2, 0.9, 0.2, 1.15) both;
  transition: opacity 0.4s ease, transform 0.4s ease;
}

.toast.is-out { opacity: 0; transform: translateY(-10px); }

.toast-icon { font-size: 30px; line-height: 1; filter: drop-shadow(0 0 8px var(--c)); }
.toast-text { display: flex; flex-direction: column; text-align: left; line-height: 1.15; }

.toast-name {
  font-family: var(--font-display);
  font-size: 19px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #ffffff;
  text-shadow: 0 0 10px var(--c);
}

.toast-effect { font-size: 13px; color: var(--c); }

@keyframes toast-in {
  from { opacity: 0; transform: translateY(-18px) scale(0.92); }
  to   { opacity: 1; transform: none; }
}

/* ------------------------- Dificultad e idioma ------------------------- */

.mode-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  width: min(520px, 100%);
}

.mode-label {
  margin: 0;
  font-family: var(--font-display);
  font-size: 14px;
  letter-spacing: 0.22em;
  color: var(--muted);
}

.mode-row {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
}

.mode-box .mode-row { width: 100%; flex-wrap: nowrap; }

.mode-btn {
  --c: var(--cyan);
  flex: 1 1 0;
  min-width: 0;
  min-height: 44px;
  padding: 0 6px;
  border: 2px solid color-mix(in srgb, var(--c) 45%, transparent);
  background: rgba(8, 5, 15, 0.6);
  color: var(--muted);
  font-family: var(--font-display);
  font-size: clamp(12px, 3.4vw, 16px);
  letter-spacing: 0.06em;
  cursor: pointer;
  transform: skewX(-10deg);
  transition: background-color 0.12s ease, color 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
}

.mode-btn[data-mode="easy"] { --c: #3dffb0; }
.mode-btn[data-mode="medium"] { --c: #22f3ff; }
.mode-btn[data-mode="hard"] { --c: #ff9a3c; }
.mode-btn[data-mode="extreme"] { --c: #ff2d8a; }

.mode-btn:hover { color: var(--ink); border-color: var(--c); }
.mode-btn:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }

.mode-btn.is-active {
  border-color: var(--c);
  background: color-mix(in srgb, var(--c) 22%, rgba(8, 5, 15, 0.7));
  color: #ffffff;
  box-shadow: 0 0 18px color-mix(in srgb, var(--c) 55%, transparent);
}

.mode-desc {
  margin: 0;
  min-height: 2.6em;
  max-width: 40ch;
  font-size: 14px;
  line-height: 1.3;
  color: var(--ink);
  opacity: 0.9;
}

@media (max-width: 420px) {
  .mode-box .mode-row { flex-wrap: wrap; }
  .mode-btn { flex: 1 1 42%; }
}

.lang-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  width: min(460px, 100%);
}

.lang-btn {
  min-height: 56px;
  padding: 0 14px;
  border: 2px solid rgba(34, 243, 255, 0.5);
  background: rgba(34, 243, 255, 0.07);
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 22px;
  letter-spacing: 0.06em;
  cursor: pointer;
  transform: skewX(-8deg);

}

.lang-btn:hover { background: rgba(34, 243, 255, 0.2); box-shadow: 0 0 16px rgba(34, 243, 255, 0.45); }
.lang-btn:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }
.lang-btn.is-active { border-color: var(--yellow); background: rgba(255, 224, 74, 0.18); color: var(--yellow); box-shadow: 0 0 16px rgba(255, 224, 74, 0.45); }

.menu-hp { margin-top: -8px; color: #ff8fb0; }

@keyframes title-hue {
  from { filter: hue-rotate(0deg); }
  to   { filter: hue-rotate(360deg); }
}

/* ------------------------- Combo y efectos activos ------------------------- */

.combo {
  --h: 180;
  position: absolute;
  z-index: 3;
  left: calc(env(safe-area-inset-left, 0px) + 12px);
  top: 10px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  pointer-events: none;
}

.combo-label {
  font-family: var(--font-display);
  font-size: 13px;
  letter-spacing: 0.3em;
  color: var(--muted);
}

.combo-num {
  font-family: var(--font-display);
  font-size: clamp(38px, 9vw, 60px);
  line-height: 0.9;
  background: linear-gradient(90deg, hsl(var(--h), 100%, 66%), hsl(calc(var(--h) + 70), 100%, 66%));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 0 10px hsl(var(--h), 100%, 60%));
}

.combo.is-pop .combo-num { animation: pop 0.3s ease-out; }

.combo-bar {
  width: 110px;
  height: 5px;
  background: rgba(255, 255, 255, 0.14);
  transform: skewX(-20deg);
  overflow: hidden;
}

.combo-bar > i {
  display: block;
  height: 100%;
  background: hsl(var(--h), 100%, 62%);
  transform-origin: left center;
  transform: scaleX(1);
}

.fxbar {
  position: absolute;
  z-index: 3;
  right: calc(env(safe-area-inset-right, 0px) + 12px);
  top: 10px;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 5px;
  pointer-events: none;
}

.fxchip {
  --c: var(--cyan);
  padding: 2px 10px;
  border: 2px solid var(--c);
  background: rgba(8, 5, 15, 0.78);
  box-shadow: 0 0 14px color-mix(in srgb, var(--c) 50%, transparent);
  font-family: var(--font-display);
  font-size: 17px;
  letter-spacing: 0.06em;
  color: #ffffff;
  transform: skewX(-10deg);
}

/* ------------------------- Jefe ------------------------- */

.boss-bar {
  position: absolute;
  z-index: 3;
  top: 8px;
  left: 50%;
  width: min(54%, 460px);
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  pointer-events: none;
}

.boss-name {
  font-family: var(--font-display);
  font-size: clamp(15px, 3.6vw, 22px);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: #ffffff;
  text-shadow: 0 0 12px #ff3b3b, 0 0 28px rgba(255, 59, 59, 0.6);
}

.boss-track {
  position: relative;
  width: 100%;
  height: 14px;
  border: 2px solid #ff3b3b;
  background: rgba(8, 5, 15, 0.85);
  box-shadow: 0 0 16px rgba(255, 59, 59, 0.5);
  transform: skewX(-14deg);
  overflow: hidden;
}

.boss-fill {
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, #ff3b3b, #ffb02e);
  transform-origin: left center;
  transform: scaleX(1);
  transition: transform 0.15s linear;
}

.boss-bar.is-enraged .boss-fill { background: linear-gradient(90deg, #ff0044, #ff3b3b); animation: glow-pulse 0.9s ease-in-out infinite; }

.boss-track .tick {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 2px;
  background: rgba(255, 255, 255, 0.7);
}
.boss-track .t1 { left: 66%; }
.boss-track .t2 { left: 33%; }

/* con jefe en pantalla, el combo y los efectos bajan para no pisar su barra */
.stage.has-boss .combo,
.stage.has-boss .fxbar { top: 62px; }

.lvl.is-boss { position: relative; border-color: #ff3b3b; color: #ffd0d0; }
.lvl.is-boss::after { content: "👑"; position: absolute; top: -9px; right: -5px; font-size: 14px; line-height: 1; }
.lvl.is-boss.is-done { border-color: var(--xp); color: var(--xp); }
.lvl.is-boss.is-locked, .lvl.is-boss:disabled { border-color: rgba(255, 59, 59, 0.3); color: rgba(255, 208, 208, 0.4); }

/* ------------------------- Avisos compactos: una línea, abajo, sin tapar el juego ------------------------- */

.toasts {
  top: auto;
  left: 50%;
  right: auto;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 46px); /* por encima de la lista de poderes */
  transform: translateX(-50%);
  width: min(94%, 400px);
  flex-direction: column-reverse;
  gap: 4px;
}

.toast {
  gap: 8px;
  max-width: 100%;
  padding: 3px 12px 3px 8px;
  border-width: 1.5px;
  background: rgba(8, 5, 15, 0.7);
  box-shadow: 0 0 12px color-mix(in srgb, var(--c) 28%, transparent);
  animation: toast-in-small 0.28s ease-out both;
}

.toast.is-out { transform: translateY(8px); }
.toast-icon { font-size: 18px; filter: drop-shadow(0 0 5px var(--c)); }
.toast-text { flex-direction: row; align-items: baseline; gap: 8px; min-width: 0; }
.toast-name { font-size: 14px; letter-spacing: 0.06em; white-space: nowrap; }
.toast-effect { font-size: 11.5px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

@keyframes toast-in-small {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: none; }
}

/* ------------------------- HUD más delgado: más sitio para la arena ------------------------- */

.hud {
  gap: 2px 12px;
  padding:
    calc(env(safe-area-inset-top, 0px) + 6px)
    calc(env(safe-area-inset-right, 0px) + 14px)
    4px
    calc(env(safe-area-inset-left, 0px) + 14px);
}
.hud-time { gap: 3px; }
.time-value { font-size: clamp(30px, 6vw, 44px); }
.seg { height: 4px; }
.hp-track { height: 14px; }
.hp-value { font-size: 22px; }
.hud-xp { margin-top: 0; gap: 8px; }
.level-label { font-size: 12px; min-width: 4ch; }
.xp-track { height: 6px; }
.hud-level { font-size: clamp(13px, 3.2vw, 17px); }
.hud-phase { font-size: clamp(12px, 3vw, 16px); }

/* Móvil apaisado: el HUD se queda en una franja finísima */
@media (max-height: 520px) {
  .hud { gap: 0 10px; padding-top: calc(env(safe-area-inset-top, 0px) + 3px); padding-bottom: 2px; }
  .time-value { font-size: 26px; }
  .time-segs { display: none; }
  .hp-track { height: 11px; }
  .hp-value { font-size: 18px; }
  .level-label { font-size: 10px; min-width: 3.6ch; }
  .xp-track { height: 4px; }
  .hud-phase { display: flex; gap: 8px; align-items: baseline; justify-content: flex-end; font-size: 11px; }
  .hud-level { display: inline; font-size: 12px; }
}

/* ------------------------- Botones pequeños de música y pantalla completa ------------------------- */

.btn-icon { min-width: 44px; padding-inline: 10px; font-size: 18px; line-height: 1; }
.btn-icon.is-off { opacity: 0.42; }

  <script>
    // Recoge los problemas de carga para poder explicarlos en pantalla si el juego no arranca:
    //  loadFail = archivos que el navegador NO encontró;  crashed = archivos que están pero fallaron al ejecutarse
    window.__boot = { loadFail: [], crashed: [] };
    window.addEventListener('error', function (e) {
      var src = e.target && e.target !== window && (e.target.src || e.target.href);
      if (src) window.__boot.loadFail.push(String(src).split('/').pop().split('?')[0]);
      else window.__boot.crashed.push((e.filename ? String(e.filename).split('/').pop() + ': ' : '') + (e.message || 'error') + (e.lineno ? ' (' + e.lineno + ')' : ''));
    }, true);
  </script>

/* ===== config.js ===== */
'use strict';

/**
 * Toda la configuración jugable vive aquí: cambia un número y recarga la página.
 *
 * Unidades:
 *  - Distancias en "píxeles de mundo" (la arena mide `world.shortSide` en su lado corto).
 *  - Tiempos en segundos.
 *  - Velocidades en píxeles de mundo por segundo.
 */
const GAME_CONFIG = {
  // Duración de la partida (segundos)
  duration: 60,

  // Arena. El mundo se adapta al formato de la pantalla (horizontal en PC, vertical en móvil)
  world: {
    shortSide: 600,   // lado corto de la arena
    minAspect: 0.4,   // límites de proporción ancho/alto de la arena (muy holgados: la arena ocupa TODA la pantalla)
    maxAspect: 2.6,
    maxPixels: 4200000, // tope de píxeles del lienzo: en pantallas enormes o retina baja la resolución para ir fluido
    wallPadding: 10,  // margen entre el borde del canvas y la pared
  },

  // Límites duros de rendimiento: nada puede superarlos, pase lo que pase en la dificultad
  limits: {
    maxEnemies: 40,
    maxPlayerProjectiles: 80,
    maxHostileProjectiles: 40,
    maxParticles: 450,
    maxPickups: 150,       // gemas de XP en el suelo; si se supera, las nuevas se fusionan con una existente
  },

  // Jugador
  player: {
    maxHp: 100,
    speed: 270,           // velocidad máxima
    radius: 13,           // tamaño
    acceleration: 16,     // más alto = respuesta más directa; más bajo = más "deslizante"
    invulnerability: 0.9, // segundos de invulnerabilidad tras recibir daño
    knockback: 380,       // empujón al recibir un golpe

    // Estadísticas de ataque. Los upgrades futuros las modifican con
    // player.stats.add(clave, valor) o player.stats.mul(clave, factor) (ver stats.js).
    attack: {
      damage: 10,
      attackSpeed: 2.5,       // disparos por segundo
      projectileSpeed: 560,
      range: 330,             // alcance: distancia máxima a la que busca objetivo y a la que llega el proyectil
      projectileCount: 1,     // con más de 1 se abren en abanico
    },

    // Aspecto y comportamiento de los proyectiles del jugador
    projectile: {
      radius: 4.5,
      spread: 0.16,       // radianes entre proyectiles cuando son varios
      hitKnockback: 70,   // empujón que recibe el enemigo al ser alcanzado
      color: '#22f3ff',
    },
  },

  /**
   * Tipos de enemigo. Campos comunes:
   *  hp, speed, speedJitter, radius, contactDamage (0 = no daña al tocar), knockback,
   *  hitboxScale, turnRate, color, core, hpBar ('always' | 'damaged' | 'never'),
   *  xp (experiencia total que suelta) y gems (en cuántas gemas se reparte)
   */
  enemies: {
    // Persigue directamente al jugador
    perseguidor: {
      name: 'Perseguidor',
      hp: 30, speed: 105, speedJitter: 0.12, radius: 12,
      contactDamage: 10, knockback: 340, hitboxScale: 0.9, turnRate: 12,
      xp: 4, gems: 1,
      color: '#ff2d8a', core: '#ffb3d6', hpBar: 'damaged',
    },

    // Poca vida, mucha velocidad
    rapido: {
      name: 'Rápido',
      hp: 14, speed: 205, speedJitter: 0.1, radius: 9,
      contactDamage: 8, knockback: 300, hitboxScale: 0.9, turnRate: 18,
      xp: 3, gems: 1,
      color: '#ffe04a', core: '#fff6b0', hpBar: 'never',
    },

    // Grande, lento y con mucha vida
    tanque: {
      name: 'Tanque',
      hp: 160, speed: 55, speedJitter: 0.08, radius: 23,
      contactDamage: 20, knockback: 480, hitboxScale: 0.92, turnRate: 5,
      xp: 20, gems: 3,
      color: '#ff7a1a', core: '#ffd2a8', hpBar: 'always',
    },

    // Persigue y, al acercarse, enciende la mecha y explota. Matarlo antes cancela la explosión.
    explosivo: {
      name: 'Explosivo',
      hp: 24, speed: 118, speedJitter: 0.1, radius: 12,
      contactDamage: 0, knockback: 300, hitboxScale: 0.9, turnRate: 10,
      fuseTrigger: 64,     // distancia al jugador a la que enciende la mecha
      fuseTime: 0.85,      // segundos de aviso antes de explotar
      fuseSpeedMult: 0.6,  // se ralentiza mientras arde la mecha
      blastRadius: 80,     // radio de la explosión (se dibuja como zona de peligro)
      blastDamage: 25,
      xp: 5, gems: 1,
      color: '#b6ff3b', core: '#eaffb8', hpBar: 'damaged',
    },

    // Mantiene la distancia, apunta con un láser y dispara
    francotirador: {
      name: 'Francotirador',
      hp: 28, speed: 90, speedJitter: 0.1, radius: 11,
      contactDamage: 6, knockback: 300, hitboxScale: 0.9, turnRate: 9,
      keepMin: 230, keepMax: 310,  // distancia que intenta mantener
      shootRange: 560,
      fireCooldown: 2.6,   // segundos entre disparos
      aimTime: 1.0,        // duración del aviso (láser visible)
      lockTime: 0.3,       // los últimos segundos del aviso el láser queda fijo: es tu ventana para esquivar
      shotSpeed: 380,

/* ===== stats.js ===== */
'use strict';

/**
 * Estadísticas modificables (base de los upgrades).
 *
 *   const s = Stats.create({ damage: 10, attackSpeed: 2.5 }, { attackSpeed: 6 });
 *   s.get('damage');            // 10
 *   s.add('damage', 5);         // upgrade plano:       (10 + 5) * 1
 *   s.mul('attackSpeed', 1.2);  // upgrade porcentual:  (2.5 + 0) * 1.2
 *   s.peek('damage', 2);        // valor que tendría tras sumar 2 (sin aplicarlo): sirve para previsualizar
 *   s.reset();                  // vuelve a los valores base
 *
 * Valor final = min(techo, (base + suma de bonus planos) * producto de multiplicadores).
 * El segundo parámetro de create() son los techos duros por estadística (opcional):
 * es la red de seguridad para que ninguna combinación de mejoras rompa el juego.
 * Los valores base NO se modifican nunca, así que reiniciar la partida es trivial.
 */
const Stats = (() => {
  function create(base, caps) {
    const mods = {};
    const ensure = (key) => mods[key] || (mods[key] = { add: 0, mul: 1 });
    const cap = (key, v) => (caps && caps[key] !== undefined && v > caps[key] ? caps[key] : v);
    for (const key of Object.keys(base)) ensure(key);

    return {
      base,
      caps: caps || {},
      get(key) {
        const m = ensure(key);
        return cap(key, (base[key] + m.add) * m.mul);
      },
      peek(key, add, mul) {
        const m = ensure(key);
        return cap(key, (base[key] + m.add + (add || 0)) * (m.mul * (mul === undefined ? 1 : mul)));
      },
      add(key, value) { ensure(key).add += value; },
      mul(key, factor) { ensure(key).mul *= factor; },
      reset() {
        for (const key of Object.keys(mods)) { mods[key].add = 0; mods[key].mul = 1; }
      },
    };
  }

  return { create };
})();

/* ===== upgrades.js ===== */
'use strict';

/**
 * UpgradeSystem — sistema de mejoras (roguelike). Es independiente del juego:
 * no toca el DOM, el canvas ni el bucle; solo conoce definiciones y niveles.
 *
 * Una mejora se registra con UpgradeSystem.register({...}). Campos de la definición:
 *   id           identificador único (obligatorio)
 *   icon, name   lo que se ve en el aviso (name puede ser una función: se evalúa al mostrarse, para traducir)
 *   description  opcional: frase corta (también puede ser función)
 *   effect       texto del efecto, o función (nivelSiguiente, ctx) => texto
 *   preview      opcional: (ctx, nivelSiguiente) => "antes → después"
 *   color        color de la tarjeta
 *   maxLevel     veces que se puede elegir (por defecto 1)
 *   weight       probabilidad relativa de salir (por defecto 10)
 *   canOffer     opcional: (ctx, nivelActual) => bool, para condicionar cuándo aparece
 *   apply        (ctx, nivelNuevo) => void   aplica el efecto
 *
 * ctx es el objeto que el juego pasa a las mejoras (player, stats, heal()...).
 * Añadir una mejora nueva = una llamada a register() en upgrade-defs.js; no hay que tocar nada más.
 */
const UpgradeSystem = (() => {
  const defs = {};
  const order = [];
  const levels = {};

  function register(def) {
    if (!def || !def.id) throw new Error('UpgradeSystem.register: falta id');
    if (defs[def.id]) throw new Error('UpgradeSystem.register: mejora duplicada "' + def.id + '"');
    defs[def.id] = Object.assign({
      icon: '✨', name: def.id, description: '', effect: '', preview: null, color: '#ffffff',
      maxLevel: 1, weight: 10, canOffer: null, apply() {},
    }, def);
    order.push(def.id);
    levels[def.id] = 0;
  }

  /** Vuelve todos los niveles a 0 (al empezar una partida). */
  function reset() {
    for (let i = 0; i < order.length; i++) levels[order[i]] = 0;
  }

  const levelOf = (id) => levels[id] || 0;
  const has = (id) => !!defs[id];
  const ids = () => order.slice();

  function isAvailable(id, ctx) {
    const d = defs[id];
    if (!d || levels[id] >= d.maxLevel) return false;
    return d.canOffer ? !!d.canOffer(ctx, levels[id]) : true;
  }

  /** Elige hasta `count` mejoras distintas al azar, según su peso. Las que están al máximo no salen. */
  function roll(count, ctx) {
    const pool = [];
    for (let i = 0; i < order.length; i++) if (isAvailable(order[i], ctx)) pool.push(order[i]);

    const out = [];
    while (out.length < count && pool.length) {
      let total = 0;
      for (let i = 0; i < pool.length; i++) total += Math.max(0, defs[pool[i]].weight);
      let pick = pool.length - 1;
      if (total > 0) {
        let r = Math.random() * total;
        for (let i = 0; i < pool.length; i++) {
          r -= Math.max(0, defs[pool[i]].weight);
          if (r <= 0) { pick = i; break; }
        }
      }
      out.push(pool[pick]);
      pool.splice(pick, 1);
    }
    return out;
  }

  /** Datos para mostrar una mejora como opción (el nivel que tendría al elegirla). */
  function describe(id, ctx) {
    const d = defs[id];
    const next = levels[id] + 1;
    return {
      id,
      icon: d.icon,
      name: typeof d.name === 'function' ? d.name() : d.name,
      color: d.color,
      description: typeof d.description === 'function' ? d.description() : d.description,
      effect: typeof d.effect === 'function' ? d.effect(next, ctx) : d.effect,
      preview: d.preview ? d.preview(ctx, next) : '',
      level: levels[id],
      nextLevel: next,
      maxLevel: d.maxLevel,
      isNew: levels[id] === 0,
    };
  }

  /** Aplica una mejora (sube su nivel). Devuelve el nivel nuevo, o 0 si no se pudo. */
  function apply(id, ctx) {
    const d = defs[id];
    if (!d || levels[id] >= d.maxLevel) return 0;
    levels[id]++;
    d.apply(ctx, levels[id]);
    return levels[id];
  }

  /** Mejoras que ya tiene el jugador. */
  function owned() {
    const out = [];
    for (let i = 0; i < order.length; i++) {
      const id = order[i];
      if (levels[id] > 0) out.push({ id, icon: defs[id].icon, name: typeof defs[id].name === 'function' ? defs[id].name() : defs[id].name, color: defs[id].color, level: levels[id], maxLevel: defs[id].maxLevel });
    }
    return out;
  }

  return { register, reset, levelOf, has, ids, roll, describe, apply, owned };
})();

    'up.shield.effect1': ['Protección de {d} s cada {c} s', 'Protection for {d} s every {c} s', 'Proteção de {d} s a cada {c} s', 'Protection de {d} s toutes les {c} s', '{d} s Schutz alle {c} s', 'Protezione di {d} s ogni {c} s'],
    'up.shield.effect2': ['+{dd} s de protección y −{cc} s de recarga', '+{dd} s protection and −{cc} s cooldown', '+{dd} s de proteção e −{cc} s de recarga', '+{dd} s de protection et −{cc} s de recharge', '+{dd} s Schutz und −{cc} s Abklingzeit', '+{dd} s di protezione e −{cc} s di ricarica'],

    'up.dash.effect2': ['+{dist} de distancia y −{cc} s de recarga', '+{dist} distance and −{cc} s cooldown', '+{dist} de distância e −{cc} s de recarga', '+{dist} de distance et −{cc} s de recharge', '+{dist} Distanz und −{cc} s Abklingzeit', '+{dist} di distanza e −{cc} s di ricarica'],
  };

  let lang = 'es';
  let idx = 0;
  const listeners = [];

  const indexOf = (code) => LANGS.findIndex((l) => l.code === code);

  function detect() {
    try {
      const saved = window.localStorage && window.localStorage.getItem(KEY);
      if (saved && indexOf(saved) >= 0) return saved;
    } catch (_) { /* sin almacenamiento: se usa el idioma del navegador */ }
    const nav = (typeof navigator !== 'undefined' && (navigator.languages || [navigator.language])) || [];
    for (let i = 0; i < nav.length; i++) {
      const code = String(nav[i] || '').slice(0, 2).toLowerCase();
      if (indexOf(code) >= 0) return code;
    }
    return 'es';
  }

  /** Texto traducido. Los {huecos} se sustituyen con params. Si falta la clave, devuelve la clave. */
  function t(key, params) {
    const row = TABLE[key];
    let s = row ? (row[idx] || row[0]) : key;
    if (params) s = s.replace(/\{(\w+)\}/g, (m, k) => (params[k] !== undefined ? params[k] : m));
    return s;
  }

  /** Número con el separador decimal del idioma actual ("2,5" o "2.5"). */
  function num(value, decimals) {
    const s = decimals === undefined ? String(value) : (Math.round(value * Math.pow(10, decimals)) / Math.pow(10, decimals)).toFixed(decimals);
    return lang === 'en' ? s : s.replace('.', ',');
  }

  /** Rellena los textos fijos del HTML (data-i18n, data-i18n-title, data-i18n-aria). */
  function apply(root) {
    const doc = root || document;
    const each = (sel, fn) => { const list = doc.querySelectorAll(sel); for (let i = 0; i < list.length; i++) fn(list[i]); };
    each('[data-i18n]', (el) => { el.textContent = t(el.getAttribute('data-i18n')); });
    each('[data-i18n-title]', (el) => { el.setAttribute('title', t(el.getAttribute('data-i18n-title'))); });
    each('[data-i18n-aria]', (el) => { el.setAttribute('aria-label', t(el.getAttribute('data-i18n-aria'))); });
    if (typeof document !== 'undefined') {
      document.title = t('title.page');
      if (document.documentElement) document.documentElement.lang = lang;
    }
  }

  function setLang(code, silent) {
    const i = indexOf(code);
    if (i < 0) return false;
    lang = code;
    idx = i;
    try { window.localStorage.setItem(KEY, code); } catch (_) { /* ignorar */ }
    apply();
    if (!silent) for (let k = 0; k < listeners.length; k++) listeners[k](code);
    return true;
  }

  const onChange = (fn) => { listeners.push(fn); };

  lang = detect();
  idx = indexOf(lang);

  return { LANGS, TABLE, t, num, apply, setLang, onChange, lang: () => lang, name: () => LANGS[idx].name };
})();

/* ===== upgrade-defs.js ===== */
'use strict';

/**
 * Catálogo de poderes. Para añadir uno nuevo basta con otra llamada a UpgradeSystem.register(...)
 * (y, si hace falta ajustarlo, una entrada en GAME_CONFIG.upgrades y sus textos en i18n.js).
 *
 * Los poderes numéricos modifican player.stats (ver stats.js), que ya aplica los techos de balance.
 * Escudo y Dash guardan solo su nivel; AbilityStats calcula sus valores por nivel.
 * Los textos salen de I18n (name y effect se evalúan al mostrarse, así siguen el idioma elegido).
 */

/** Valores por nivel de las habilidades (los usa el juego y los textos de los avisos). */
const AbilityStats = (() => {
  const U = GAME_CONFIG.upgrades;
  return {
    shieldDuration: (lv) => U.shield.duration + U.shield.durationPerLevel * (lv - 1),
    shieldCooldown: (lv) => Math.max(U.shield.minCooldown, U.shield.cooldown - U.shield.cooldownPerLevel * (lv - 1)),
    dashCooldown: (lv) => Math.max(U.dash.minCooldown, U.dash.cooldown - U.dash.cooldownPerLevel * (lv - 1)),
    dashDistance: (lv) => U.dash.distance + U.dash.distancePerLevel * (lv - 1),
  };
})();

(function registerDefaultUpgrades() {
  const U = GAME_CONFIG.upgrades;
  const t = (key, params) => I18n.t(key, params);
  const pct = (v) => Math.round(v * 100);
  const n1 = (v) => I18n.num(v, 1);
  const n0 = (v) => String(Math.round(v));

  UpgradeSystem.register({
    id: 'speed', icon: '⚡', color: '#22f3ff',
    name: () => t('up.speed.name'),
    maxLevel: U.speed.maxLevel, weight: U.speed.weight,
    effect: () => t('up.speed.effect', { p: pct(U.speed.percent) }),
    apply: (ctx) => ctx.stats.add('moveSpeed', ctx.stats.base.moveSpeed * U.speed.percent),
  });

  UpgradeSystem.register({
    id: 'vitality', icon: '❤️', color: '#ff5f8f',
    name: () => t('up.vitality.name'),
    maxLevel: U.vitality.maxLevel, weight: U.vitality.weight,
    effect: () => t('up.vitality.effect', { hp: U.vitality.hp, heal: U.vitality.heal }),
    apply: (ctx) => {
      ctx.stats.add('maxHp', U.vitality.hp);
      ctx.heal(U.vitality.heal);
    },
  });

  UpgradeSystem.register({
    id: 'damage', icon: '🔥', color: '#ff7a1a',
    name: () => t('up.damage.name'),
    maxLevel: U.damage.maxLevel, weight: U.damage.weight,
    effect: () => t('up.damage.effect', { p: pct(U.damage.percent) }),
    apply: (ctx) => ctx.stats.add('damage', ctx.stats.base.damage * U.damage.percent),
  });

  UpgradeSystem.register({
    id: 'attackSpeed', icon: '🏹', color: '#ffe04a',
    name: () => t('up.attackSpeed.name'),
    maxLevel: U.attackSpeed.maxLevel, weight: U.attackSpeed.weight,
    effect: () => t('up.attackSpeed.effect', { p: pct(U.attackSpeed.percent / (1 + U.attackSpeed.percent)) }),
    apply: (ctx) => ctx.stats.add('attackSpeed', ctx.stats.base.attackSpeed * U.attackSpeed.percent),
  });

  UpgradeSystem.register({
    id: 'magnet', icon: '🧲', color: '#3dffb0',
    name: () => t('up.magnet.name'),
    maxLevel: U.magnet.maxLevel, weight: U.magnet.weight,
    effect: () => t('up.magnet.effect', { p: pct(U.magnet.percent) }),
    apply: (ctx) => ctx.stats.add('pickupRadius', ctx.stats.base.pickupRadius * U.magnet.percent),
  });

  UpgradeSystem.register({
    id: 'multishot', icon: '💥', color: '#b583ff',
    name: () => t('up.multishot.name'),
    maxLevel: U.multishot.maxLevel, weight: U.multishot.weight,
    effect: () => t('up.multishot.effect', { n: U.multishot.extra }),
    apply: (ctx) => ctx.stats.add('projectileCount', U.multishot.extra),
  });

  UpgradeSystem.register({
    id: 'shield', icon: '🛡️', color: '#5ab0ff',
    name: () => t('up.shield.name'),
    maxLevel: U.shield.maxLevel, weight: U.shield.weight,
    effect: (lv) => lv === 1
      ? t('up.shield.effect1', { d: n1(AbilityStats.shieldDuration(1)), c: n0(AbilityStats.shieldCooldown(1)) })
      : t('up.shield.effect2', { dd: n1(U.shield.durationPerLevel), cc: n0(U.shield.cooldownPerLevel) }),
    apply: (ctx, lv) => ctx.grantShield(lv),
  });

  UpgradeSystem.register({
    id: 'dash', icon: '💨', color: '#9ff7ff',
    name: () => t('up.dash.name'),
    maxLevel: U.dash.maxLevel, weight: U.dash.weight,
    effect: (lv) => lv === 1
      ? t('up.dash.effect1', { c: n1(AbilityStats.dashCooldown(1)) })
      : t('up.dash.effect2', { dist: U.dash.distancePerLevel, cc: n1(U.dash.cooldownPerLevel) }),
    apply: () => { /* el nivel basta: el juego lee UpgradeSystem.levelOf('dash') */ },
  });
})();

/* ===== levels.js ===== */
'use strict';

/**
 * Levels — los 99 niveles, las dificultades y el progreso del jugador.
 *
 *  - build(n, modo)   genera la dificultad del nivel n para una dificultad a partir de la plantilla
 *                     GAME_CONFIG.difficulty (nivel 1 = el juego original). Es una función pura: no hay 99 niveles
 *                     escritos a mano, hay UNA fórmula, así que se afina cambiando números en GAME_CONFIG.levels
 *                     y GAME_CONFIG.modes.
 *  - rating(n, modo)  número que resume lo difícil que es (x1,00 = nivel 1 en INTERMEDIO). Crece con el nivel
 *                     y con la dificultad (FÁCIL < INTERMEDIO < DIFÍCIL < EXTREMO).
 *  - mode()/setMode() dificultad elegida. CADA DIFICULTAD ES SU PROPIA CAMPAÑA: el progreso de niveles y el arma
 *                     se guardan por separado.
 *  - unlocked(), isDone(n), complete(n), hasWeapon(), setWeapon(), carryHp()   progreso de la dificultad actual
 *                     (carryHp = vida con la que terminó la última partida ganada),
 *                     guardado en el navegador (localStorage).
 *
 * Los niveles anteriores a weaponLevel son de solo esquivar y suben despacio; desde el arma, la dificultad sube con normalidad.
 * Qué endurece cada nivel: vida, velocidad y daño de los enemigos, cuántos a la vez, con qué frecuencia
 * aparecen, cuántos por aparición y qué tipos (los nuevos se introducen poco a poco).
 */
const Levels = (() => {
  const C = GAME_CONFIG;
  const L = C.levels;
  const M = C.modes;
  const cache = {};
  const KEY = 'sobrevive60-progress';

  const count = L.count;
  const clamp = (n) => Math.min(count, Math.max(1, Math.floor(Number(n)) || 1));
  const validMode = (m) => (M.order.indexOf(m) >= 0 ? m : M.default);

  // Avance de dificultad: lento antes del arma (niveles de esquivar) y normal desde que se encuentra.
  // Crece SIEMPRE con el nivel, así que cada nivel es más difícil que el anterior.
  function effK(level) {
    const w = L.weaponLevel;
    const pre = Math.min(level, w) - 1;
    const post = Math.max(0, level - w);
    return pre * L.preWeaponSlope + post;
  }

  // ---------------- Progreso (se guarda en el navegador, una campaña por dificultad) ----------------
  const freshCampaign = () => ({ unlocked: 1, done: {}, weapon: false, hp: null });
  let state = { mode: M.default, modes: {} };
  M.order.forEach((m) => { state.modes[m] = freshCampaign(); });

  try {
    const raw = window.localStorage && window.localStorage.getItem(KEY);
    if (raw) {
      const p = JSON.parse(raw);
      const load = (src) => {
        const c = freshCampaign();
        if (src && Number.isFinite(src.unlocked)) c.unlocked = clamp(src.unlocked);
        if (src && src.done && typeof src.done === 'object') c.done = src.done;
        if (src && src.weapon === true) c.weapon = true;
        if (src && Number.isFinite(src.hp) && src.hp > 0) c.hp = Math.round(src.hp);
        return c;
      };
      if (p && p.modes) { // formato actual
        M.order.forEach((m) => { state.modes[m] = load(p.modes[m]); });
        state.mode = validMode(p.mode);
      } else if (p) { // formato anterior (una sola campaña): pasa a INTERMEDIO
        state.modes.medium = load(p);
      }
    }
  } catch (_) { /* sin almacenamiento (p. ej. algunos file://): el progreso dura mientras la página siga abierta */ }

  function save() {
    try { window.localStorage.setItem(KEY, JSON.stringify(state)); } catch (_) { /* ignorar */ }
  }

  const mode = () => state.mode;
  const campaign = () => state.modes[state.mode];

  /** Cambia la dificultad (se guarda). Devuelve false si no existe. */
  function setMode(m) {
    if (M.order.indexOf(m) < 0) return false;
    state.mode = m;
    save();
    return true;
  }

  const unlocked = () => campaign().unlocked;
  const isDone = (n) => !!campaign().done[n];
  const doneCount = () => Object.keys(campaign().done).length;

  /** Marca el nivel como superado (en la dificultad actual) y desbloquea el siguiente. */
  function complete(n) {
    n = clamp(n);
    const c = campaign();
    const firstTime = !c.done[n];
    c.done[n] = 1;
    const unlockedNext = n < count && c.unlocked <= n;
    if (n < count) c.unlocked = Math.max(c.unlocked, n + 1);
    save();
    return { firstTime, unlockedNext };
  }

  /** ¿Ya encontraste el arma en esta dificultad? (se guarda para siempre) */
  const hasWeapon = () => campaign().weapon;
  function setWeapon() {
    campaign().weapon = true;
    save();
  }

  /** Vida con la que terminó la última partida ganada de esta dificultad (null = empezar con la vida completa). */
  const carryHp = () => campaign().hp;
  function setCarryHp(v) {
    campaign().hp = v === null || v === undefined ? null : Math.max(1, Math.round(v));
    save();
  }
  const clearCarry = () => setCarryHp(null);

  /** Borra todo el progreso de TODAS las dificultades (conserva la dificultad elegida). */
  function resetProgress() {
    M.order.forEach((m) => { state.modes[m] = freshCampaign(); });
    save();
  }

  // ---------------- Jefes ----------------
  const BC = C.boss;
  /** Número de jefe (1-10) si el nivel es de jefe (10, 20 ... 90 y el último), o 0. */
  function bossTier(level) {
    level = clamp(level);
    if (level === BC.finalLevel) return Math.floor(BC.finalLevel / BC.every) + 1; // jefe final = el 10.º
    return level % BC.every === 0 ? level / BC.every : 0;
  }
  const isBoss = (level) => bossTier(level) > 0;
  // Un nivel de jefe no tiene oleadas: sus tramos no crean enemigos (el jefe manda a sus propios soldados)
  const emptyStages = C.difficulty.map((b) => ({ from: b.from, to: b.to, label: b.label, spawnInterval: 9, batch: 1, maxEnemies: 0, speedMult: 1, hpMult: 1, sizeMult: 1, weights: {}, caps: {} }));

  // ---------------- Generación de niveles ----------------

  /** Dificultad del nivel n en una dificultad: { level, mode, stages[], damageMult, xpMult, playerHpMult, invulnMult }. */
  function build(level, modeId) {
    level = clamp(level);
    modeId = validMode(modeId || state.mode);
    const ck = modeId + ':' + level;
    if (cache[ck]) return cache[ck];

    const md = M[modeId];
    const k = effK(level);
    const cv = L.curve;
    const hp = 1 + cv.hp * k;
    const speed = 1 + cv.speed * k;
    const intervalDiv = 1 + cv.interval * k;
    const enemies = 1 + cv.enemies * k;
    const batchBonus = Math.floor(k / cv.batchEvery);
    const size = Math.min(L.limits.sizeMult, 1 + cv.size * k); // los monstruos crecen con el nivel

    const stages = C.difficulty.map((base, s) => {
      const maxEnemies = Math.max(1, Math.min(C.limits.maxEnemies, Math.round(base.maxEnemies * enemies * md.enemyCount)));
      const weights = {};
      const caps = {};
      for (const id of Object.keys(L.types)) {
        const t = L.types[id];
        if (level < t.unlock) continue;
        // Con los niveles, los tipos ya conocidos empiezan a salir en tramos más tempranos
        const startStage = Math.max(0, t.stage - Math.floor((level - t.unlock) / L.earlierEvery));
        if (s < startStage) continue;
        // Y se introducen poco a poco: un tipo nuevo empieza raro y llega a su peso completo
        const ramp = Math.min(1, (level - t.unlock + 1) / L.introLevels);
        weights[id] = t.weight * ramp;
        if (t.cap !== undefined) {
          const cap = Math.round(t.cap * (1 + s * L.capGrowth.perStage) * (1 + L.capGrowth.perLevel * k) * md.enemyCount);
          caps[id] = Math.max(1, Math.min(cap, maxEnemies));
        }
      }
      return {
        from: base.from,
        to: base.to,
        label: base.label,
        spawnInterval: Math.max(L.limits.minInterval, base.spawnInterval / intervalDiv / md.spawnRate),
        batch: base.batch + batchBonus,
        maxEnemies,
        speedMult: Math.min(L.limits.speedMult, base.speedMult * speed * md.enemySpeed),
        hpMult: base.hpMult * hp * md.enemyHp,
        sizeMult: size,
        weights,
        caps,
      };
    });

    const built = {
      level,
      mode: modeId,
      stages,
      damageMult: (1 + cv.damage * k) * md.enemyDamage,
      xpMult: (1 + cv.xp * k) * md.xp,
      playerHpMult: md.playerHp,
      invulnMult: md.invuln,
      boss: bossTier(level) ? { tier: bossTier(level) } : null,
      bossStages: emptyStages,
    };
    cache[ck] = built;
    return built;
  }

  // Presión total: enemigos simultáneos x ritmo de aparición x vida x velocidad x daño, entre la vida que tienes
  function pressure(level, modeId) {
    const lv = build(level, modeId);
    let sum = 0;
    for (let i = 0; i < lv.stages.length; i++) {
      const st = lv.stages[i];
      sum += st.maxEnemies * Math.sqrt(st.batch / st.spawnInterval) * st.hpMult * st.speedMult * st.sizeMult;
    }
    return (sum * lv.damageMult) / lv.playerHpMult;
  }

  const base1 = pressure(1, 'medium');
  /** Dificultad relativa: x1,00 = nivel 1 en INTERMEDIO. */
  const rating = (level, modeId) => pressure(level, modeId || state.mode) / base1;

  return {
    count, clamp, effK, build, rating,
    weaponLevel: L.weaponLevel,
    modes: M.order, mode, setMode,
    bossTier, isBoss,
    unlocked, isDone, doneCount, complete, hasWeapon, setWeapon, carryHp, setCarryHp, clearCarry, resetProgress,
  };
})();

/**
 * Theme — paleta de colores de la arena. Cada nivel tiene la suya y se repiten cada 8 niveles:
 * fondo, resplandor, rejilla, paredes, esquinas y color de las estrellas del fondo.
 * (El jugador, los enemigos y las alertas mantienen siempre sus colores para que se vean bien en cualquier tema.)
 */
const Theme = (() => {
  const LIST = [
    { id: 'neon',   bg: '#08050f', glow: '#1a0d38', grid: 'rgba(123, 77, 255, 0.16)', wall: '#8f6bff', corner: '#22f3ff', stars: ['#9d7bff', '#22f3ff', '#ffffff'] },
    { id: 'jade',   bg: '#04100c', glow: '#0b3a2c', grid: 'rgba(61, 255, 176, 0.14)', wall: '#3dffb0', corner: '#ffe04a', stars: ['#3dffb0', '#b6ff3b', '#ffffff'] },
    { id: 'sunset', bg: '#130709', glow: '#451519', grid: 'rgba(255, 122, 26, 0.15)', wall: '#ff7a1a', corner: '#ff2d8a', stars: ['#ff9a3c', '#ff5f8f', '#ffe04a'] },
    { id: 'ocean',  bg: '#050a14', glow: '#0d2b52', grid: 'rgba(90, 176, 255, 0.16)', wall: '#5ab0ff', corner: '#9ff7ff', stars: ['#5ab0ff', '#9ff7ff', '#ffffff'] },
    { id: 'candy',  bg: '#10060f', glow: '#3d0f3a', grid: 'rgba(255, 95, 168, 0.16)', wall: '#ff5fa8', corner: '#ffe04a', stars: ['#ff5fa8', '#b583ff', '#ffffff'] },
    { id: 'toxic',  bg: '#0a1004', glow: '#243d0a', grid: 'rgba(182, 255, 59, 0.14)', wall: '#b6ff3b', corner: '#22f3ff', stars: ['#b6ff3b', '#3dffb0', '#ffe04a'] },
    { id: 'aurora', bg: '#060712', glow: '#1b1450', grid: 'rgba(181, 131, 255, 0.16)', wall: '#b583ff', corner: '#3dffb0', stars: ['#b583ff', '#3dffb0', '#9ff7ff'] },
    { id: 'ember',  bg: '#110505', glow: '#4a1008', grid: 'rgba(255, 59, 59, 0.15)', wall: '#ff3b3b', corner: '#ffe04a', stars: ['#ff6a3c', '#ffe04a', '#ffffff'] },

  /** Paleta del nivel n (1-99). */
