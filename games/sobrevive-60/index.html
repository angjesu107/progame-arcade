  <script>
/* ===== pickups.js ===== */
'use strict';

/**
 * Gemas de experiencia (y, más adelante, monedas: ya existe el campo `kind`).
 *
 * - Pool de objetos: nada se crea ni se destruye en pleno juego.
 * - Al morir un enemigo las gemas "saltan" hacia fuera; cuando el jugador entra en el radio de recogida
 *   (stat pickupRadius, que mejora el Imán) vuelan hacia él acelerando hasta ser recogidas.
 * - Límite duro (GAME_CONFIG.limits.maxPickups): si se supera, la gema nueva se fusiona con una existente,
 *   así el jugador nunca pierde XP y el rendimiento no se resiente.
 *
 * API: spawn(x, y, valor, gemas), update(dt, env, player, radio, onCollect), draw(ctx, anim), clear(), count()
 */
const Pickups = (() => {
  const C = GAME_CONFIG;
  const X = C.xp;
  const TAU = Math.PI * 2;

  const pool = [];
  let n = 0; // activos: pool[0 .. n-1]

  const rand = (a, b) => a + Math.random() * (b - a);

  function blank() {
    return { x: 0, y: 0, vx: 0, vy: 0, value: 0, r: 5, age: 0, mag: false, speed: 0, kind: 'xp', tier: 0, seed: 0 };
  }

  function tierOf(v) {
    let t = 0;
    for (let i = 0; i < X.tiers.length; i++) if (v >= X.tiers[i].min) t = i;
    return t;
  }

  function take() {
    if (n === pool.length) pool.push(blank());
    return pool[n++];
  }

  /** Suelta `value` de XP repartido en `gems` gemas alrededor de (x, y). */
  function spawn(x, y, value, gems, kind) {
    value = Math.round(value);
    if (value <= 0) return;
    const count = Math.min(Math.max(1, gems || 1), value);
    const base = Math.floor(value / count);
    const extra = value - base * count; // el resto se reparte de 1 en 1: el total es exacto
    for (let i = 0; i < count; i++) {
      const each = base + (i < extra ? 1 : 0);
      if (n >= C.limits.maxPickups) { // lleno: se fusiona con la gema más antigua
        const o = pool[0];
        o.value += each;
        o.tier = tierOf(o.value);
        o.r = X.tiers[o.tier].size;
        continue;
      }
      const g = take();
      const a = rand(0, TAU);
      const s = count === 1 ? rand(30, 70) : rand(70, 150);
      g.x = x; g.y = y;
      g.vx = Math.cos(a) * s; g.vy = Math.sin(a) * s;
      g.value = each;
      g.kind = kind || 'xp';
      g.tier = tierOf(each);
      g.r = X.tiers[g.tier].size;
      g.age = 0; g.mag = false; g.speed = 0;
      g.seed = rand(0, TAU);
    }
  }

  /**
   * env: { w, h }   player: { x, y, r, alive }   radius: radio de atracción actual
   * onCollect(gema) se llama al recogerla (la gema ya no existe tras la llamada).
   */
  function update(dt, env, player, radius, onCollect) {
    const m = C.world.wallPadding + 4;
    const drag = Math.exp(-4 * dt);
    for (let i = n - 1; i >= 0; i--) {
      const g = pool[i];
      g.age += dt;
      const dx = player.x - g.x;
      const dy = player.y - g.y;
      const d2 = dx * dx + dy * dy;

      if (!g.mag && player.alive && g.age >= X.pickupDelay && d2 < radius * radius) g.mag = true;

      if (g.mag && player.alive) {
        g.speed = Math.min(X.magnetSpeed, g.speed + X.magnetAccel * dt);
        const d = Math.sqrt(d2) || 1;
        const step = Math.min(d, g.speed * dt);
        g.x += (dx / d) * step;
        g.y += (dy / d) * step;
      } else {
        g.vx *= drag; g.vy *= drag;
        g.x += g.vx * dt; g.y += g.vy * dt;
        if (g.x < m) g.x = m; else if (g.x > env.w - m) g.x = env.w - m;
        if (g.y < m) g.y = m; else if (g.y > env.h - m) g.y = env.h - m;
        if (env.maze) env.maze.resolve(g); // una gema nunca se queda dentro de una pared
      }

      const reach = player.r + g.r + 4;
      const ex = player.x - g.x;
      const ey = player.y - g.y;
      if (player.alive && ex * ex + ey * ey < reach * reach) {
        n--;
        pool[i] = pool[n];
        pool[n] = g;
        onCollect(g);
      }
    }
  }

  // Un trazo por estilo y pasada (halo, cuerpo, núcleo): muy pocas llamadas al canvas aunque haya muchas gemas
  function draw(ctx, anim) {
    if (n === 0) return;
    for (let i = 0; i < n; i++) {
      const g = pool[i];
      Art.drawGem(ctx, g.x, g.y, g.r * 1.9, X.tiers[g.tier].color, anim, g.seed);
    }
  }

  function clear() { n = 0; }
  function count() { return n; }

  return { spawn, update, draw, clear, count };
})();

  <script>
/* ===== spawn.js ===== */
'use strict';

/**
 * SpawnManager: decide cuántos enemigos aparecen, con qué frecuencia, de qué tipo y dónde.
 * Lee la dificultad del nivel en curso (un tramo por intervalo de tiempo; la genera levels.js a partir de
 * GAME_CONFIG.difficulty con setDifficulty) y respeta SIEMPRE:
 *   - el tope del tramo (maxEnemies),
 *   - el límite global de rendimiento (GAME_CONFIG.limits.maxEnemies),
 *   - el tope por tipo (caps) si el tramo lo define.
 *
 * API: setDifficulty(tramos), reset(), update(dt, elapsed, env), stageIndexAt(t), stage(i), stageCount()
 */
const SpawnManager = (() => {
  const C = GAME_CONFIG;
  const TAU = Math.PI * 2;
  let timer = 0;
  let diff = C.difficulty; // tramos del nivel en curso

  const rand = (a, b) => a + Math.random() * (b - a);

  /** Cambia la dificultad (al empezar un nivel). */
  function setDifficulty(stages) { diff = stages; }
  const stageCount = () => diff.length;

  function stageIndexAt(t) {
    const st = diff;
    let i = st.length - 1;
    while (i > 0 && t < st[i].from) i--;
    return i;
  }

  function stage(i) { return diff[i]; }

  function reset() {
    timer = diff[0].spawnInterval - C.spawn.firstDelay;
  }

  // ¿Se puede crear este tipo ahora mismo? (peso > 0 y tope por tipo sin alcanzar)
  function allowed(st, id) {
    const w = st.weights ? st.weights[id] : (id === 'perseguidor' ? 1 : 0);
    if (!(w > 0)) return 0;
    const cap = st.caps ? st.caps[id] : undefined;
    if (cap !== undefined && Enemies.countOf(id) >= cap) return 0;
    return w;
  }

  function pickType(st) {
    let total = 0;
    const ws = st.weights || { perseguidor: 1 };
    for (const id in ws) total += allowed(st, id);
    if (total <= 0) return null;
    let r = Math.random() * total;
    let last = null;
    for (const id in ws) {
      const w = allowed(st, id);
      if (w <= 0) continue;
      last = id;
      r -= w;
      if (r <= 0) return id;
    }
    return last;
  }

  // Posición de aparición: lejos del jugador. El francotirador prefiere salir pegado a una pared.
  function pickPoint(id, env, size) {
    const def = C.enemies[id];
    const rr = def.radius * (size || 1);
    const m = C.spawn.wallMargin + rr;
    const P = env.player;
    for (let i = 0; i < 30; i++) {
      let x;
      let y;
      if (id === 'francotirador') {
        const side = (Math.random() * 4) | 0;
        if (side === 0) { x = rand(m, env.w - m); y = m; }
        else if (side === 1) { x = rand(m, env.w - m); y = env.h - m; }
        else if (side === 2) { x = m; y = rand(m, env.h - m); }
        else { x = env.w - m; y = rand(m, env.h - m); }
      } else {
        x = rand(m, env.w - m);
        y = rand(m, env.h - m);
      }
      if (Math.hypot(x - P.x, y - P.y) >= C.spawn.minDistanceFromPlayer && (!env.maze || env.maze.isFree(x, y, rr + 6))) return { x, y };
    }
    // Si no hay hueco (arena pequeña), usa la esquina más lejana al jugador
    return { x: P.x < env.w / 2 ? env.w - m : m, y: P.y < env.h / 2 ? env.h - m : m };
  }

  /**
   * Llamar una vez por frame mientras se juega.
   * env: { w, h, player }
   */
  function update(dt, elapsed, env) {
    const st = diff[stageIndexAt(elapsed)];
    const interval = Math.max(0.05, st.spawnInterval);
    const cap = Math.min(st.maxEnemies, C.limits.maxEnemies);

    timer += dt;
    while (timer >= interval) {
      timer -= interval;
      for (let b = 0; b < (st.batch || 1); b++) {
        if (Enemies.count() >= cap) break;
        const id = pickType(st);
        if (!id) break;
        const p = pickPoint(id, env, st.sizeMult);
        Enemies.spawn(id, p.x, p.y, env.player, st.hpMult || 1, st.sizeMult || 1);
      }
    }
  }

  return { setDifficulty, reset, update, stageIndexAt, stage, stageCount };
})();

  <script>
/* ===== surprise.js ===== */
'use strict';

/**
 * Surprise — orbes sorpresa. Cada pocos segundos (al azar) aparece UNO en el mapa durante `lifetime` segundos;
 * si lo coges, activa un efecto:
 *   freeze  ❄️ congela a los enemigos            nova  💥 explosión que daña a los cercanos
 *   star    ⭐ invencible y daña al tocar         xp2   ✨ XP doble (solo si ya tienes arma)
 * Este módulo sólo decide cuándo y dónde sale cada orbe, lo recoge y lo dibuja; los efectos los aplica el juego
 * (callback onCollect), porque tocan al jugador, a los enemigos y a la XP.
 *
 * API: reset(), update(dt, ctx), draw(ctx2d, anim), meta(tipo), active
 */
const Surprise = (() => {
  const C = GAME_CONFIG;
  const S = C.surprise;
  const TAU = Math.PI * 2;

  const META = {
    freeze: { icon: '❄️', color: '#8fe9ff' },
    nova:   { icon: '💥', color: '#ff9a3c' },
    star:   { icon: '⭐', color: '#ffe04a' },
    xp2:    { icon: '✨', color: '#3dffb0' },
  };

  const orb = { active: false, type: '', x: 0, y: 0, t: 0 };
  let nextIn = 0; // segundos hasta el siguiente orbe

  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

  /** Prepara una partida nueva: el primer orbe saldrá entre firstMin y firstMax segundos. */
  function reset() {
    orb.active = false;
    nextIn = rand(S.firstMin, S.firstMax);
  }

  // Tipo al azar según los pesos (XP doble solo tiene sentido con arma: sin ella no hay XP)
  function pickType(hasWeapon) {
    let total = 0;
    const ids = Object.keys(S.types);
    for (let i = 0; i < ids.length; i++) if (ids[i] !== 'xp2' || hasWeapon) total += S.types[ids[i]].weight;
    let r = Math.random() * total;
    for (let i = 0; i < ids.length; i++) {
      if (ids[i] === 'xp2' && !hasWeapon) continue;
      r -= S.types[ids[i]].weight;
      if (r <= 0) return ids[i];
    }
    return 'freeze';
  }

  function spawn(c) {
    const P = c.player;
    let x = 0;
    let y = 0;
    let found = false;
    for (let i = 0; i < 60 && !found; i++) {
      const a = rand(0, TAU);
      const d = rand(S.minDistance, S.maxDistance);
      x = P.x + Math.cos(a) * d;
      y = P.y + Math.sin(a) * d;
      found = x > S.wallMargin && x < c.w - S.wallMargin && y > S.wallMargin && y < c.h - S.wallMargin && (!c.free || c.free(x, y, S.radius + 8));
    }
    if (!found) {
      x = clamp(P.x < c.w / 2 ? P.x + S.minDistance : P.x - S.minDistance, S.wallMargin, c.w - S.wallMargin);
      y = clamp(P.y, S.wallMargin, c.h - S.wallMargin);
    }
    orb.type = pickType(c.hasWeapon);
    orb.x = x;
    orb.y = y;
    orb.t = S.lifetime;
    orb.active = true;
    if (c.onSpawn) c.onSpawn(orb);
  }

  /**
   * Una vez por frame mientras se juega.
   * c = { w, h, player, elapsed, duration, hasWeapon, onSpawn(orb), onCollect(tipo, orb), onExpire(orb) }
   */
  function update(dt, c) {
    if (!S.enabled) return;
    if (!orb.active) {
      nextIn -= dt;
      // no salen en los últimos segundos: no daría tiempo a cogerlos
      if (nextIn <= 0 && c.elapsed < c.duration - S.lifetime) spawn(c);
      return;
    }
    orb.t -= dt;
    const P = c.player;
    const reach = P.r + S.radius * 0.9;
    const dx = P.x - orb.x;
    const dy = P.y - orb.y;
    if (dx * dx + dy * dy < reach * reach) {
      orb.active = false;
      nextIn = rand(S.gapMin, S.gapMax);
      c.onCollect(orb.type, orb);
    } else if (orb.t <= 0) {
      orb.active = false;
      nextIn = rand(S.gapMin, S.gapMax);
      if (c.onExpire) c.onExpire(orb);
    }
  }

  /** Dibuja el orbe: núcleo oscuro con el icono, aro arcoíris, cuenta atrás y el nombre debajo. */
  function draw(ctx, anim) {
    if (!orb.active) return;
    const m = META[orb.type];
    const r = S.radius;
    const frac = clamp(orb.t / S.lifetime, 0, 1);
    const warn = orb.t < S.warnSeconds;
    const dim = warn && Math.sin(anim * 22) > 0;
    const h = (anim * 140) % 360;

    ctx.save();
    ctx.translate(orb.x, orb.y + Math.sin(anim * 4.5) * 3);

    ctx.globalAlpha = dim ? 0.08 : 0.2;
    ctx.fillStyle = m.color;
    ctx.beginPath();
    ctx.arc(0, 0, r * 2.7, 0, TAU);
    ctx.fill();

    // cuenta atrás
    ctx.globalAlpha = dim ? 0.35 : 0.95;
    ctx.strokeStyle = warn ? C.colors.accent : '#ffffff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, r * 2.1, -Math.PI / 2, -Math.PI / 2 + TAU * frac);
    ctx.stroke();

    // aro arcoíris que gira
    ctx.save();
    ctx.rotate(anim * 2.2);
    ctx.globalAlpha = dim ? 0.4 : 1;
    ctx.lineWidth = 4;
    for (let k = 0; k < 6; k++) {
      ctx.strokeStyle = 'hsl(' + ((h + k * 60) | 0) + ', 100%, 62%)';
      ctx.beginPath();
      ctx.arc(0, 0, r * 1.25, (k * TAU) / 6, (k * TAU) / 6 + TAU / 6 - 0.12);
      ctx.stroke();
    }
    ctx.restore();

    // esfera de cristal con brillo y resplandor del color del efecto (art.js) + icono
    ctx.globalAlpha = dim ? 0.5 : 1;
    Art.glow(ctx, 0, 0, r * 2.6, m.color, 0.7);
    const sph = ctx.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r * 1.05);
    sph.addColorStop(0, 'rgba(255, 255, 255, 0.85)');
    sph.addColorStop(0.3, 'rgba(60, 50, 110, 0.9)');
    sph.addColorStop(1, 'rgba(8, 5, 15, 0.97)');
    ctx.fillStyle = sph;
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.98, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
    ctx.lineWidth = 1.6;
    ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.font = Math.round(r * 1.15) + 'px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(m.icon, 0, 1);

    // nombre
    ctx.globalAlpha = dim ? 0.4 : 1;
    ctx.fillStyle = m.color;
    ctx.font = '700 13px Impact, "Arial Narrow Bold", sans-serif';
    ctx.fillText(I18n.t('sur.' + orb.type).toUpperCase(), 0, r * 2.75);
    ctx.restore();
  }

  const meta = (type) => META[type];

  return { reset, update, draw, meta, pickType, orb, get active() { return orb.active; }, get nextIn() { return nextIn; } };
})();

</script>
  <script>
/* ===== game.js ===== */
'use strict';

/**
 * SOBREVIVE 60 SEGUNDOS — lógica principal.
 *
 * Niveles: 99 niveles de 60 s (levels.js). Ganar uno desbloquea el siguiente; los poderes no pasan de un nivel a otro.
 * Arma: los primeros niveles son solo de esquivar. En `levels.weaponLevel` aparece un objeto en la arena; al recogerlo
 * el disparo automático se desbloquea para siempre. Con arma, cada kill da XP y cada NV da un poder AL AZAR (sin pausar).
 * Terminología: "NIVEL" = el nivel de juego (1-99); "NV" = nivel de experiencia dentro de una partida.
 * Dificultad (FÁCIL / INTERMEDIO / DIFÍCIL / EXTREMO): cada una es su propia campaña y cambia enemigos y vida del jugador.
 * Vida: la vida con la que ganas una partida es la vida con la que empieza la siguiente (si pierdes, vuelves a la completa).
 * Corazón: al empezar cada partida sale un corazón que solo se puede coger durante 6 s.
 * Color y sorpresas: tema de colores por nivel (Theme), estrellas con profundidad, combos con estela arcoíris,
 * confeti, fuegos artificiales al ganar y orbes sorpresa (Surprise: hielo, nova, estrella, XP doble).
 * Jefes y laberintos: cada 10 niveles (y el 99) hay un JEFE (Boss) en una arena con pilares que se gana derrotándolo;
 * desde el nivel 5 hay paredes (Maze) que los monstruos rodean, y los monstruos crecen con el nivel.
 * Idiomas: todos los textos salen de I18n (i18n.js).
 *
 * Estados:  menu -> playing -> ending -> over -> (siguiente/repetir) playing | (menú) menu
 *   menu     pantalla de inicio con la arena de fondo
 *   playing  partida en curso
 *   ending   fracción de segundo de explosión antes de mostrar el resultado
 *   over     pantalla de derrota o victoria visible
 *
 * Módulos: Levels, Enemies, SpawnManager, Projectiles, Pickups (XP), Particles, Sfx, Stats, Input,
 *          UpgradeSystem + upgrade-defs (mejoras).
 *
 * Solo existe UN requestAnimationFrame y ningún setInterval/setTimeout:
 * el tiempo de partida se acumula con dt, así que reiniciar jamás duplica temporizadores.
 */
(() => {
  const C = GAME_CONFIG;
  const FX = C.effects;
  const UP = C.upgrades;
  const TAU = Math.PI * 2;

  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const rand = (lo, hi) => lo + Math.random() * (hi - lo);
  const wrapPi = (a) => {
    while (a > Math.PI) a -= TAU;
    while (a < -Math.PI) a += TAU;
    return a;
  };
  const $ = (id) => document.getElementById(id);
  const t = (key, params) => I18n.t(key, params);

  const PALETTE = [C.colors.player, C.colors.enemy, C.colors.accent, C.colors.violet, '#ffffff'];

  // ------------------------------------------------------------------
  // DOM
  // ------------------------------------------------------------------
  const dom = {
    app: $('app'),
    stage: $('stage'),
    canvas: $('game'),
    hud: $('hud'),
    hpBox: $('hpBox'),
    hpFill: $('hpFill'),
    hpGhost: $('hpGhost'),
    hpValue: $('hpValue'),
    timeValue: $('timeValue'),
    timeSegs: $('timeSegs'),
    phaseName: $('phaseName'),
    levelBadge: $('levelBadge'),
    xpBox: $('xpBox'),
    xpFill: $('xpFill'),
    levelLabel: $('levelLabel'),
    banner: $('banner'),
    buffs: $('buffs'),
    dashBtn: $('dashBtn'),
    joystick: $('joystick'),
    knob: $('joystickKnob'),
    loseDetail: $('loseDetail'),
    winDetail: $('winDetail'),
    winTitle: $('winTitle'),
    nextBtn: $('nextBtn'),
    menuLevel: $('menuLevel'),
    menuHp: $('menuHp'),
    levelGrid: $('levelGrid'),
    levelsInfo: $('levelsInfo'),
    menuTitle: $('menuTitle'),
    modeDesc: $('modeDesc'),
    langLabel: $('langLabel'),
    langGrid: $('langGrid'),
    muteLabel: $('muteLabel'),
    toasts: $('toasts'),
    musicBtn: $('musicBtn'),
    fsBtn: $('fsBtn'),
    bossBar: $('bossBar'),
    bossName: $('bossName'),
    bossFill: $('bossFill'),
    combo: $('combo'),
    comboNum: $('comboNum'),
    comboBar: $('comboBar'),
    fxbar: $('fxbar'),
    screens: { menu: $('menuScreen'), lang: $('langScreen'), levels: $('levelsScreen'), lose: $('loseScreen'), win: $('winScreen') },
  };

  const ctx = dom.canvas.getContext('2d');
  const gridCanvas = document.createElement('canvas'); // fondo + rejilla, se dibuja una sola vez por tamaño
  const segEls = [];

  // ------------------------------------------------------------------
  // Estado
  // ------------------------------------------------------------------
  let state = 'menu';
  let run = null;      // datos de la partida en curso
  let player = null;
  let anim = 0;        // reloj de animación (siempre avanza)
  let ambientT = 0;
  let last = 0;
  let initialized = false;
  let bannerAnim = null;
  let glowOn = FX.glow;
  let slowTime = 0;    // segundos acumulados de frames lentos (calidad automática)
  let currentLevel = 1;            // nivel de juego (1-99) en curso o a punto de jugarse
  let levelCfg = Levels.build(1);  // su dificultad
  const levelBtns = [];            // botones de la pantalla de niveles
  const langBtns = [];             // botones de la pantalla de idiomas
  let modeBtns = [];               // botones de dificultad del menú
  const crate = { active: false, spawned: false, x: 0, y: 0, r: C.weapon.radius, t: 0 }; // el arma que se encuentra
  const heart = { active: false, spawned: false, at: 0, x: 0, y: 0, t: 0 };                        // el corazón de 6 s
  const toasts = [];               // avisos de poder (pool fijo)
  const stars = [];                // estrellas del fondo (3 capas con profundidad)
  const fxChips = [];              // efectos con tiempo (hielo, estrella, XP doble)
  let theme = Theme.forLevel(Levels.unlocked()); // paleta de colores de la arena

  const world = { w: 800, h: 600 };
  const view = { k: 1 }; // píxeles de canvas por unidad de mundo

  // Objeto compartido con Enemies / SpawnManager / Projectiles / Pickups (se reutiliza: no se crea nada por frame)
  const env = { w: 800, h: 600, player: null, speedMult: 1, explode: null, shoot: null, maze: Maze, onWallHit: null };

  // Contexto que reciben las mejoras (UpgradeSystem.apply). Se rellena con el jugador actual.
  const upgradeCtx = {
    player: null,
    stats: null,
    heal(amount) { healPlayer(amount); },
    grantShield(level) { activateShield(level); },
  };

  const motionScale = (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)
    ? FX.reducedMotionShake
    : 1;

  // ------------------------------------------------------------------
  // Tamaño y proporción
  // ------------------------------------------------------------------
  function layout() {
    const rect = dom.stage.getBoundingClientRect();
    const sw = Math.max(1, Math.floor(rect.width));
    const sh = Math.max(1, Math.floor(rect.height));

    // El mundo adopta la proporción disponible (limitada), con el lado corto fijo
    const aspect = clamp(sw / sh, C.world.minAspect, C.world.maxAspect);
    const short = C.world.shortSide;
    const w = aspect >= 1 ? Math.round(short * aspect) : short;
    const h = aspect >= 1 ? short : Math.round(short / aspect);

    const fit = Math.min(sw / w, sh / h);
    const cssW = Math.max(1, Math.floor(w * fit));
    const cssH = Math.max(1, Math.floor(h * fit));
    // resolución: la del dispositivo (máx. 2), pero sin pasar de maxPixels en total (pantallas enormes o retina)
    const dpr = Math.min(window.devicePixelRatio || 1, 2, Math.sqrt(C.world.maxPixels / (cssW * cssH)));
    const pxW = Math.max(1, Math.round(cssW * dpr));
    const pxH = Math.max(1, Math.round(cssH * dpr));

    if (pxW === dom.canvas.width && pxH === dom.canvas.height && w === world.w && h === world.h) return;

    dom.canvas.style.width = cssW + 'px';
    dom.canvas.style.height = cssH + 'px';
    dom.canvas.width = pxW;
    dom.canvas.height = pxH;
    world.w = w;
    world.h = h;
    view.k = pxW / w;

    rebuildGrid();
    buildStars();
    buildMotes();

    // Si cambia el tamaño en plena partida, nadie se queda fuera de la arena
    if (run && state !== 'menu') setupMaze();
    if (player) { keepInside(player); Maze.resolve(player); }
    for (let i = 0; i < Enemies.list.length; i++) { keepInside(Enemies.list[i]); Maze.resolve(Enemies.list[i]); }
  }

  function rebuildGrid() {
    gridCanvas.width = dom.canvas.width;
    gridCanvas.height = dom.canvas.height;
    const g = gridCanvas.getContext('2d');
    const k = view.k;
    g.setTransform(k, 0, 0, k, 0, 0);

    Art.floor(g, world.w, world.h, theme); // baldosas biseladas, grietas y emblema central (art.js)
  }

  // ---------------------- Tema de color y estrellas del fondo ----------------------

  // Cambia la paleta de la arena (una distinta cada nivel) y redibuja el fondo si hace falta
  // Genera las paredes del nivel actual (siempre las mismas para cada nivel) y las dibuja una sola vez
  function setupMaze() {
    Maze.generate(currentLevel, world.w, world.h, !!(levelCfg && levelCfg.boss));
    Maze.prepare(view.k, theme);
  }

  function applyTheme(level) {
    const t = Theme.forLevel(level);
    if (t === theme) return;
    theme = t;
    if (dom.canvas.width > 1) rebuildGrid();
  }

  // Motas de luz que flotan por la arena (profundidad y vida)
  const motes = [];
  function buildMotes() {
    motes.length = 0;
    const n = Math.min(48, Math.round(world.w * world.h / 20000));
    for (let i = 0; i < n; i++) motes.push({ x: rand(0, world.w), y: rand(0, world.h), s: rand(1.2, 3.4), p: rand(0, TAU), v: rand(5, 16) });
  }

  function drawMotes() {
    if (!glowOn) return;
    const col = theme.stars[1];
    for (let i = 0; i < motes.length; i++) {
      const m = motes[i];
      const a = 0.25 + 0.3 * Math.sin(anim * 1.6 + m.p);
      Art.glow(ctx, m.x + Math.sin(anim * 0.7 + m.p) * 8, m.y, m.s * 5, col, a);
    }
  }

  function buildStars() {
    stars.length = 0;
    for (let i = 0; i < FX.stars; i++) {
      stars.push({ x: rand(0, world.w), y: rand(0, world.h), l: i % 3, s: 1 + (i % 3) * 0.7, p: rand(0, TAU) });
    }
  }

  // Las estrellas flotan despacio y se mueven al revés que el jugador: sensación de profundidad
  function updateStars(dt) {
    const P = state === 'playing' ? player : null;
    for (let i = 0; i < stars.length; i++) {
      const st = stars[i];
      const f = 0.03 + st.l * 0.05;
      st.y += (5 + st.l * 7) * dt;
      if (P) { st.x -= (P.vx + P.kx) * dt * f; st.y -= (P.vy + P.ky) * dt * f; }
      if (st.y > world.h) st.y -= world.h; else if (st.y < 0) st.y += world.h;
      if (st.x > world.w) st.x -= world.w; else if (st.x < 0) st.x += world.w;
    }
    for (let i = 0; i < motes.length; i++) { // las motas suben despacio
      const m = motes[i];
      m.y -= m.v * dt;
      if (m.y < -10) { m.y = world.h + 10; m.x = rand(0, world.w); }
    }
  }

  function drawStars() {
    ctx.save();
    for (let l = 0; l < 3; l++) {
      ctx.globalAlpha = (0.28 + l * 0.2) * (0.7 + 0.3 * Math.sin(anim * 2 + l * 2));
      ctx.fillStyle = theme.stars[l];
      ctx.beginPath();
      for (let i = l; i < stars.length; i += 3) {
        const st = stars[i];
        ctx.rect(st.x, st.y, st.s, st.s);
      }
      ctx.fill();
    }
    ctx.restore();
  }

  function keepInside(o) {
    const m = C.world.wallPadding + o.r;
    o.x = clamp(o.x, m, world.w - m);
    o.y = clamp(o.y, m, world.h - m);
  }

  // ------------------------------------------------------------------
  // Creación de la partida
  // ------------------------------------------------------------------

  // XP necesaria para pasar del nivel `level` al siguiente
  const xpForLevel = (level) => Math.round(C.xp.firstLevel * Math.pow(C.xp.growth, level - 1));

  // Vida máxima base de una dificultad (sin poderes) y vida con la que se empieza:
  // la que te quedó al ganar la partida anterior, o la completa si no hay (primera vez o tras perder)
  const baseMaxHpFor = (modeId) => Math.round(C.player.maxHp * C.modes[modeId].playerHp);
  function startHpFor(maxHp) {
    if (!C.carryOver.enabled) return maxHp;
    const c = Levels.carryHp();
    if (c === null || c === undefined) return maxHp;
    return clamp(c, Math.min(C.carryOver.minHp, maxHp), maxHp);
  }

  function newPlayer() {
    // Todas las estadísticas modificables por mejoras viven en stats (con sus techos de balance)
    const maxHp = Math.round(C.player.maxHp * levelCfg.playerHpMult); // la dificultad cambia la vida inicial
    const base = Object.assign({}, C.player.attack, {
      moveSpeed: C.player.speed,
      maxHp,
      pickupRadius: C.xp.pickupRadius,
    });
    return {
      x: world.w / 2, y: world.h / 2,
      vx: 0, vy: 0,   // velocidad por input
      kx: 0, ky: 0,   // empujón (knockback)
      r: C.player.radius,
      hp: startHpFor(maxHp),
      invuln: 0,
      invulnTime: C.player.invulnerability * levelCfg.invulnMult, // duración de la invulnerabilidad tras un golpe
      angle: -Math.PI / 2,   // hacia dónde mira
      aimT: 0,               // mientras > 0 mira hacia donde dispara
      aimAngle: 0,
      attackCd: 0,
      trail: 0,
      alive: true,
      hasWeapon: Levels.hasWeapon(), // sin arma no se dispara (los primeros niveles son solo de esquivar)
      stats: Stats.create(base, UP.statCaps),
      dash: { t: 0, cd: 0, dx: 0, dy: 0, speed: 0 },  // t = tiempo restante del impulso, cd = recarga
      shield: { t: 0, cd: 0, hitCd: 0 },              // t = protección restante, cd = tiempo hasta el siguiente
    };
  }

  let runSeq = 0;
  function newRun() {
    return {
      id: ++runSeq, // la música se reinicia con cada partida nueva
      elapsed: 0,
      phase: 0,
      speedMult: SpawnManager.stage(0).speedMult,
      kills: 0,
      level: 1,
      xp: 0,
      xpNeed: xpForLevel(1),
      foundWeapon: false, // ¿se encontró el arma en esta partida?
      combo: 0, comboT: 0, bestCombo: 0,   // bajas encadenadas y tiempo para la siguiente
      freezeT: 0, starT: 0, xp2T: 0,       // efectos de las sorpresas (segundos restantes)
      duration: C.duration,                // 60 s, o el tiempo límite del jefe
      timeout: false, bossDown: false, winPending: false, // ¿se acabó el tiempo con el jefe en pie? / ¿jefe derrotado? / victoria pendiente de aplicar
      fw: 0, fwT: 0,                       // fuegos artificiales pendientes al ganar
      shake: 0,
      flash: 0,
      endTimer: 0,
      result: null,
    };
  }

  // ------------------------------------------------------------------
  // Flujo del juego
  // ------------------------------------------------------------------
  function resetWorldState() {
    Particles.clear();
    Enemies.clear(false);
    Projectiles.clear();
    Pickups.clear();
    Boss.clear();
  }

  function startGame(level) {
    if (state === 'playing' || state === 'ending') return; // evita doble pulsación
    Sfx.unlock(); // el audio solo puede arrancar tras un gesto del usuario

    currentLevel = Levels.clamp(level || currentLevel);
    levelCfg = Levels.build(currentLevel);
    SpawnManager.setDifficulty(levelCfg.boss ? levelCfg.bossStages : levelCfg.stages); // en los niveles de jefe no hay oleadas

    resetWorldState();
    SpawnManager.reset();
    UpgradeSystem.reset();
    run = newRun();
    run.duration = levelCfg.boss ? C.boss.timeLimit + C.boss.timeLimitPerTier * (levelCfg.boss.tier - 1) : C.duration;
    player = newPlayer();
    env.player = player;
    env.speedMult = run.speedMult;
    upgradeCtx.player = player;
    upgradeCtx.stats = player.stats;
    state = 'playing';
    crate.active = false;
    crate.spawned = false;
    heart.active = false;
    heart.spawned = false;
    heart.at = rand(C.heart.appearMin, C.heart.appearMax); // el corazón saldrá en un momento aleatorio de la partida
    Surprise.reset();
    applyTheme(currentLevel);
    setupMaze();
    clearToasts();
    dom.stage.classList.remove('has-boss');

    showScreen(null);
    dom.hud.classList.remove('is-off');
    resetHud();
    dom.levelBadge.textContent = t('hud.level', { n: currentLevel });
    dom.levelBadge.style.color = C.modes[Levels.mode()].color;
    dom.timeSegs.style.visibility = levelCfg.boss ? 'hidden' : 'visible'; // contra el jefe no hay tramos de oleadas
    bossCache.shown = false;
    dom.bossBar.hidden = true;
    refreshBuffs();
    Input.setEnabled(true);

    Particles.ring(player.x, player.y, { color: C.colors.player, radius: 6, grow: 260, life: 0.6, width: 3 });
    Particles.burst(player.x, player.y, {
      count: 18, color: [C.colors.player, '#ffffff'], speed: [80, 260], life: [0.3, 0.7],
    });
    showBanner(t('banner.level', { n: currentLevel, mode: t('mode.' + Levels.mode()) }), false);
    if (levelCfg.boss) startBoss();
    updateHud(true);
  }

  function goMenu() {
    if (state === 'playing' || state === 'ending') return;
    state = 'menu';
    run = null;
    player = null;
    env.player = null;
    upgradeCtx.player = null;
    upgradeCtx.stats = null;
    resetWorldState();
    Maze.clear();
    Input.setEnabled(false);
    dom.hud.classList.add('is-off');
    dom.dashBtn.hidden = true;
    refreshMenu();
    showScreen('menu');
  }

  function refreshMenu() {
    const u = Levels.unlocked();
    applyTheme(u); // el menú muestra los colores del próximo nivel
    dom.menuLevel.textContent = u === 1 && Levels.doneCount() === 0
      ? t('menu.firstLevel', { n: 1, total: Levels.count })
      : t('menu.next', { n: u, total: Levels.count, done: Levels.doneCount() });
    // Vida con la que empezarás (solo se muestra si no es la completa)
    const max = baseMaxHpFor(Levels.mode());
    const hp = startHpFor(max);
    const show = C.carryOver.enabled && hp < max;
    dom.menuHp.hidden = !show;
    if (show) dom.menuHp.textContent = t('menu.carryHp', { hp, max });
  }

  // ---------------------- Dificultad ----------------------
  function refreshModeUI() {
    const m = Levels.mode();
    for (let i = 0; i < modeBtns.length; i++) {
      const on = modeBtns[i].dataset.mode === m;
      modeBtns[i].classList.toggle('is-active', on);
      modeBtns[i].setAttribute('aria-checked', on ? 'true' : 'false');
    }
    dom.modeDesc.textContent = t('mode.' + m + '.desc');
  }

  function chooseMode(m) {
    if (state === 'playing' || state === 'ending') return;
    if (!Levels.setMode(m)) return;
    refreshModeUI();
    refreshMenu(); // cada dificultad tiene su propio progreso
  }

  // ---------------------- Idioma ----------------------
  function buildLangGrid() {
    dom.langGrid.textContent = '';
    langBtns.length = 0;
    for (let i = 0; i < I18n.LANGS.length; i++) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'lang-btn';
      b.textContent = I18n.LANGS[i].name;
      b.dataset.action = 'setlang';
      b.dataset.lang = I18n.LANGS[i].code;

  function refreshLangUI() {
    for (let i = 0; i < langBtns.length; i++) langBtns[i].classList.toggle('is-active', langBtns[i].dataset.lang === I18n.lang());
    dom.langLabel.textContent = '🌐 ' + I18n.name();
  }

  function openLang() {
    if (state === 'playing' || state === 'ending') return;
    refreshLangUI();
    showScreen('lang');
  }

  // Al cambiar de idioma se vuelven a escribir los textos que genera el juego (los fijos ya los rellena I18n.apply)
  function onLanguageChanged() {
    dom.menuTitle.setAttribute('aria-label', t('title.top') + ' 60 ' + t('title.bottom'));
    refreshMenu();
    refreshModeUI();
    updateMuteLabel();
    updateMusicBtn();
    refreshLangUI();
    refreshLevelTips();

  }

  // ---------------------- Selección de nivel ----------------------
  function buildLevelGrid() {
    dom.levelGrid.textContent = '';
    levelBtns.length = 0;
    for (let n = 1; n <= Levels.count; n++) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = Levels.isBoss(n) ? 'lvl is-boss' : 'lvl';
      b.textContent = String(n);
      b.dataset.action = 'level';
      b.dataset.level = String(n);
      dom.levelGrid.appendChild(b);
      levelBtns.push(b);
    }
  }

  function refreshLevelTips() {
    for (let i = 0; i < levelBtns.length; i++) {
      const n = i + 1;
      levelBtns[i].title = Levels.isBoss(n)
        ? t('levels.tipBoss', { n, name: t('boss.' + Levels.bossTier(n)), r: I18n.num(Levels.rating(n), 1) })
        : t('levels.tip', { n, r: I18n.num(Levels.rating(n), 1) });
    }
    dom.levelsInfo.textContent = t('levels.info', { done: Levels.doneCount(), total: Levels.count, n: Levels.unlocked() });
  }

  function refreshLevelGrid() {
    const u = Levels.unlocked();
    for (let i = 0; i < levelBtns.length; i++) {
      const n = i + 1;
      const b = levelBtns[i];
      b.disabled = n > u;
      b.classList.toggle('is-locked', n > u);
      b.classList.toggle('is-done', Levels.isDone(n));
      b.classList.toggle('is-current', n === u);
    }
    refreshLevelTips();
    const cur = levelBtns[u - 1];
    if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'center' });
  }

  function openLevels() {
    if (state === 'playing' || state === 'ending') return;
    refreshLevelGrid();
    showScreen('levels');
  }

  function endRun(result) {
    state = 'ending';
    run.result = result;
    run.endTimer = 0;
    Input.setEnabled(false);

    const P = player;
    if (result === 'lost') {
      P.alive = false;
      Particles.burst(P.x, P.y, {
        count: 70, color: [C.colors.player, '#ffffff', C.colors.enemy],
        speed: [60, 420], life: [0.5, 1.3], size: [2, 4.5], drag: 1.8,
      });
      Particles.ring(P.x, P.y, { color: C.colors.player, radius: 8, grow: 420, life: 0.9, width: 4 });
      Particles.ring(P.x, P.y, { color: C.colors.enemy, radius: 4, grow: 260, life: 0.7, width: 3 });
      run.shake = FX.deathShake;
      run.flash = 1;
      heart.active = false;
      endEffects();
      Levels.clearCarry(); // el reintento empieza con la vida completa
      Sfx.play('lose');
      Music.stinger('lose');
    } else {
      // Victoria: se guarda el progreso (desbloquea el siguiente nivel)
      run.levelResult = Levels.complete(currentLevel);
      Levels.setCarryHp(P.hp); // la vida con la que terminas es la vida con la que empieza la siguiente partida
      heart.active = false;
      endEffects();
      run.fw = 7; // fuegos artificiales
      run.fwT = 0.05;
      // todos los enemigos estallan a la vez; proyectiles y gemas desaparecen
      Enemies.clear(true);
      Projectiles.clear();
      Pickups.clear();
      Particles.burst(P.x, P.y, { count: 60, color: PALETTE, speed: [80, 380], life: [0.6, 1.5], size: [2, 4], drag: 1.6 });
      Particles.ring(P.x, P.y, { color: C.colors.accent, radius: 8, grow: 520, life: 1.0, width: 4 });
      Particles.ring(P.x, P.y, { color: C.colors.player, radius: 8, grow: 340, life: 0.8, width: 3 });
      run.shake = FX.winShake;
      Sfx.play('win');
      Music.stinger('win');
    }
    updateHud(true);
  }

  // Nombre del tramo en el idioma actual (si no hay traducción, el de la configuración)
  function stageLabel(i) {
    const key = 'stage.' + (i + 1);
    return I18n.TABLE[key] ? t(key) : SpawnManager.stage(i).label;
  }

  function killsText(n) {
    return n === 1 ? t('kills.one') : t('kills.other', { n });
  }

  function showResult() {
    state = 'over';
    dom.dashBtn.hidden = true;
    if (run.result === 'won') {
      const last = currentLevel >= Levels.count;
      dom.winTitle.textContent = last ? t('win.titleLast') : t('win.title', { n: currentLevel });
      const bossName = levelCfg.boss ? t('boss.' + levelCfg.boss.tier) : '';
      let text = (levelCfg.boss
        ? t('boss.winBase', { name: bossName, sec: Math.floor(run.elapsed), hp: Math.round(player.hp) })
        : t('win.base', { total: C.duration, hp: Math.round(player.hp) })) +
        (player.hasWeapon ? t('result.combat', { kills: killsText(run.kills), nv: run.level }) : '') + '.';
      if (run.foundWeapon) text += t('win.weapon');
      if (last) text += t('win.last', { total: Levels.count });
      else if (run.levelResult && run.levelResult.unlockedNext) text += t('win.unlocked', { n: currentLevel + 1 });
      if (!last && C.carryOver.enabled) text += t('win.carry', { hp: startHpFor(baseMaxHpFor(Levels.mode())) });
      dom.winDetail.textContent = text;
      dom.nextBtn.hidden = last;
      showScreen('win');
    } else {
      dom.loseDetail.textContent = (run.timeout
        ? t('boss.loseTime', { level: currentLevel, name: t('boss.' + levelCfg.boss.tier) })
        : t('lose.base', { level: currentLevel, sec: Math.floor(run.elapsed), total: levelCfg.boss ? run.duration : C.duration })) +
        (player.hasWeapon ? t('result.combat', { kills: killsText(run.kills), nv: run.level }) : '') + '.' +
        (run.foundWeapon ? t('lose.weapon') : '') + (C.carryOver.enabled ? t('lose.fresh') : '');
      showScreen('lose');
    }
  }

  function showScreen(name) {
    for (const key of Object.keys(dom.screens)) dom.screens[key].hidden = key !== name;
    if (name) {
      const primary = dom.screens[name].querySelector('[data-primary]');
      if (primary) primary.focus({ preventScroll: true }); // permite repetir con Enter/Espacio
    }
  }

  function updateMuteLabel() {
    dom.muteLabel.textContent = Sfx.isMuted() ? t('menu.soundOff') : t('menu.soundOn');
  }

  function updateMusicBtn() {
    const off = Music.isOff();
    dom.musicBtn.classList.toggle('is-off', off);
    dom.musicBtn.setAttribute('aria-pressed', off ? 'false' : 'true');
    const label = off ? t('menu.musicOff') : t('menu.musicOn');
    dom.musicBtn.setAttribute('aria-label', label);
    dom.musicBtn.title = label;
  }

  function toggleMusic() {
    Sfx.unlock();
    Music.toggle();
    updateMusicBtn();
  }

  // Pantalla completa (si el navegador lo permite; en el iPhone no existe y el botón se oculta)
  const fsEl = document.documentElement;
  const fsSupported = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled) && !!(fsEl.requestFullscreen || fsEl.webkitRequestFullscreen);
  function toggleFullscreen() {
    try {
      const active = document.fullscreenElement || document.webkitFullscreenElement;
      if (active) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else {
        const p = (fsEl.requestFullscreen || fsEl.webkitRequestFullscreen).call(fsEl);
        if (p && p.catch) p.catch(() => {});
      }
    } catch (_) { /* el navegador no lo permite */ }
  }

  function toggleMute() {
    Sfx.unlock();
    Sfx.toggleMute();
    updateMuteLabel();
  }

  // ------------------------------------------------------------------
  // Actualización
  // ------------------------------------------------------------------
  function step(dt) {
    updateStars(dt);
    if (state === 'playing') updatePlaying(dt);
    else if (state === 'ending') updateEnding(dt);
    else updateIdle(dt);
  }

  function updatePlaying(dt) {
    run.elapsed = Math.min(run.duration, run.elapsed + dt);
    env.w = world.w;
    env.h = world.h;

    advanceStage(dt);
    // Efectos con tiempo de las sorpresas (el hielo detiene a los enemigos: su tiempo no avanza)
    const edt = run.freezeT > 0 ? 0 : dt;
    run.freezeT = Math.max(0, run.freezeT - dt);
    run.starT = Math.max(0, run.starT - dt);
    run.xp2T = Math.max(0, run.xp2T - dt);
    SpawnManager.update(edt, run.elapsed, env);
    updatePlayer(dt);
    updateAbilities(dt);
    updateCrate(dt);
    updateHeart(dt);
    updateSurprise(dt);
    updateAttack(dt);
    if (Maze.active()) Maze.setTarget(player.x, player.y); // los enemigos rodean las paredes para llegar a ti
    Enemies.update(edt, env);
    Projectiles.updatePlayerShots(dt, env, Enemies.list, onShotHit);
    Projectiles.updateHostileShots(edt, env, player, onHostileHit);
    resolveContacts();
    Pickups.update(dt, env, player, player.stats.get('pickupRadius'), onGemCollected);
    Particles.update(dt);
    updateCombo(dt);
    decayFx(dt);
    updateToasts(dt);
    updateHud(false);
    updateComboHud();
    updateFxBar();
    updateBossHud();

    // Prioridad: muerte (state ya sería 'ending') > victoria
    if (state === 'playing' && run.winPending) endRun('won'); // el jefe cayó en este fotograma (los soldados que queden estallan con él)
    // En un nivel normal se gana aguantando el tiempo; contra un jefe, si se acaba el tiempo con él en pie, pierdes
    if (state === 'playing' && run.elapsed >= run.duration) {
      if (levelCfg.boss) { run.timeout = true; endRun('lost'); } else endRun('won');
    }
  }

  function updateEnding(dt) {
    run.endTimer += dt;
    Particles.update(dt * (run.result === 'lost' ? 0.45 : 1));
    decayFx(dt);
    updateToasts(dt);
    updateFireworks(dt);
    const delay = run.result === 'lost' ? FX.endDelayLose : FX.endDelayWin;
    if (run.endTimer >= delay) showResult();
  }

  // Menú y pantallas finales: la arena sigue viva con partículas ambientales
  function updateIdle(dt) {
    ambientT -= dt;
    if (ambientT <= 0) {
      ambientT = 0.14;
      if (Particles.count() < 70) {
        Particles.emit({
          x: rand(0, world.w), y: world.h + 6,
          vx: rand(-14, 14), vy: rand(-46, -16),
          life: [3, 5], size: [1.5, 3.2], drag: 0.1,
          color: PALETTE,
        });
      }
    }
    Particles.update(dt);
    if (run) decayFx(dt);
  }

  function decayFx(dt) {
    run.shake = Math.max(0, run.shake - FX.shakeDecay * dt);
    run.flash = Math.max(0, run.flash - FX.flashDecay * dt);
  }

  // Cambio de tramo de dificultad: aviso en pantalla y subida suave de la velocidad de los enemigos
  function advanceStage(dt) {
    if (levelCfg.boss) return; // el jefe no tiene tramos de oleadas
    const idx = SpawnManager.stageIndexAt(run.elapsed);
    while (run.phase < idx) {
      run.phase++;
      showBanner(stageLabel(run.phase), run.phase >= SpawnManager.stageCount() - 2);
      run.shake = Math.max(run.shake, 3);
    }
    const target = SpawnManager.stage(run.phase).speedMult;
    run.speedMult += (target - run.speedMult) * Math.min(1, dt * 2);
    env.speedMult = run.speedMult;
  }

  function updatePlayer(dt) {
    const P = player;
    const D = P.dash;
    const v = Input.getVector();

    if (D.t > 0) {
      // Dash: impulso en línea recta, ignora el input mientras dura
      D.t -= dt;
      P.vx = D.dx * D.speed;
      P.vy = D.dy * D.speed;
      if (D.t <= 0) { D.t = 0; P.vx *= 0.35; P.vy *= 0.35; }
      for (let i = 0; i < 2; i++) {
        Particles.emit({
          x: P.x + rand(-4, 4), y: P.y + rand(-4, 4),
          life: 0.28, size: P.r * 0.9, drag: 3, color: C.colors.player,
        });
      }
    } else {
      // Aceleración suave hacia la velocidad deseada
      const maxSpeed = P.stats.get('moveSpeed');
      const k = 1 - Math.exp(-C.player.acceleration * dt);
      P.vx += (v.x * maxSpeed - P.vx) * k;
      P.vy += (v.y * maxSpeed - P.vy) * k;
    }
    if (D.cd > 0) D.cd = Math.max(0, D.cd - dt);

    const kk = Math.exp(-9 * dt);
    P.kx *= kk;
    P.ky *= kk;

    const mx = (P.vx + P.kx) * dt;
    const my = (P.vy + P.ky) * dt;
    if (Maze.active()) {
      const steps = Math.max(1, Math.ceil(Math.hypot(mx, my) / 14));
      for (let st = 0; st < steps; st++) {
        P.x += mx / steps;
        P.y += my / steps;
        if (Maze.resolve(P)) { // se apoya en la pared: pierde la velocidad que iba contra ella
          const n = Maze.info;
          const vn = P.vx * n.nx + P.vy * n.ny;
          if (vn < 0) { P.vx -= vn * n.nx; P.vy -= vn * n.ny; }
          const kn = P.kx * n.nx + P.ky * n.ny;
          if (kn < 0) { P.kx -= kn * n.nx; P.ky -= kn * n.ny; }
        }
      }
    } else {
      P.x += mx;
      P.y += my;
    }

    const m = C.world.wallPadding + P.r;
    if (P.x < m) { P.x = m; if (P.vx < 0) P.vx = 0; if (P.kx < 0) P.kx = 0; }
    if (P.x > world.w - m) { P.x = world.w - m; if (P.vx > 0) P.vx = 0; if (P.kx > 0) P.kx = 0; }
    if (P.y < m) { P.y = m; if (P.vy < 0) P.vy = 0; if (P.ky < 0) P.ky = 0; }
    if (P.y > world.h - m) { P.y = world.h - m; if (P.vy > 0) P.vy = 0; if (P.ky > 0) P.ky = 0; }

    // Mira hacia donde dispara; si no dispara, hacia donde se mueve
    const speed = Math.hypot(P.vx, P.vy);
    P.aimT = Math.max(0, P.aimT - dt);
    let face = null;
    if (P.aimT > 0) face = P.aimAngle;
    else if (speed > 20) face = Math.atan2(P.vy, P.vx);
    if (face !== null) P.angle += wrapPi(face - P.angle) * Math.min(1, dt * 18);

    P.invuln = Math.max(0, P.invuln - dt);
    if (run.starT > 0) P.invuln = Math.max(P.invuln, 0.12); // la estrella te hace invencible

    // Estela
    if (speed > 50) {
      P.trail -= dt;
      if (P.trail <= 0) {
        P.trail = 0.03;
        const ma = Math.atan2(P.vy, P.vx);
        Particles.emit({
          x: P.x - Math.cos(ma) * P.r * 0.6 + rand(-2, 2),
          y: P.y - Math.sin(ma) * P.r * 0.6 + rand(-2, 2),
          vx: -P.vx * 0.05, vy: -P.vy * 0.05,
          life: rainbowOn() ? 0.55 : 0.35, size: P.r * (rainbowOn() ? 0.8 : 0.55), drag: 4,
          color: rainbowOn() ? Particles.hue(anim * 220 + rand(0, 50)) : C.colors.player,
        });
      }
    }
  }

  // ---------------------- Habilidades: escudo y dash ----------------------

  function healPlayer(amount) {
    const P = player;
    const max = P.stats.get('maxHp');
    const before = P.hp;
    P.hp = Math.min(max, P.hp + amount);
    const gained = Math.round(P.hp - before);
    if (gained > 0) Particles.text(P.x, P.y - P.r - 8, '+' + gained, { color: '#7dffb0', size: 18, life: 0.9 });
  }

  function activateShield(level) {
    const P = player;
    P.shield.t = Math.max(P.shield.t, AbilityStats.shieldDuration(level));
    P.shield.cd = 0;
    Particles.ring(P.x, P.y, { color: C.colors.shield, radius: P.r, grow: 200, life: 0.5, width: 3 });
    Sfx.play('shield');
  }

  // Escudo: se activa solo cada cierto tiempo y bloquea todo el daño mientras dura
  function updateAbilities(dt) {
    const P = player;
    const sh = P.shield;
    if (sh.hitCd > 0) sh.hitCd -= dt;
    const level = UpgradeSystem.levelOf('shield');
    if (level <= 0) return;
    if (sh.t > 0) {
      sh.t -= dt;
      if (sh.t <= 0) { sh.t = 0; sh.cd = AbilityStats.shieldCooldown(level); }
    } else {
      sh.cd -= dt;
      if (sh.cd <= 0) activateShield(level);
    }
  }

  function requestDash() {
    if (state !== 'playing' || !player || !player.alive) return;
    const level = UpgradeSystem.levelOf('dash');
    const P = player;
    const D = P.dash;
    if (level <= 0 || D.cd > 0 || D.t > 0) return;

    // Dirección: la que estás pulsando; si estás quieto, hacia donde miras
    const v = Input.getVector();
    let dx = v.x;
    let dy = v.y;
    const mag = Math.hypot(dx, dy);
    if (mag > 0.2) { dx /= mag; dy /= mag; } else { dx = Math.cos(P.angle); dy = Math.sin(P.angle); }

    const dur = UP.dash.duration;
    D.t = dur;
    D.dx = dx;
    D.dy = dy;
    D.speed = AbilityStats.dashDistance(level) / dur;
    D.cd = AbilityStats.dashCooldown(level);
    P.invuln = Math.max(P.invuln, dur + 0.06); // invulnerable mientras dura el impulso

    Particles.burst(P.x, P.y, { count: 14, color: [C.colors.player, '#ffffff'], speed: [80, 300], life: [0.2, 0.45], angle: Math.atan2(-dy, -dx), spread: 0.8 });
    Particles.ring(P.x, P.y, { color: C.colors.player, radius: P.r, grow: 260, life: 0.3, width: 2 });
    Sfx.play('dash');
  }

  // ---------------------- Autoataque ----------------------

  // Enemigo más cercano dentro del alcance (sin raíces cuadradas: compara distancias al cuadrado)
  function nearestEnemy(x, y, range) {
    const list = Enemies.list;
    let best = null;
    let bestD2 = Infinity;
    for (let i = 0; i < list.length; i++) {
      const e = list[i];
      if (e.spawnT > 0) continue; // todavía apareciendo
      const dx = e.x - x;
      const dy = e.y - y;
      const d2 = dx * dx + dy * dy;
      const lim = range + e.r;
      if (d2 > lim * lim || d2 >= bestD2) continue;
      best = e;
      bestD2 = d2;
    }
    return best;
  }

  // Contra un jefe, el arma apunta AL JEFE mientras esté a tiro y a la vista, para que sus soldados no se coman todos los disparos;
  // solo si un enemigo está encima de ti (a menos de 110 px de tu cuerpo) se defiende de él primero.
  function pickTarget(x, y, range) {
    const near = nearestEnemy(x, y, range);
    if (!levelCfg.boss || !Boss.active()) return near;
    const b = Boss.state.e;
    if (!b || b.spawnT > 0 || Enemies.list.indexOf(b) < 0) return near;
    if (near && near !== b && Math.hypot(near.x - x, near.y - y) - near.r < 110) return near;
    const d = Math.hypot(b.x - x, b.y - y) - b.r;
    if (d <= range && (!Maze.active() || Maze.los(x, y, b.x, b.y, 4))) return b;
    return near;
  }

  function updateAttack(dt) {
    const P = player;
    if (!P.hasWeapon) return; // todavía no has encontrado el arma
    const S = P.stats;
    P.attackCd -= dt;
    if (P.attackCd > 0) return;

    const range = S.get('range');
    const target = pickTarget(P.x, P.y, range);
    if (!target) {
      P.attackCd = 0; // listo para disparar en cuanto aparezca alguien
      return;
    }

    const speed = S.get('projectileSpeed');
    const count = Math.max(1, Math.round(S.get('projectileCount')));
    // Balance: cada proyectil extra hace algo menos de daño, para que el multidisparo no se dispare
    const damage = S.get('damage') / (1 + (count - 1) * UP.multishotFalloff);

    // Puntería con ligera anticipación: apunta a donde estará el enemigo cuando llegue el proyectil
    const dist = Math.hypot(target.x - P.x, target.y - P.y);
    const t = dist / speed;
    const ax = target.x + (target.vx + target.kx) * t;
    const ay = target.y + (target.vy + target.ky) * t;
    const base = Math.atan2(ay - P.y, ax - P.x);
    const spread = C.player.projectile.spread;
    const pr = C.player.projectile;

    for (let i = 0; i < count; i++) {
      const a = base + (i - (count - 1) / 2) * spread;
      Projectiles.firePlayer(
        P.x + Math.cos(a) * (P.r + 4), P.y + Math.sin(a) * (P.r + 4),
        a, speed, damage, range * 1.15, pr.radius, pr.color
      );
    }

    P.aimAngle = base;
    P.aimT = 0.25;
    P.attackCd += 1 / Math.max(0.1, S.get('attackSpeed'));

    Particles.burst(P.x + Math.cos(base) * (P.r + 6), P.y + Math.sin(base) * (P.r + 6), {
      count: 3, color: [C.colors.player, '#ffffff'], speed: [60, 160], life: [0.1, 0.2],
      size: [1, 2], angle: base, spread: 0.5,
    });
    Sfx.play('shoot');
  }

  // Un proyectil del jugador alcanza a un enemigo
  function onShotHit(e, b) {
    const sp = b.speed || 1;
    const dx = b.vx / sp;
    const dy = b.vy / sp;
    Particles.burst(b.x, b.y, {
      count: 6, color: [C.colors.player, '#ffffff', e.def.color],
      speed: [60, 220], life: [0.15, 0.35], size: [1.2, 2.6],
      angle: Math.atan2(dy, dx) + Math.PI, spread: 0.9, // las chispas salen hacia atrás
    });
    Sfx.play('hit');
    Enemies.damage(e, b.damage, dx, dy);
  }

  // ---------------------- Daño al jugador ----------------------

  function hurtPlayer(damage, fromX, fromY, enemy) {
    const P = player;
    if (!P || !P.alive || P.invuln > 0 || state !== 'playing') return false;
    damage = Math.max(1, Math.round(damage));

    // Escudo activo: absorbe el golpe por completo
    if (P.shield.t > 0) {
      if (P.shield.hitCd <= 0) {
        P.shield.hitCd = 0.2;
        Particles.ring(P.x, P.y, { color: C.colors.shield, radius: P.r * 2, grow: 120, life: 0.25, width: 3 });
        Particles.burst(P.x, P.y, { count: 6, color: [C.colors.shield, '#ffffff'], speed: [80, 220], life: [0.15, 0.3] });
        Sfx.play('hit');
      }
      if (enemy) { // el enemigo rebota para no quedarse pegado al escudo
        const ex = enemy.x - P.x;
        const ey = enemy.y - P.y;
        const ed = Math.hypot(ex, ey) || 1;
        enemy.kx = (ex / ed) * enemy.def.knockback * 0.8;
        enemy.ky = (ey / ed) * enemy.def.knockback * 0.8;
      }
      return false;
    }

    P.hp = Math.max(0, P.hp - damage);
    P.invuln = P.invulnTime;
    breakCombo(); // recibir un golpe rompe el combo

    let dx = P.x - fromX;
    let dy = P.y - fromY;
    const d = Math.hypot(dx, dy) || 1;
    dx /= d;
    dy /= d;
    P.kx = dx * C.player.knockback;
    P.ky = dy * C.player.knockback;
    if (enemy) {
      enemy.kx = -dx * enemy.def.knockback;
      enemy.ky = -dy * enemy.def.knockback;
    }

    Particles.burst((P.x + fromX) / 2, (P.y + fromY) / 2, {
      count: 16, color: [C.colors.enemy, '#ffffff', C.colors.enemyCore],
      speed: [80, 300], life: [0.25, 0.6],
    });
    Particles.ring(P.x, P.y, { color: C.colors.enemy, radius: P.r, grow: 280, life: 0.4, width: 3 });
    Particles.text(P.x, P.y - P.r - 6, '-' + Math.round(damage), { color: '#ff8fc0', size: 18, life: 0.8 });
    Sfx.play('hurt');

    run.shake = Math.max(run.shake, FX.hitShake);
    run.flash = 1;
    shakeHud();

    if (P.hp <= 0) endRun('lost');
    return true;
  }

  // Contacto directo con enemigos (el Explosivo no hace daño al tocar: explota)
  function resolveContacts() {
    const P = player;
    if (P.alive && run.starT > 0) { // con la estrella, tocar a un enemigo le hace daño en vez de recibirlo
      const S = C.surprise.types.star;
      const list = Enemies.list;
      for (let i = list.length - 1; i >= 0; i--) {
        const e = list[i];
        if (e.spawnT > 0 || e.starCd > 0) continue; // cada enemigo solo puede recibir un golpe cada `hitInterval`
        const reach = P.r + e.r;
        const dx = e.x - P.x;
        const dy = e.y - P.y;
        if (dx * dx + dy * dy >= reach * reach) continue;
        const d = Math.hypot(dx, dy) || 1;
        Particles.burst((P.x + e.x) / 2, (P.y + e.y) / 2, { count: 8, color: [C.colors.accent, '#ffffff', Particles.hue(anim * 300)], speed: [80, 260], life: [0.2, 0.5] });
        Sfx.play('hit');
        e.kx += (dx / d) * e.def.knockback * 1.2;
        e.ky += (dy / d) * e.def.knockback * 1.2;
        e.starCd = S.hitInterval;
        Enemies.damage(e, S.contactDamage, dx / d, dy / d);
      }
      return;
    }
    if (!P.alive || P.invuln > 0) return;
    const list = Enemies.list;
    for (let i = 0; i < list.length; i++) {
      const e = list[i];
      if (e.spawnT > 0 || e.def.contactDamage <= 0) continue;
      const reach = P.r + e.r * e.def.hitboxScale;
      const dx = P.x - e.x;
      const dy = P.y - e.y;
      if (dx * dx + dy * dy < reach * reach) {
        hurtPlayer(e.def.contactDamage * (e.dmgMul || 1) * levelCfg.damageMult, e.x, e.y, e);
        return;
      }
    }
  }

  // Proyectil enemigo alcanza al jugador

      Particles.burst(b.x, b.y, { count: 5, color: ['#ffffff', C.colors.violet], speed: [60, 160], life: [0.15, 0.3] });

  // Cuántos soldados más puede tener ahora (hay un tope por jefe y el tope global de enemigos)
  env.minionRoom = function minionRoom() {
    const BC = C.boss;
    const cap = Math.min(BC.minions.cap + BC.minions.capPerTier * levelCfg.boss.tier, C.limits.maxEnemies - 1);
    let n = 0;
    for (let i = 0; i < Enemies.list.length; i++) if (Enemies.list[i].minion) n++;
    return cap - n;
  };
  // El jefe llama a sus soldados ("hijitos"): más pequeños y más débiles; los tipos dependen del número de jefe
  env.summon = function summon(boss, n) {
    const BC = C.boss;
    const tier = levelCfg.boss.tier;
    const kinds = tier < 3 ? ['perseguidor']
      : tier < 6 ? ['perseguidor', 'rapido']
      : tier < 8 ? ['perseguidor', 'rapido', 'explosivo']
      : ['perseguidor', 'rapido', 'explosivo', 'francotirador'];
    const count = Math.min(n, env.minionRoom());
    const st = levelCfg.stages[3];
    for (let i = 0; i < count; i++) {
      const a = rand(0, TAU);
      let x = clamp(boss.x + Math.cos(a) * (boss.r + 34), 40, world.w - 40);
      let y = clamp(boss.y + Math.sin(a) * (boss.r + 34), 40, world.h - 40);
      if (Maze.active() && !Maze.isFree(x, y, 20)) { x = boss.x; y = clamp(boss.y + boss.r + 34, 40, world.h - 40); }
      const m = Enemies.spawn(kinds[(Math.random() * kinds.length) | 0], x, y, player, st.hpMult * BC.minions.hp, BC.minions.size * st.sizeMult);
      if (!m) break;
      m.minion = true;
      m.spawnT = 0.55;
      m.spawnDur = 0.55;
    }
    const col = Boss.looks[tier - 1].color;
    Particles.ring(boss.x, boss.y, { color: col, radius: boss.r, grow: 240, life: 0.5, width: 4 });
    Particles.burst(boss.x, boss.y, { count: 20, color: [col, '#ffffff'], speed: [80, 260], life: [0.3, 0.7] });
    Sfx.play('aim');
  };

  // Un disparo (del jugador o de un enemigo) se estrella contra una pared
  env.onWallHit = function onWallHit(b) {

  // Un enemigo muere por disparo del jugador: cuenta como baja y suelta XP
  Enemies.setOnKill(function onKill(e) {
    if (!run) return;
    if (e.id === 'boss') { bossDefeated(e); return; }

      });

  // ---------------------- XP y poderes automáticos ----------------------

  function addXp(amount) {
    if (!player.hasWeapon) return; // sin arma no hay combate ni XP
    run.xp += amount;
    // Cada NV que subes te da un poder al azar (si subes varios de golpe, varios poderes)
    while (run.xp >= run.xpNeed) {
      run.xp -= run.xpNeed;
      run.level++;
      run.xpNeed = xpForLevel(run.level);
      grantRandomPower();
    }
  }

  function onGemCollected(g) {
    addXp(g.value * (run.xp2T > 0 ? 2 : 1)); // la sorpresa XP doble
    Sfx.play('pickup');
    Particles.burst(g.x, g.y, { count: 3, color: [C.xp.tiers[g.tier].color, '#ffffff'], speed: [30, 110], life: [0.15, 0.3], size: [1, 2] });
  }

  // Añade AL AZAR un poder del catálogo (respeta pesos y niveles máximos). No pausa el juego.
  function grantRandomPower() {
    const P = player;
    Particles.ring(P.x, P.y, { color: C.colors.xp, radius: 8, grow: 420, life: 0.6, width: 4 });
    Particles.burst(P.x, P.y, { count: 22, color: [C.colors.xp, '#ffffff', C.colors.accent], speed: [80, 320], life: [0.4, 1.0], size: [2, 4], drag: 1.8 });
    Sfx.play('levelup');
    pulseXpBar();

    const ids = UpgradeSystem.roll(1, upgradeCtx);
    if (ids.length === 0) { // ya tienes todo al máximo: te curas
      healPlayer(UP.maxedHeal);
      showToast({ icon: '❤️', name: t('toast.heal'), effect: t('toast.healEffect', { n: UP.maxedHeal }), color: '#ff5f8f' });
      return;
    }
    const info = UpgradeSystem.describe(ids[0], upgradeCtx); // el texto del nivel que vas a tener
    UpgradeSystem.apply(ids[0], upgradeCtx);

      icon: info.icon,
      name: info.name + (info.nextLevel > 1 ? ' ×' + info.nextLevel : ''),
      effect: info.effect,

    });

  // ---------------------- Avisos de poder (pool fijo, sin timers: se apagan con dt) ----------------------

  function buildToasts() {
    dom.toasts.textContent = '';
    toasts.length = 0;
    for (let i = 0; i < UP.maxToasts; i++) {
      const el = document.createElement('div');
      el.className = 'toast';
      el.hidden = true;
      const icon = document.createElement('span');
      icon.className = 'toast-icon';
      const box = document.createElement('div');
      box.className = 'toast-text';
      const name = document.createElement('span');
      name.className = 'toast-name';
      const effect = document.createElement('span');
      effect.className = 'toast-effect';
      box.appendChild(name);
      box.appendChild(effect);
      el.appendChild(icon);
      el.appendChild(box);
      dom.toasts.appendChild(el);
      toasts.push({ el, icon, name, effect, t: 0 });
    }
  }

  function showToast(info) {
    let slot = null;
    for (let i = 0; i < toasts.length; i++) if (toasts[i].t <= 0) { slot = toasts[i]; break; }
    if (!slot) { // todos ocupados: se reutiliza el que lleva más tiempo
      slot = toasts[0];
      for (let i = 1; i < toasts.length; i++) if (toasts[i].t < slot.t) slot = toasts[i];
    }
    slot.icon.textContent = info.icon;
    slot.name.textContent = info.name;
    slot.effect.textContent = info.effect;
    slot.el.style.setProperty('--c', info.color);
    slot.el.classList.remove('is-out');
    slot.el.hidden = true;
    void slot.el.offsetWidth; // reinicia la animación de entrada
    slot.el.hidden = false;
    slot.t = UP.toastSeconds;
  }

  function updateToasts(dt) {
    for (let i = 0; i < toasts.length; i++) {
      const t = toasts[i];
      if (t.t <= 0) continue;
      t.t -= dt;
      if (t.t <= 0) { t.t = 0; t.el.hidden = true; }
      else if (t.t < 0.45) t.el.classList.add('is-out');
    }
  }

  function clearToasts() {
    for (let i = 0; i < toasts.length; i++) { toasts[i].t = 0; toasts[i].el.hidden = true; }
  }

  // ---------------------- El arma (se encuentra) ----------------------

  function spawnCrate() {
    const P = player;
    const m = C.weapon.wallMargin;
    let x = 0;
    let y = 0;
    let found = false;
    for (let i = 0; i < 40 && !found; i++) {
      x = rand(m, world.w - m);
      y = rand(m, world.h - m);
      found = Math.hypot(x - P.x, y - P.y) >= C.weapon.minDistance && Maze.isFree(x, y, C.weapon.radius + 8);
    }
    if (!found) { x = P.x < world.w / 2 ? world.w - m : m; y = P.y < world.h / 2 ? world.h - m : m; }
    crate.x = x;
    crate.y = y;
    crate.t = 0;
    crate.active = true;
    crate.spawned = true;
    Particles.ring(x, y, { color: C.colors.accent, radius: 8, grow: 300, life: 0.7, width: 4 });
    Particles.burst(x, y, { count: 24, color: [C.colors.accent, '#ffffff'], speed: [60, 280], life: [0.4, 0.9], size: [2, 4] });
    showBanner(t('banner.weaponAppears'), true);
    Sfx.play('aim');
  }

    const P = player;
    crate.active = false;
    P.hasWeapon = true;

    Particles.burst(P.x, P.y, { count: 40, color: [C.colors.accent, '#ffffff', C.colors.player], speed: [80, 380], life: [0.5, 1.2], size: [2, 4.5], drag: 1.8 });

  // ---------------------- Combo ----------------------

  const comboMult = () => 1 + Math.min(Math.max(0, run.combo - 1), C.combo.maxStacks) * C.combo.xpPerStack;
  const rainbowOn = () => !!run && (run.combo >= C.combo.rainbowFrom || run.starT > 0);

  function registerKill() {
    run.combo++;
    run.comboT = C.combo.window;
    if (run.combo > run.bestCombo) run.bestCombo = run.combo;
    if (C.combo.milestones.indexOf(run.combo) >= 0) comboMilestone();
    else if (run.combo >= 2) Sfx.play('combo', run.combo);
  }

  function breakCombo() {
    if (!run) return;
    if (run.combo >= 3 && player) {
      Particles.burst(player.x, player.y, { count: 10, color: [Particles.hue(anim * 200), '#ffffff'], speed: [60, 200], life: [0.3, 0.6] });
    }
    run.combo = 0;
    run.comboT = 0;
  }

  function updateCombo(dt) {
    if (run.comboT <= 0) return;
    run.comboT -= dt;
    if (run.comboT <= 0) { run.comboT = 0; breakCombo(); }
  }

  // Al llegar a un hito del combo: gemas de XP extra, aviso de colores y fanfarria
  function comboMilestone() {
    const P = player;
    const xp = Math.round(C.combo.milestoneXp * levelCfg.xpMult);
    Pickups.spawn(P.x, P.y, xp, 2, 'xp');
    const h = (run.combo * 22) % 360;
    Particles.ring(P.x, P.y, { color: Particles.hue(h), radius: 8, grow: 380, life: 0.6, width: 4 });
    Particles.confetti(P.x, P.y, { count: 22, speed: [100, 340] });

  }

  const comboCache = { n: 0, bar: -1 };
  function updateComboHud() {
    const n = run.combo;
    if (n < 2) {
      if (comboCache.n !== 0) { comboCache.n = 0; dom.combo.hidden = true; }
      return;
    }
    if (comboCache.n !== n) {
      comboCache.n = n;
      dom.combo.hidden = false;
      dom.comboNum.textContent = '×' + n;
      dom.combo.style.setProperty('--h', String((n * 22) % 360));
      dom.combo.classList.remove('is-pop');
      void dom.combo.offsetWidth;
      dom.combo.classList.add('is-pop');
    }
    const q = Math.round((run.comboT / C.combo.window) * 50);
    if (q !== comboCache.bar) {
      comboCache.bar = q;
      dom.comboBar.style.transform = 'scaleX(' + (q / 50) + ')';
    }
  }

  // ---------------------- Sorpresas (orbes de colores) ----------------------

  const surpriseCtx = {
    w: 0, h: 0, player: null, elapsed: 0, duration: C.duration, hasWeapon: false,
    free: (x, y, r) => Maze.isFree(x, y, r),
    onSpawn(orb) {

    surpriseCtx.w = world.w;
