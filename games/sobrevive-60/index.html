  <script>
/* ===== art.js ===== */
'use strict';

/**
 * Art — el arte del juego, dibujado con código (cero imágenes).
 *
 * La luz viene SIEMPRE de arriba a la izquierda: cada pieza tiene degradado de volumen, brillo, borde de luz y sombra.
 * Para ir fluido, lo caro se dibuja UNA vez en un lienzo pequeño (sprite) y se reutiliza:
 *   · Criaturas: cuerpo (sprite) + extremidades, alas, ojos, boca y chispas dibujados en directo para que corran, aleteen y te miren.
 *   · Paredes: cuatro materiales (metal tecnológico, cristal, piedra, caramelo) según la paleta del nivel.
 *   · Suelo: baldosas biseladas, grietas y un emblema central.
 *   · Gemas, corazón, arma y proyectiles: sprites con brillo.
 *
 * API: drawEnemy(ctx, e, gfx, spawn), enemyGlow(ctx, e), bossBody(...), walls(g, rects, theme), floor(g, w, h, theme),
 *      drawGem(...), drawHeart(...), drawCrate(...), playerBolt(...), hostileOrb(...), glow(...), shade(...)
 */
const Art = (() => {
  const C = GAME_CONFIG;
  const TAU = Math.PI * 2;
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const cache = new Map();
  let low = false; // calidad baja: se omiten los brillos accesorios (luz bajo monstruos, gemas) en equipos justos

  // ------------------------------------------------------------------ Colores
  function parse(c) {
    if (c.charAt(0) === '#') {
      const h = c.slice(1);
      return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
    }
    const m = c.match(/[\d.]+/g);
    return [+m[0], +m[1], +m[2]];
  }
  /** f > 0 aclara hacia el blanco, f < 0 oscurece hacia el negro. */
  function shade(c, f) {
    const [r, g, b] = parse(c);
    const k = (v) => Math.round(clamp(f >= 0 ? v + (255 - v) * f : v * (1 + f), 0, 255));
    return 'rgb(' + k(r) + ',' + k(g) + ',' + k(b) + ')';
  }
  function mix(a, b, t) {
    const p = parse(a);
    const q = parse(b);
    return 'rgb(' + Math.round(p[0] + (q[0] - p[0]) * t) + ',' + Math.round(p[1] + (q[1] - p[1]) * t) + ',' + Math.round(p[2] + (q[2] - p[2]) * t) + ')';
  }
  function rgba(c, a) {
    const p = parse(c);
    return 'rgba(' + p[0] + ',' + p[1] + ',' + p[2] + ',' + a + ')';
  }
  function rngOf(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ------------------------------------------------------------------ Sprites en caché
  function makeCanvas(w, h) {
    const c = document.createElement('canvas');
    c.width = Math.max(2, Math.ceil(w));
    c.height = Math.max(2, Math.ceil(h));
    return c;
  }
  /** Un sprite de w x h unidades del mundo, dibujado con el origen en su centro y a doble resolución. */
  function sprite(key, w, h, draw) {
    let s = cache.get(key);
    if (s) return s;
    const ss = 2;
    const c = makeCanvas(w * ss, h * ss);
    const g = c.getContext('2d');
    g.scale(ss, ss);
    g.translate(w / 2, h / 2);
    draw(g);
    s = { c, w, h, v: {} };
    cache.set(key, s);
    return s;
  }
  function put(ctx, s, x, y, sc) {
    sc = sc || 1;
    ctx.drawImage(s.c, x - (s.w * sc) / 2, y - (s.h * sc) / 2, s.w * sc, s.h * sc);
  }
  // Variantes del mismo sprite: blanco (al recibir daño) y helado (congelado)
  function variant(s, kind) {
    if (!kind) return s;
    let v = s.v[kind];
    if (v) return v;
    const c = makeCanvas(s.c.width, s.c.height);
    const g = c.getContext('2d');
    g.drawImage(s.c, 0, 0);
    if (kind === 'white') { g.globalCompositeOperation = 'source-in'; g.fillStyle = '#ffffff'; }
    else { g.globalCompositeOperation = 'source-atop'; g.fillStyle = 'rgba(170, 240, 255, 0.62)'; }
    g.fillRect(0, 0, c.width, c.height);
    v = { c, w: s.w, h: s.h, v: {} };
    s.v[kind] = v;
    return v;
  }
  const bucket = (r) => Math.max(6, Math.round(r / 2) * 2);

  // Resplandor circular reutilizable (se dibuja con 'lighter')
  function glowSprite(color) {
    return sprite('glow:' + color, 64, 64, (g) => {
      const gr = g.createRadialGradient(0, 0, 0, 0, 0, 32);
      gr.addColorStop(0, rgba(color, 0.9));
      gr.addColorStop(0.35, rgba(color, 0.35));
      gr.addColorStop(1, rgba(color, 0));
      g.fillStyle = gr;
      g.fillRect(-32, -32, 64, 64);
    });
  }
  function glow(ctx, x, y, radius, color, alpha) {
    const s = glowSprite(color);
    const prev = ctx.globalAlpha;
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = prev * alpha;
    ctx.drawImage(s.c, x - radius, y - radius, radius * 2, radius * 2);
    ctx.globalAlpha = prev;
    ctx.globalCompositeOperation = 'source-over';
  }

  // ------------------------------------------------------------------ Pintura con volumen
  /**
   * Rellena una forma con volumen: degradado diagonal (luz arriba-izquierda), brillo suave, borde interior oscuro,
   * textura opcional y contorno. box = {x0,y0,x1,y1} es la caja que contiene la forma.
   */
  function shaded(g, path, base, o) {
    const w = o.x1 - o.x0;
    const h = o.y1 - o.y0;
    const cx = (o.x0 + o.x1) / 2;
    const cy = (o.y0 + o.y1) / 2;
    const R = Math.max(w, h) / 2;
    g.save();
    path(g);
    const lg = g.createLinearGradient(o.x0, o.y0, o.x1, o.y1);
    lg.addColorStop(0, shade(base, 0.42));
    lg.addColorStop(0.45, base);
    lg.addColorStop(1, shade(base, -0.58));
    g.fillStyle = lg;
    g.fill();
    g.clip();
    const hg = g.createRadialGradient(cx - w * 0.22, cy - h * 0.28, 0, cx - w * 0.22, cy - h * 0.28, R * 0.95);
    hg.addColorStop(0, 'rgba(255,255,255,' + (o.hi === undefined ? 0.5 : o.hi) + ')');
    hg.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = hg;
    g.fillRect(o.x0 - 2, o.y0 - 2, w + 4, h + 4);
    if (o.tex) o.tex(g);
    path(g);
    g.strokeStyle = 'rgba(0,0,0,0.38)';
    g.lineWidth = R * 0.2;
    g.stroke(); // oscurece el borde por dentro: efecto de volumen
    g.restore();
    path(g);
    g.strokeStyle = o.outline || shade(base, -0.72);
    g.lineWidth = o.lw || 2;
    g.lineJoin = 'round';
    g.stroke();
  }
  function spec(g, x, y, rx, ry, rot, a) {
    g.save();
    g.translate(x, y);
    g.rotate(rot || -0.6);
    const gr = g.createRadialGradient(0, 0, 0, 0, 0, rx);
    gr.addColorStop(0, 'rgba(255,255,255,' + (a || 0.85) + ')');
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr;
    g.scale(1, ry / rx);
    g.beginPath();
    g.arc(0, 0, rx, 0, TAU);
    g.fill();
    g.restore();
  }
  function capsulePath(g, x0, y0, x1, y1, wid) {
    const a = Math.atan2(y1 - y0, x1 - x0);
    g.beginPath();
    g.arc(x0, y0, wid / 2, a + Math.PI / 2, a - Math.PI / 2);
    g.arc(x1, y1, wid / 2, a - Math.PI / 2, a + Math.PI / 2);
    g.closePath();
  }
  function roundRect(g, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }

  // Una extremidad (brazo, pierna, puño): cápsula con volumen. El pivote está arriba.
  function limbSprite(key, len, wid, col, knob) {
    return sprite(key, wid * 2.4, len + wid * 1.4, (g) => {
      g.translate(0, -(len + wid * 1.4) / 2 + wid * 0.7);
      shaded(g, (gg) => capsulePath(gg, 0, 0, 0, len, wid), col, { x0: -wid / 2, y0: -wid / 2, x1: wid / 2, y1: len + wid / 2, hi: 0.35, lw: 1.6 });
      if (knob) {
        shaded(g, (gg) => { gg.beginPath(); gg.arc(0, len, wid * 0.72, 0, TAU); }, shade(col, -0.18), { x0: -wid * 0.72, y0: len - wid * 0.72, x1: wid * 0.72, y1: len + wid * 0.72, hi: 0.45, lw: 1.6 });
      }
    });
  }
  // Dibuja una extremidad girando alrededor de su pivote (px, py)
  function limb(ctx, s, len, wid, px, py, ang) {
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(ang);
    ctx.drawImage(s.c, -s.w / 2, -wid * 0.7, s.w, s.h);
    ctx.restore();
  }

  function eye(ctx, x, y, er, lx, ly, pupil) {
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(x, y, er, 0, TAU);
    ctx.fill();
    const px = x + lx * er * 0.4;
    const py = y + ly * er * 0.4;
    ctx.fillStyle = pupil || '#10061c';
    ctx.beginPath();
    ctx.arc(px, py, er * 0.58, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(px - er * 0.2, py - er * 0.24, er * 0.17, 0, TAU);
    ctx.fill();
  }
  // Ojos con párpado enfadado (se recorta dentro del ojo)
  function angryEye(ctx, x, y, er, lx, ly, lid, pupil) {
    eye(ctx, x, y, er, lx, ly, pupil);
    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, er * 1.02, 0, TAU);
    ctx.clip();
    const sgn = x >= 0 ? 1 : -1; // el párpado baja hacia el centro de la cara
    ctx.fillStyle = lid;
    ctx.beginPath();
    ctx.moveTo(x + sgn * er * 1.4, y - er * 1.4);
    ctx.lineTo(x - sgn * er * 1.4, y - er * 1.4);
    ctx.lineTo(x - sgn * er * 1.4, y - er * 0.05);
    ctx.lineTo(x + sgn * er * 1.4, y - er * 0.85);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // ------------------------------------------------------------------ Criaturas
  const colorOf = (id) => C.enemies[id].color;

  // --- Perseguidor: duendecillo con cuernos
  function impBody(g, r, col) {
    for (const sg of [-1, 1]) { // cuernos de hueso
      g.beginPath();
      g.moveTo(sg * r * 0.42, -r * 0.7);
      g.quadraticCurveTo(sg * r * 0.75, -r * 1.3, sg * r * 1.04, -r * 1.24);
      g.quadraticCurveTo(sg * r * 0.8, -r * 0.92, sg * r * 0.74, -r * 0.5);
      g.closePath();
      const hg = g.createLinearGradient(sg * r * 0.4, -r * 1.3, sg * r * 0.9, -r * 0.5);
      hg.addColorStop(0, '#fffbe8');
      hg.addColorStop(1, '#c4a96e');
      g.fillStyle = hg;
      g.fill();
      g.strokeStyle = 'rgba(70,45,10,0.75)';
      g.lineWidth = 1.5;
      g.stroke();
    }
    const body = (gg) => {
      gg.beginPath();
      gg.moveTo(0, -r * 0.95);
      gg.bezierCurveTo(r * 1.05, -r * 0.95, r * 1.12, r * 0.6, 0, r);
      gg.bezierCurveTo(-r * 1.12, r * 0.6, -r * 1.05, -r * 0.95, 0, -r * 0.95);
      gg.closePath();
    };
    shaded(g, body, col, {
      x0: -r * 1.1, y0: -r * 0.95, x1: r * 1.1, y1: r,
      tex(gg) {
        gg.fillStyle = rgba(shade(col, 0.6), 0.5); // barriga clara
        gg.beginPath();
        gg.ellipse(0, r * 0.44, r * 0.62, r * 0.5, 0, 0, TAU);
        gg.fill();
        gg.fillStyle = 'rgba(0,0,0,0.16)'; // manchas
        for (const [sx, sy, sr] of [[-0.55, -0.35, 0.17], [0.58, -0.1, 0.13], [0.2, 0.0, 0.1], [-0.3, 0.1, 0.08]]) {
          gg.beginPath();
          gg.arc(sx * r, sy * r, sr * r, 0, TAU);
          gg.fill();
        }
      },
    });
    spec(g, -r * 0.42, -r * 0.55, r * 0.34, r * 0.17, -0.7, 0.8);
  }

  function drawImp(ctx, e, gfx, o) {
    const r = e.r;
    const rb = bucket(r);
    const sc = r / rb;
    const col = colorOf('perseguidor');
    const B = variant(sprite('imp:' + rb, rb * 2.9, rb * 3.1, (g) => impBody(g, rb, col)), o.v);
    const Lm = variant(limbSprite('imp-limb:' + rb, rb * 0.55, rb * 0.3, shade(col, -0.12), true), o.v);
    const ph = gfx.anim * 9 + e.seed;
    const st = Math.sin(ph);
    const bob = Math.abs(st) * r * 0.1;
    const lean = clamp((e.vx + e.kx) * 0.0012, -0.25, 0.25) * e.face;
    ctx.translate(e.x, e.y - bob);
    ctx.rotate(lean);
    ctx.scale(e.face, 1);
    limb(ctx, Lm, rb * 0.55 * sc, rb * 0.3 * sc, -r * 0.34, r * 0.8, st * 0.8);
    limb(ctx, Lm, rb * 0.55 * sc, rb * 0.3 * sc, r * 0.34, r * 0.8, -st * 0.8);
    limb(ctx, Lm, rb * 0.55 * sc, rb * 0.3 * sc, -r * 0.95, r * 0.05, 0.35 - st * 0.9);
    limb(ctx, Lm, rb * 0.55 * sc, rb * 0.3 * sc, r * 0.95, r * 0.05, -0.35 + st * 0.9);
    put(ctx, B, 0, r * 0.05, sc);
    if (o.v === 'white') return;
    // cara: ojos enfadados que miran al jugador y boca que se abre cuando está cerca
    const dark = shade(col, -0.5);
    const lx = o.lx * e.face;
    angryEye(ctx, -r * 0.3, -r * 0.22, r * 0.27, lx, o.ly, dark);
    angryEye(ctx, r * 0.3, -r * 0.22, r * 0.27, lx, o.ly, dark);
    const open = o.near ? 0.45 + 0.4 * Math.sin(ph * 1.7) : 0;
    ctx.lineCap = 'round';
    if (open > 0.05) {
      ctx.fillStyle = '#2a0710';
      ctx.beginPath();
      ctx.ellipse(0, r * 0.5, r * 0.3, r * 0.2 * open + r * 0.04, 0, 0, TAU);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      for (let k = -1; k <= 1; k++) {
        ctx.beginPath();
        ctx.moveTo(k * r * 0.14 - r * 0.06, r * 0.5 - r * 0.2 * open);
        ctx.lineTo(k * r * 0.14 + r * 0.06, r * 0.5 - r * 0.2 * open);
        ctx.lineTo(k * r * 0.14, r * 0.5 - r * 0.2 * open + r * 0.13);
        ctx.closePath();
        ctx.fill();
      }
    } else {
      ctx.strokeStyle = dark;
      ctx.lineWidth = Math.max(1.6, r * 0.08);
      ctx.beginPath();
      ctx.arc(0, r * 0.3, r * 0.3, 0.2 * Math.PI, 0.8 * Math.PI);
      ctx.stroke();
    }
  }

  // --- Rápido: murciélago de neón que aletea
  function batBody(g, r, col) {
    for (const sg of [-1, 1]) { // orejas
      g.beginPath();
      g.moveTo(sg * r * 0.18, -r * 0.55);
      g.lineTo(sg * r * 0.42, -r * 1.12);
      g.lineTo(sg * r * 0.55, -r * 0.5);
      g.closePath();
      g.fillStyle = shade(col, -0.1);
      g.fill();
      g.strokeStyle = shade(col, -0.7);
      g.lineWidth = 1.4;
      g.stroke();
    }
    g.beginPath(); // cola
    g.moveTo(-r * 0.2, r * 0.55);
    g.quadraticCurveTo(0, r * 1.5, r * 0.2, r * 0.55);
    g.fillStyle = shade(col, -0.35);
    g.fill();
    const body = (gg) => { gg.beginPath(); gg.ellipse(0, 0, r * 0.62, r * 0.78, 0, 0, TAU); };
    shaded(g, body, col, {
      x0: -r * 0.62, y0: -r * 0.78, x1: r * 0.62, y1: r * 0.78,
      tex(gg) {
        gg.fillStyle = rgba(shade(col, 0.65), 0.55);
        gg.beginPath();
        gg.ellipse(0, r * 0.28, r * 0.36, r * 0.42, 0, 0, TAU);
        gg.fill();
      },
    });
    spec(g, -r * 0.2, -r * 0.4, r * 0.24, r * 0.12, -0.7, 0.8);
  }
  function wingSprite(r, col) {
    return sprite('wing:' + r, r * 2.4, r * 1.7, (g) => {
      g.translate(-r * 1.2 + r * 0.1, 0);
      g.beginPath();
      g.moveTo(0, 0);
      g.quadraticCurveTo(r * 1.0, -r * 1.05, r * 2.05, -r * 0.8);
      g.quadraticCurveTo(r * 1.75, -r * 0.5, r * 1.78, -r * 0.1);
      g.quadraticCurveTo(r * 1.45, -r * 0.25, r * 1.35, r * 0.42);
      g.quadraticCurveTo(r * 0.95, r * 0.15, r * 0.7, r * 0.55);
      g.quadraticCurveTo(r * 0.4, r * 0.25, r * 0.12, r * 0.4);
      g.closePath();
      const gr = g.createLinearGradient(0, 0, r * 2, -r * 0.4);
      gr.addColorStop(0, rgba(shade(col, 0.5), 0.97));
      gr.addColorStop(1, rgba(shade(col, -0.1), 0.88));
      g.fillStyle = gr;
      g.fill();
      g.strokeStyle = shade(col, -0.75);
      g.lineWidth = 1.5;
      g.stroke();
      g.strokeStyle = rgba(shade(col, 0.6), 0.7); // huesos de los dedos
      g.lineWidth = 1.3;
      g.beginPath();
      for (const [x, y] of [[2.05, -0.8], [1.78, -0.1], [1.35, 0.42], [0.7, 0.55]]) { g.moveTo(0, 0); g.lineTo(x * r, y * r); }
      g.stroke();
    });
  }
  function drawBat(ctx, e, gfx, o) {
    const r = e.r;
    const rb = bucket(r);
    const sc = r / rb;
    const col = colorOf('rapido');
    const B = variant(sprite('bat:' + rb, rb * 2.4, rb * 3, (g) => batBody(g, rb, col)), o.v);
    const W = variant(wingSprite(rb, col), o.v);
    const ph = gfx.anim * 15 + e.seed;
    const fl = Math.sin(ph) * 0.85;
    const speed = Math.hypot(e.vx, e.vy) || 1;
    // estela: dos imágenes fantasma detrás
    if (o.v !== 'white') {
      for (let k = 2; k >= 1; k--) {
        ctx.globalAlpha *= 0.16;
        put(ctx, B, e.x - (e.vx / speed) * r * 0.55 * k, e.y - (e.vy / speed) * r * 0.55 * k, sc);
        ctx.globalAlpha /= 0.16;
      }
    }
    ctx.translate(e.x, e.y - Math.sin(ph * 0.5) * r * 0.12);
    ctx.rotate(clamp((e.vx + e.kx) * 0.0016, -0.4, 0.4) * e.face);
    ctx.scale(e.face, 1);
    for (const sg of [-1, 1]) { // las dos alas (la de atrás un poco más oscura)
      ctx.save();
      ctx.translate(sg * r * 0.38, -r * 0.1);
      ctx.scale(sg, 1);
      ctx.rotate(-0.35 - fl);
      ctx.drawImage(W.c, -r * 0.1, -W.h * sc / 2, W.w * sc, W.h * sc); // el hombro del ala (pivote) queda en el origen
      ctx.restore();
    }
    put(ctx, B, 0, 0, sc);
    if (o.v === 'white') return;
    ctx.fillStyle = '#fffbb0';
    for (const sg of [-1, 1]) { // ojos brillantes
      ctx.beginPath();
      ctx.ellipse(sg * r * 0.24, -r * 0.18, r * 0.16, r * 0.11, sg * 0.3, 0, TAU);
      ctx.fill();
      ctx.fillStyle = '#10061c';
      ctx.beginPath();
      ctx.arc(sg * r * 0.24 + o.lx * r * 0.04, -r * 0.18 + o.ly * r * 0.03, r * 0.05, 0, TAU);
      ctx.fill();
      ctx.fillStyle = '#fffbb0';
    }
    ctx.fillStyle = '#ffffff'; // colmillos
    for (const sg of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(sg * r * 0.1, r * 0.14);
      ctx.lineTo(sg * r * 0.2, r * 0.14);
      ctx.lineTo(sg * r * 0.15, r * 0.34);
      ctx.closePath();
      ctx.fill();
    }
  }

  // --- Tanque: golem blindado
  function golemBody(g, r, accent) {
    const steel = '#5f6a86';
    // hombreras con púas
    for (const sg of [-1, 1]) {
      for (let k = 0; k < 3; k++) {
        const a = -Math.PI / 2 + sg * (0.35 + k * 0.55);
        const bx = sg * r * 1.0 + Math.cos(a) * r * 0.46;
        const by = -r * 0.62 + Math.sin(a) * r * 0.46;
        g.beginPath();
        g.moveTo(bx - Math.sin(a) * r * 0.13, by + Math.cos(a) * r * 0.13);
        g.lineTo(bx + Math.cos(a) * r * 0.4, by + Math.sin(a) * r * 0.4);
        g.lineTo(bx + Math.sin(a) * r * 0.13, by - Math.cos(a) * r * 0.13);
        g.closePath();
        g.fillStyle = shade(accent, 0.1);
        g.fill();
        g.strokeStyle = shade(accent, -0.7);
        g.lineWidth = 1.4;
        g.stroke();
      }
    }
    const torso = (gg) => {
      gg.beginPath();
      const P = [[-0.6, -1.0], [0.6, -1.0], [0.98, -0.55], [0.82, 0.9], [0.46, 1.08], [-0.46, 1.08], [-0.82, 0.9], [-0.98, -0.55]];
      P.forEach(([x, y], i) => (i ? gg.lineTo(x * r, y * r) : gg.moveTo(x * r, y * r)));
      gg.closePath();
    };
    shaded(g, torso, steel, {
      x0: -r, y0: -r, x1: r, y1: r * 1.1, lw: 2.4,
      tex(gg) {
        gg.strokeStyle = 'rgba(8,10,20,0.55)'; // juntas de las placas
        gg.lineWidth = 2;
        gg.beginPath();
        gg.moveTo(-r, -r * 0.18); gg.lineTo(r, -r * 0.18);
        gg.moveTo(-r, r * 0.5); gg.lineTo(r, r * 0.5);
        gg.moveTo(0, r * 0.5); gg.lineTo(0, r * 1.1);
        gg.stroke();
        gg.strokeStyle = 'rgba(255,255,255,0.18)';
        gg.beginPath();
        gg.moveTo(-r, -r * 0.14); gg.lineTo(r, -r * 0.14);
        gg.moveTo(-r, r * 0.54); gg.lineTo(r, r * 0.54);
        gg.stroke();
        gg.fillStyle = accent; // cinturón
        gg.fillRect(-r, r * 0.68, r * 2, r * 0.13);
        gg.fillStyle = 'rgba(255,255,255,0.7)'; // remaches
        for (const [x, y] of [[-0.75, -0.7], [0.75, -0.7], [-0.7, 0.2], [0.7, 0.2], [-0.5, 0.95], [0.5, 0.95]]) {
          gg.beginPath();
          gg.arc(x * r, y * r, r * 0.05, 0, TAU);
          gg.fill();
        }
      },
    });
    for (const sg of [-1, 1]) { // hombreras
      shaded(g, (gg) => { gg.beginPath(); gg.arc(sg * r * 1.0, -r * 0.62, r * 0.46, 0, TAU); }, '#6c7794', { x0: sg * r - r * 0.46, y0: -r * 1.08, x1: sg * r + r * 0.46, y1: -r * 0.16, hi: 0.55, lw: 2.2 });
    }
    // yelmo
    shaded(g, (gg) => { gg.beginPath(); gg.arc(0, -r * 1.12, r * 0.55, Math.PI, TAU); gg.lineTo(r * 0.55, -r * 0.95); gg.lineTo(-r * 0.55, -r * 0.95); gg.closePath(); }, '#49526b', { x0: -r * 0.55, y0: -r * 1.67, x1: r * 0.55, y1: -r * 0.95, hi: 0.5, lw: 2.2 });
    g.fillStyle = '#10131f'; // visera
    roundRect(g, -r * 0.4, -r * 1.2, r * 0.8, r * 0.22, r * 0.1);
    g.fill();
    g.fillStyle = accent; // cresta
    g.fillRect(-r * 0.05, -r * 1.7, r * 0.1, r * 0.35);
    spec(g, -r * 0.42, -r * 0.7, r * 0.5, r * 0.2, -0.6, 0.5);
  }
  function drawGolem(ctx, e, gfx, o) {
    const r = e.r;
    const rb = bucket(r);
    const sc = r / rb;
    const accent = colorOf('tanque');
    const B = variant(sprite('golem:' + rb, rb * 3.6, rb * 3.7, (g) => golemBody(g, rb, accent)), o.v);
    const Fist = variant(limbSprite('golem-arm:' + rb, rb * 0.8, rb * 0.5, '#5f6a86', true), o.v);
    const Leg = variant(limbSprite('golem-leg:' + rb, rb * 0.45, rb * 0.5, '#4a5370', false), o.v);
    const ph = gfx.anim * 3.4 + e.seed;
    const st = Math.sin(ph);
    ctx.translate(e.x + Math.sin(ph * 2) * r * 0.012, e.y - Math.abs(st) * r * 0.06);
    ctx.scale(e.face, 1);
    limb(ctx, Leg, rb * 0.45 * sc, rb * 0.5 * sc, -r * 0.42, r * 0.95, st * 0.45);
    limb(ctx, Leg, rb * 0.45 * sc, rb * 0.5 * sc, r * 0.42, r * 0.95, -st * 0.45);
    limb(ctx, Fist, rb * 0.8 * sc, rb * 0.5 * sc, -r * 1.12, -r * 0.35, 0.18 - st * 0.4);
    limb(ctx, Fist, rb * 0.8 * sc, rb * 0.5 * sc, r * 1.12, -r * 0.35, -0.18 + st * 0.4);
    put(ctx, B, 0, 0, sc);
    if (o.v === 'white') return;
    const pulse = 0.6 + 0.35 * Math.sin(gfx.anim * 4 + e.seed);
    glow(ctx, 0, r * 0.12, r * 0.95, accent, 0.9 * pulse); // el núcleo del pecho
    ctx.fillStyle = '#fff4d6';
    ctx.beginPath();
    ctx.ellipse(0, r * 0.12, r * 0.17, r * 0.22, 0, 0, TAU);
    ctx.fill();
    const lx = o.lx * e.face * r * 0.05;
    for (const sg of [-1, 1]) { // ojos brillantes en la visera
      glow(ctx, sg * r * 0.2 + lx, -r * 1.1, r * 0.34, accent, 1);
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(sg * r * 0.2 + lx, -r * 1.1, r * 0.1, r * 0.05, sg * -0.25, 0, TAU);
      ctx.fill();
    }
  }

  // --- Explosivo: bomba viviente con mecha
  function bombBody(g, r, accent) {
    const base = '#2a3322';
    for (let k = 0; k < 10; k++) { // púas
      const a = (k * TAU) / 10 + 0.2;
      const bx = Math.cos(a) * r * 0.92;
      const by = Math.sin(a) * r * 0.92 + r * 0.1;
      g.beginPath();
      g.moveTo(bx - Math.sin(a) * r * 0.14, by + Math.cos(a) * r * 0.14);
      g.lineTo(Math.cos(a) * r * 1.36, Math.sin(a) * r * 1.36 + r * 0.1);
      g.lineTo(bx + Math.sin(a) * r * 0.14, by - Math.cos(a) * r * 0.14);
      g.closePath();
      const sg = g.createLinearGradient(bx, by, Math.cos(a) * r * 1.36, Math.sin(a) * r * 1.36);
      sg.addColorStop(0, '#6d7a5c');
      sg.addColorStop(1, '#d8e3c4');
      g.fillStyle = sg;
      g.fill();
      g.strokeStyle = 'rgba(10,14,6,0.8)';
      g.lineWidth = 1.4;
      g.stroke();
    }
    shaded(g, (gg) => { gg.beginPath(); gg.arc(0, r * 0.1, r, 0, TAU); }, base, {
      x0: -r, y0: -r * 0.9, x1: r, y1: r * 1.1, hi: 0.55,
      tex(gg) { // grietas brillantes
        gg.strokeStyle = accent;
        gg.lineWidth = 2.6;
        gg.lineCap = 'round';
        gg.shadowColor = accent;
        gg.shadowBlur = 9;
        gg.beginPath();
        gg.moveTo(-r * 0.85, r * 0.45); gg.lineTo(-r * 0.5, r * 0.3); gg.lineTo(-r * 0.58, r * 0.02); gg.lineTo(-r * 0.2, -r * 0.1);
        gg.moveTo(r * 0.8, r * 0.5); gg.lineTo(r * 0.52, r * 0.62); gg.lineTo(r * 0.6, r * 0.9);
        gg.moveTo(r * 0.7, -r * 0.35); gg.lineTo(r * 0.42, -r * 0.5); gg.lineTo(r * 0.5, -r * 0.7);
        gg.stroke();
        gg.shadowBlur = 0;
      },
    });
    shaded(g, (gg) => roundRect(gg, -r * 0.24, -r * 1.12, r * 0.48, r * 0.34, r * 0.08), '#7a8478', { x0: -r * 0.24, y0: -r * 1.12, x1: r * 0.24, y1: -r * 0.78, hi: 0.6, lw: 1.6 });
  }
  function drawBomb(ctx, e, gfx, o) {
    const r = e.r;
    const rb = bucket(r);
    const sc = r / rb;
    const accent = colorOf('explosivo');
    const B = variant(sprite('bomb:' + rb, rb * 3.1, rb * 3.1, (g) => bombBody(g, rb, accent)), o.v);
    const Lm = variant(limbSprite('bomb-leg:' + rb, rb * 0.3, rb * 0.26, '#3a4430', true), o.v);
    const ph = gfx.anim * 10 + e.seed;
    const st = Math.sin(ph);
    const lit = e.fuseOn;
    const k = lit ? 1 - e.fuse / e.def.fuseTime : 0;
    const shake = lit ? r * 0.035 * (0.4 + k) : 0;
    ctx.translate(e.x + (Math.random() - 0.5) * shake * 2, e.y - Math.abs(st) * r * 0.1 + (Math.random() - 0.5) * shake * 2);
    ctx.scale(e.face * (1 + 0.05 * Math.sin(ph * 2) + k * 0.12), 1 + k * 0.12);
    limb(ctx, Lm, rb * 0.3 * sc, rb * 0.26 * sc, -r * 0.4, r * 1.0, st * 0.9);
    limb(ctx, Lm, rb * 0.3 * sc, rb * 0.26 * sc, r * 0.4, r * 1.0, -st * 0.9);
    put(ctx, B, 0, 0, sc);
    if (o.v === 'white') return;
    // mecha con chispa
    ctx.strokeStyle = '#8a6a3a';
    ctx.lineWidth = Math.max(2, r * 0.1);
    ctx.lineCap = 'round';
    const tipX = r * 0.62 + Math.sin(ph * 0.6) * r * 0.05;
    const tipY = -r * 1.78;
    ctx.beginPath();
    ctx.moveTo(0, -r * 1.12);
    ctx.quadraticCurveTo(r * 0.05, -r * 1.6, tipX, tipY);
    ctx.stroke();
    const flick = 0.75 + 0.25 * Math.random();
    const sr = r * (0.36 + 0.28 * k) * flick;
    glow(ctx, tipX, tipY, sr * 2.4, lit ? '#ff6a3c' : '#ffd36a', 0.95);
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    for (let q = 0; q < 8; q++) {
      const a = (q * TAU) / 8 + ph;
      const rr = q % 2 ? sr * 0.38 : sr * 0.85;
      ctx.lineTo(tipX + Math.cos(a) * rr, tipY + Math.sin(a) * rr);
    }
    ctx.closePath();
    ctx.fill();
    // ojos furiosos
    const dark = '#16200c';
    angryEye(ctx, -r * 0.3, r * 0.02, r * 0.26, o.lx * e.face, o.ly, dark, lit ? '#ff2a2a' : '#10061c');
    angryEye(ctx, r * 0.3, r * 0.02, r * 0.26, o.lx * e.face, o.ly, dark, lit ? '#ff2a2a' : '#10061c');
    if (lit) { // al encender la mecha se pone al rojo vivo
      ctx.globalAlpha *= 0.3 + 0.5 * Math.abs(Math.sin(e.fuse * 24));
      glow(ctx, 0, r * 0.1, r * 1.7, '#ff3b3b', 0.9);
      ctx.globalAlpha = 1;
    }
  }

  // --- Francotirador: centinela flotante con halo y lente
  function sentinelBody(g, r, accent) {
    const base = mix(accent, '#2a2440', 0.55);
    for (const x of [-0.55, 0, 0.55]) { // propulsores
      shaded(g, (gg) => roundRect(gg, x * r - r * 0.17, r * 0.8, r * 0.34, r * 0.4, r * 0.1), '#3a3550', { x0: x * r - r * 0.17, y0: r * 0.8, x1: x * r + r * 0.17, y1: r * 1.2, hi: 0.4, lw: 1.5 });
    }
    g.strokeStyle = '#a79cc8'; // antena
    g.lineWidth = 2;
    g.beginPath();
    g.moveTo(r * 0.5, -r * 0.8);
    g.lineTo(r * 0.78, -r * 1.55);
    g.stroke();
    shaded(g, (gg) => { gg.beginPath(); gg.arc(0, 0, r, 0, TAU); }, base, {
      x0: -r, y0: -r, x1: r, y1: r, hi: 0.6,
      tex(gg) {
        gg.strokeStyle = 'rgba(0,0,0,0.4)'; // juntas de los paneles
        gg.lineWidth = 1.8;
        gg.beginPath();
        gg.arc(0, 0, r * 0.82, Math.PI * 0.15, Math.PI * 0.85);
        gg.moveTo(-r, 0); gg.lineTo(-r * 0.6, 0);
        gg.moveTo(r * 0.6, 0); gg.lineTo(r, 0);
        gg.moveTo(0, -r); gg.lineTo(0, -r * 0.62);
        gg.stroke();
        gg.strokeStyle = rgba(accent, 0.8);
        gg.lineWidth = 1.6;
        gg.beginPath();
        gg.arc(0, 0, r * 0.9, Math.PI * 1.1, Math.PI * 1.45);
        gg.stroke();
      },
    });
    shaded(g, (gg) => { gg.beginPath(); gg.arc(0, 0, r * 0.52, 0, TAU); }, '#171326', { x0: -r * 0.52, y0: -r * 0.52, x1: r * 0.52, y1: r * 0.52, hi: 0.25, lw: 2.4, outline: '#b8add8' });
  }
  function drawSentinel(ctx, e, gfx, o) {
    const r = e.r;
    const rb = bucket(r);
    const sc = r / rb;
    const accent = colorOf('francotirador');
    const B = variant(sprite('sent:' + rb, rb * 3.4, rb * 3.7, (g) => sentinelBody(g, rb, accent)), o.v);
    const ph = gfx.anim * 2.4 + e.seed;
    const hover = Math.sin(ph) * r * 0.12;
    ctx.translate(e.x, e.y + hover - r * 0.25);
    const haloArc = (a0, a1) => {
      ctx.save();
      ctx.rotate(-0.22);
      ctx.scale(1, 0.3);
      ctx.beginPath();
      ctx.arc(0, 0, r * 1.62, a0, a1);
      ctx.restore();
    };
    ctx.lineCap = 'round';
    ctx.strokeStyle = o.v === 'white' ? '#ffffff' : shade(accent, 0.25); // mitad de atrás del halo
    ctx.lineWidth = r * 0.14;
    haloArc(Math.PI, TAU);
    ctx.stroke();
    if (o.v !== 'white') { // llamas de los propulsores
      for (const x of [-0.55, 0, 0.55]) {
        const fl = 0.5 + 0.5 * Math.random();
        glow(ctx, x * r, r * 1.35 + fl * r * 0.2, r * 0.5, '#7fd8ff', 0.8);
        ctx.fillStyle = '#e8fbff';
        ctx.beginPath();
        ctx.moveTo(x * r - r * 0.09, r * 1.2);
        ctx.lineTo(x * r, r * (1.38 + fl * 0.4));
        ctx.lineTo(x * r + r * 0.09, r * 1.2);
        ctx.closePath();
        ctx.fill();
      }
    }
    put(ctx, B, 0, 0, sc);
    if (o.v !== 'white') {
      // cañón hacia donde apunta (o hacia el jugador) y lente con iris que mira
      let ax = o.lx;
      let ay = o.ly;
      if (e.aim > 0) { ax = Math.cos(e.aimAngle); ay = Math.sin(e.aimAngle); }
      const ang = Math.atan2(ay, ax);
      ctx.save();
      ctx.rotate(ang);
      shaded(ctx, (gg) => roundRect(gg, r * 0.45, -r * 0.13, r * 1.05, r * 0.26, r * 0.1), '#8d84b0', { x0: r * 0.45, y0: -r * 0.13, x1: r * 1.5, y1: r * 0.13, hi: 0.5, lw: 1.5 });
      ctx.restore();
      if (e.locked) glow(ctx, Math.cos(ang) * r * 1.55, Math.sin(ang) * r * 1.55, r * 0.7, '#ff3b3b', 0.95);
      const iris = e.locked ? '#ff3b3b' : '#22f3ff';
      glow(ctx, ax * r * 0.12, ay * r * 0.12, r * 0.8, iris, 0.85);
      ctx.fillStyle = iris;
      ctx.beginPath();
      ctx.arc(ax * r * 0.14, ay * r * 0.14, r * 0.3, 0, TAU);
      ctx.fill();
      ctx.fillStyle = '#080614';
      ctx.beginPath();
      ctx.ellipse(ax * r * 0.17, ay * r * 0.17, r * 0.08, r * 0.24, ang + Math.PI / 2, 0, TAU);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.beginPath();
      ctx.arc(-r * 0.14, -r * 0.16, r * 0.07, 0, TAU);
      ctx.fill();
      const blink = Math.sin(gfx.anim * 6 + e.seed) > 0.4;
      glow(ctx, r * 0.78, -r * 1.55, r * 0.34, blink ? '#ff3b3b' : '#ffd36a', 0.9);
    }
    ctx.strokeStyle = o.v === 'white' ? '#ffffff' : shade(accent, 0.5); // mitad de delante del halo
    ctx.lineWidth = r * 0.14;
    haloArc(0, Math.PI);
    ctx.stroke();
  }

  // ------------------------------------------------------------------ Dibujo de enemigos (API)
  /**
   * Dibuja un enemigo (que no sea jefe). spawn: null, o 0..1 si está apareciendo (silueta que se materializa).
   * Los monstruos van "de pie" (visión 3/4): miran a izquierda o derecha, se inclinan al avanzar, corren y parpadean.
   */
  function drawEnemy(ctx, e, gfx, spawn) {
    const vx = e.vx + e.kx;
    if (Math.abs(vx) > 6) e.face = vx > 0 ? 1 : -1;
    else if (!e.face) e.face = 1;
    const tgt = gfx.target;
    let lx = 0;
    let ly = 0;
    let near = false;
    if (tgt) {
      const dx = tgt.x - e.x;
      const dy = tgt.y - e.y;
      const d = Math.hypot(dx, dy) || 1;
      lx = dx / d;
      ly = dy / d;
      near = d < e.r * 4.5 + 40;
    }
    const o = { v: e.flash > 0 ? 'white' : gfx.frozen ? 'ice' : null, lx, ly, near };
    ctx.save();
    if (spawn !== null && spawn !== undefined) { // materializándose
      ctx.globalAlpha = 0.15 + 0.7 * spawn;
      const s = 0.45 + 0.55 * spawn;
      ctx.translate(e.x, e.y);
      ctx.scale(s, s);
      ctx.translate(-e.x, -e.y);
      o.v = o.v || 'ice';
    }
    switch (e.id) {
      case 'rapido': drawBat(ctx, e, gfx, o); break;
      case 'tanque': drawGolem(ctx, e, gfx, o); break;
      case 'explosivo': drawBomb(ctx, e, gfx, o); break;
      case 'francotirador': drawSentinel(ctx, e, gfx, o); break;
      default: drawImp(ctx, e, gfx, o);
    }
    ctx.restore();
  }

  // Luz de color bajo cada monstruo (los tiñe el suelo)
  function enemyGlow(ctx, e) {
    if (low) return;
    glow(ctx, e.x, e.y + e.r * 0.45, e.r * 2.5, e.def.color, 0.22);
  }

  // ------------------------------------------------------------------ Jefe
  /** Cuerpo del jefe: coraza de placas con pinchos (sprite) + núcleo que late y anillo de runas que gira. */
  function bossBody(ctx, look, r, anim, o) {
    const rb = Math.round(r);
    const S = sprite('boss:' + look.color + ':' + look.sides + ':' + look.spikes + ':' + rb, rb * 3.2, rb * 3.2, (g) => {
      const n = look.spikes ? look.sides * 2 : look.sides;
      const poly = (rad, rot) => (gg) => {
        gg.beginPath();
        for (let i = 0; i < n; i++) {
          const a = rot + (i * TAU) / n - Math.PI / 2;
          const rr = look.spikes ? (i % 2 === 0 ? rad * 1.28 : rad * 0.92) : rad;
          const x = Math.cos(a) * rr;
          const y = Math.sin(a) * rr;
          if (i === 0) gg.moveTo(x, y); else gg.lineTo(x, y);
        }
        gg.closePath();
      };
      const armor = mix(look.color, '#20202c', 0.5);
      shaded(g, poly(rb, 0), armor, {
        x0: -rb * 1.3, y0: -rb * 1.3, x1: rb * 1.3, y1: rb * 1.3, hi: 0.45, lw: 3,
        tex(gg) {
          gg.strokeStyle = 'rgba(5,5,12,0.55)'; // costuras de las placas
          gg.lineWidth = 2.4;
          gg.beginPath();
          for (let i = 0; i < n; i++) { const a = (i * TAU) / n - Math.PI / 2; gg.moveTo(Math.cos(a) * rb * 0.6, Math.sin(a) * rb * 0.6); gg.lineTo(Math.cos(a) * rb * 1.3, Math.sin(a) * rb * 1.3); }
          gg.stroke();
          gg.fillStyle = 'rgba(255,255,255,0.65)'; // remaches
          for (let i = 0; i < n; i++) { const a = (i * TAU) / n - Math.PI / 2 + TAU / (2 * n); gg.beginPath(); gg.arc(Math.cos(a) * rb * 0.85, Math.sin(a) * rb * 0.85, rb * 0.04, 0, TAU); gg.fill(); }
        },
      });
      g.strokeStyle = rgba(look.color, 0.9); // filo de color
      g.lineWidth = 3;
      poly(rb * 0.9, 0)(g);
      g.stroke();
      shaded(g, (gg) => { gg.beginPath(); gg.arc(0, 0, rb * 0.62, 0, TAU); }, shade(armor, -0.2), { x0: -rb * 0.62, y0: -rb * 0.62, x1: rb * 0.62, y1: rb * 0.62, hi: 0.3, lw: 3, outline: rgba(look.color, 0.8) });
      spec(g, -rb * 0.45, -rb * 0.6, rb * 0.5, rb * 0.2, -0.6, 0.55);
    });
    const V = variant(S, o.hit ? 'white' : null);
    put(ctx, V, 0, 0, 1);
    if (o.hit) return;
    const col = look.rainbow ? 'hsl(' + (((anim * 140) % 360) | 0) + ', 100%, 62%)' : look.color;
    const pulse = 0.7 + 0.3 * Math.sin(anim * (o.enraged ? 9 : 4));
    const coreCol = o.enraged ? C.colors.danger : look.color;
    glow(ctx, 0, 0, r * 1.15, coreCol, 0.9 * pulse); // el núcleo
    ctx.save();
    ctx.rotate(anim * 0.6 * (look.sides % 2 ? 1 : -1)); // anillo de runas que gira
    ctx.strokeStyle = look.rainbow ? col : shade(look.color, 0.6);
    ctx.lineWidth = Math.max(2, r * 0.045);
    ctx.lineCap = 'round';
    ctx.shadowColor = coreCol;
    ctx.shadowBlur = 8;
    for (let i = 0; i < 12; i++) {
      const a = (i * TAU) / 12;
      const l0 = r * 0.4;
      const l1 = r * (i % 3 === 0 ? 0.58 : 0.5);
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * l0, Math.sin(a) * l0);
      ctx.lineTo(Math.cos(a) * l1, Math.sin(a) * l1);
      ctx.stroke();
    }
    ctx.restore();
  }

  // ------------------------------------------------------------------ Paredes con materiales
  const WALL_STYLE = { neon: 'tech', jade: 'crystal', sunset: 'stone', ocean: 'crystal', candy: 'candy', toxic: 'tech', aurora: 'crystal', ember: 'stone' };

  function wallTech(g, q, col, rnd, D) {
    const horiz = q.w >= q.h;
    const fg = g.createLinearGradient(0, q.y + q.h, 0, q.y + q.h + D);
    fg.addColorStop(0, '#2a2440');
    fg.addColorStop(1, '#0a0812');
    g.fillStyle = fg;
    g.fillRect(q.x, q.y + q.h, q.w, D);
    g.fillRect(q.x + q.w, q.y + 5, 5, q.h + D - 5);
    g.fillStyle = rgba(col, 0.7); // ranuras de luz en la cara frontal
    for (let x = q.x + 7; x < q.x + q.w - 8; x += 13) g.fillRect(x, q.y + q.h + 5, 5, D - 10);
    const tg = g.createLinearGradient(q.x, q.y, q.x + q.w, q.y + q.h);
    tg.addColorStop(0, '#463e66');
    tg.addColorStop(1, '#1d1933');
    g.fillStyle = tg;
    g.fillRect(q.x, q.y, q.w, q.h);
    g.strokeStyle = 'rgba(0,0,0,0.55)'; // paneles
    g.lineWidth = 1.6;
    g.beginPath();
    if (horiz) for (let x = q.x + 50; x < q.x + q.w - 4; x += 50) { g.moveTo(x, q.y); g.lineTo(x, q.y + q.h); }
    else for (let y = q.y + 50; y < q.y + q.h - 4; y += 50) { g.moveTo(q.x, y); g.lineTo(q.x + q.w, y); }
    g.stroke();
    g.save(); // franja de energía central
    g.shadowColor = col;
    g.shadowBlur = 12;
    g.fillStyle = col;
    if (horiz) g.fillRect(q.x + 8, q.y + q.h / 2 - 1.8, q.w - 16, 3.6);
    else g.fillRect(q.x + q.w / 2 - 1.8, q.y + 8, 3.6, q.h - 16);
    g.restore();
    g.fillStyle = 'rgba(255,255,255,0.6)'; // remaches
    for (let i = 0; i < 3 + Math.floor(rnd() * 2); i++) { g.beginPath(); g.arc(q.x + 5 + rnd() * (q.w - 10), q.y + 5 + rnd() * (q.h - 10), 1.8, 0, TAU); g.fill(); }
    g.strokeStyle = 'rgba(255,255,255,0.55)';
    g.lineWidth = 1.6;
    g.beginPath(); g.moveTo(q.x + 1, q.y + q.h - 1); g.lineTo(q.x + 1, q.y + 1); g.lineTo(q.x + q.w - 1, q.y + 1); g.stroke();
  }

  function wallCrystal(g, q, col, rnd, D) {
    const fg = g.createLinearGradient(0, q.y + q.h, 0, q.y + q.h + D);
    fg.addColorStop(0, mix(col, '#ffffff', 0.15));
    fg.addColorStop(1, shade(col, -0.78));
    g.fillStyle = fg;
    g.fillRect(q.x, q.y + q.h, q.w, D);
    g.fillRect(q.x + q.w, q.y + 5, 5, q.h + D - 5);
    g.strokeStyle = 'rgba(255,255,255,0.28)'; // facetas verticales
    g.lineWidth = 1.2;
    g.beginPath();
    for (let x = q.x + 9; x < q.x + q.w; x += 14) { g.moveTo(x, q.y + q.h); g.lineTo(x + 3, q.y + q.h + D); }
    g.stroke();
    // cima facetada: cada celda de 25 px son cuatro triángulos con luz distinta
    const cell = 25;
    const nx = Math.max(1, Math.round(q.w / cell));
    const ny = Math.max(1, Math.round(q.h / cell));
    const cw = q.w / nx;
    const ch = q.h / ny;
    for (let j = 0; j < ny; j++) {
      for (let i = 0; i < nx; i++) {
        const x = q.x + i * cw;
        const y = q.y + j * ch;
        const cx = x + cw / 2;
        const cy = y + ch / 2;
        const tri = [[x, y, x + cw, y], [x + cw, y, x + cw, y + ch], [x + cw, y + ch, x, y + ch], [x, y + ch, x, y]];
        tri.forEach((t, k) => {
          const light = (k === 0 ? 0.35 : k === 3 ? 0.18 : k === 1 ? -0.3 : -0.5) + (rnd() - 0.5) * 0.28;
          g.fillStyle = light >= 0 ? mix(col, '#ffffff', 0.15 + light) : shade(col, light);
          g.beginPath();
          g.moveTo(cx, cy); g.lineTo(t[0], t[1]); g.lineTo(t[2], t[3]);
          g.closePath();
          g.fill();
        });
      }
    }
    g.strokeStyle = 'rgba(255,255,255,0.4)';
    g.lineWidth = 1;
    g.strokeRect(q.x + 0.5, q.y + 0.5, q.w - 1, q.h - 1);
    // púas de cristal que asoman por arriba
    const big = q.w >= 90 && q.h >= 90;
    const step = big ? 30 : 38;
    const n = Math.max(2, Math.floor(Math.max(q.w, q.h) / step));
    for (let i = 0; i < n; i++) {
      const horiz = q.w >= q.h;
      const px = horiz ? q.x + (i + 0.5) * (q.w / n) : q.x + q.w * (0.3 + rnd() * 0.4);
      const py = horiz ? q.y + 3 : q.y + (i + 0.5) * (q.h / n);
      const hh = (big ? 20 : 11) + rnd() * (big ? 16 : 8);
      const ww = big ? 11 : 7;
      g.beginPath();
      g.moveTo(px - ww, py + 5); g.lineTo(px + (rnd() - 0.5) * 4, py - hh); g.lineTo(px + ww, py + 5);
      g.closePath();
      const sg = g.createLinearGradient(px - ww, py, px + ww, py);
      sg.addColorStop(0, mix(col, '#ffffff', 0.6));
      sg.addColorStop(0.55, col);
      sg.addColorStop(1, shade(col, -0.5));
      g.fillStyle = sg;
      g.fill();
      g.strokeStyle = 'rgba(255,255,255,0.55)';
      g.lineWidth = 1;
      g.stroke();
    }
    g.fillStyle = 'rgba(255,255,255,0.9)'; // destellos
    for (let i = 0; i < 2 + Math.floor(Math.max(q.w, q.h) / 80); i++) {
      const sx = q.x + 4 + rnd() * (q.w - 8);
      const sy = q.y + 4 + rnd() * (q.h - 8);
      const s = 2.2 + rnd() * 2;
      g.beginPath();
      g.moveTo(sx, sy - s * 1.8); g.lineTo(sx + s * 0.4, sy - s * 0.4); g.lineTo(sx + s * 1.8, sy);
      g.lineTo(sx + s * 0.4, sy + s * 0.4); g.lineTo(sx, sy + s * 1.8); g.lineTo(sx - s * 0.4, sy + s * 0.4);
      g.lineTo(sx - s * 1.8, sy); g.lineTo(sx - s * 0.4, sy - s * 0.4);
      g.closePath();
      g.fill();
    }
  }

  function wallStone(g, q, col, rnd, D, ember) {
    const stone = mix(col, '#3a3340', 0.82);
    const brickRows = (x0, y0, w, h, rowH, dark) => {
      let r = 0;
      for (let y = y0; y < y0 + h - 0.5; y += rowH, r++) {
        const hh = Math.min(rowH, y0 + h - y);
        const off = r % 2 ? rowH : 0;
        for (let x = x0 - off; x < x0 + w; x += rowH * 2) {
          const bx = Math.max(x0, x);
          const bw = Math.min(x + rowH * 2, x0 + w) - bx;
          if (bw < 2) continue;
          const v = (rnd() - 0.5) * 0.3 + dark;
          g.fillStyle = v >= 0 ? mix(stone, '#ffffff', v) : shade(stone, v);
          g.fillRect(bx, y, bw, hh);
          g.fillStyle = 'rgba(255,255,255,0.1)'; // luz en el borde de arriba de cada ladrillo
          g.fillRect(bx, y, bw, 1.4);
          g.fillStyle = 'rgba(0,0,0,0.38)'; // argamasa
          g.fillRect(bx, y + hh - 1.6, bw, 1.6);
          g.fillRect(bx + bw - 1.6, y, 1.6, hh);
        }
      }
    };
    brickRows(q.x, q.y + q.h, q.w, D, D / 2, -0.28);
    g.fillStyle = shade(stone, -0.6);
    g.fillRect(q.x + q.w, q.y + 5, 5, q.h + D - 5);
    brickRows(q.x, q.y, q.w, q.h, 12.5, 0.02);
    g.strokeStyle = ember ? col : 'rgba(0,0,0,0.6)'; // grietas (con lava en el tema ember)
    g.lineWidth = ember ? 2.2 : 1.6;
    g.lineCap = 'round';
    g.save();
    if (ember) { g.shadowColor = col; g.shadowBlur = 8; }
    for (let k = 0; k < 2 + Math.floor(Math.max(q.w, q.h) / 90); k++) {
      let x = q.x + 6 + rnd() * (q.w - 12);
      let y = q.y + 4 + rnd() * (q.h - 8);
      g.beginPath();
      g.moveTo(x, y);
      for (let s = 0; s < 4; s++) { x += (rnd() - 0.5) * 16; y += (rnd() - 0.4) * 10; g.lineTo(clamp(x, q.x + 1, q.x + q.w - 1), clamp(y, q.y + 1, q.y + q.h - 1)); }
      g.stroke();
    }
    g.restore();
    g.strokeStyle = 'rgba(255,255,255,0.4)';
    g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(q.x + 1, q.y + q.h - 1); g.lineTo(q.x + 1, q.y + 1); g.lineTo(q.x + q.w - 1, q.y + 1); g.stroke();
  }

  function wallCandy(g, q, col, rnd, D) {
    const rad = Math.min(8, q.w / 2, q.h / 2);
    const light = mix(col, '#ffffff', 0.42);
    const fg = g.createLinearGradient(0, q.y + q.h, 0, q.y + q.h + D);
    fg.addColorStop(0, shade(col, -0.1));
    fg.addColorStop(1, shade(col, -0.65));
    g.fillStyle = fg;
    roundRect(g, q.x, q.y + q.h - rad, q.w, D + rad, rad);
    g.fill();
    g.fillStyle = 'rgba(255,255,255,0.35)';
    g.fillRect(q.x + 4, q.y + q.h + 3, q.w - 8, 2);
    const tg = g.createLinearGradient(q.x, q.y, q.x + q.w, q.y + q.h);
    tg.addColorStop(0, light);
    tg.addColorStop(1, col);
    g.fillStyle = tg;
    roundRect(g, q.x, q.y, q.w, q.h, rad);
    g.fill();
    g.save();
    roundRect(g, q.x, q.y, q.w, q.h, rad);
    g.clip();
    g.strokeStyle = 'rgba(255,255,255,0.3)'; // rayas de caramelo
    g.lineWidth = 6;
    g.beginPath();
    for (let s = -q.h; s < q.w + q.h; s += 20) { g.moveTo(q.x + s, q.y + q.h); g.lineTo(q.x + s + q.h, q.y); }
    g.stroke();
    const palette = ['#ffe04a', '#22f3ff', '#ffffff', '#b583ff'];
    g.lineWidth = 2.4; // grageas
    g.lineCap = 'round';
    for (let k = 0; k < 3 + Math.floor((q.w * q.h) / 900); k++) {
      const x = q.x + 5 + rnd() * (q.w - 10);
      const y = q.y + 4 + rnd() * (q.h - 8);
      const a = rnd() * TAU;
      g.strokeStyle = palette[k % palette.length];
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * 4, y + Math.sin(a) * 4); g.stroke();
    }
    g.restore();
    g.fillStyle = 'rgba(255,255,255,0.62)'; // brillo de gominola
    roundRect(g, q.x + 3, q.y + 2.5, Math.min(q.w * 0.5, 36), 4, 2);
    g.fill();
    g.strokeStyle = shade(col, -0.5);
    g.lineWidth = 1.6;
    roundRect(g, q.x, q.y, q.w, q.h, rad);
    g.stroke();
  }

  /** Dibuja todas las paredes (en un lienzo ya escalado a unidades del mundo). Luz y sombras incluidas. */
  function walls(g, list, theme) {
    const style = WALL_STYLE[theme.id] || 'tech';
    const col = theme.wall;
    const D = 21;
    // sombra proyectada y resplandor de color alrededor
    g.save();
    g.shadowColor = 'rgba(0,0,0,0.7)';
    g.shadowBlur = 20;
    g.shadowOffsetX = 7;
    g.shadowOffsetY = 12;
    g.fillStyle = '#000';
    for (const q of list) g.fillRect(q.x, q.y, q.w, q.h + D * 0.4);
    g.restore();
    g.save();
    g.shadowColor = rgba(col, 0.55);
    g.shadowBlur = 26;
    g.fillStyle = col;
    for (const q of list) g.fillRect(q.x + 2, q.y + 2, q.w - 4, q.h - 4);
    g.restore();
    list.forEach((q, i) => {
      const rnd = rngOf(Math.round(q.x * 31 + q.y * 17 + i * 101));
      if (style === 'crystal') wallCrystal(g, q, col, rnd, D);
      else if (style === 'stone') wallStone(g, q, col, rnd, D, theme.id === 'ember');
      else if (style === 'candy') wallCandy(g, q, col, rnd, D);
      else wallTech(g, q, col, rnd, D);
      const ao = g.createLinearGradient(0, q.y + q.h + D, 0, q.y + q.h + D + 12); // oclusión: el suelo bajo la pared es más oscuro
      ao.addColorStop(0, 'rgba(0,0,0,0.4)');
      ao.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = ao;
      g.fillRect(q.x, q.y + q.h + D, q.w + 5, 12);
    });
  }

  // ------------------------------------------------------------------ Suelo
  /** Baldosas biseladas con variación, grietas, partículas de polvo y un emblema en el centro. */
  function floor(g, w, h, theme) {
    const rnd = rngOf(Math.round(w * 7 + h * 13) + theme.id.length * 977);
    const bg = g.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.08, w / 2, h / 2, Math.max(w, h) * 0.78);
    bg.addColorStop(0, theme.glow);
    bg.addColorStop(1, theme.bg);
    g.fillStyle = bg;
    g.fillRect(0, 0, w, h);
    const step = 50;
    for (let y = 0; y < h; y += step) {
      for (let x = 0; x < w; x += step) {
        const v = (rnd() - 0.5) * 0.045;
        g.fillStyle = v >= 0 ? 'rgba(255,255,255,' + (0.025 + v) + ')' : 'rgba(0,0,0,' + (-v * 2.2) + ')';
        g.fillRect(x + 1, y + 1, step - 2, step - 2);
        g.fillStyle = 'rgba(255,255,255,0.075)'; // bisel: luz arriba y a la izquierda
        g.fillRect(x + 1, y + 1, step - 2, 1.4);
        g.fillRect(x + 1, y + 1, 1.4, step - 2);
        g.fillStyle = 'rgba(0,0,0,0.28)'; // y sombra abajo y a la derecha
        g.fillRect(x + 1, y + step - 2.4, step - 2, 1.4);
        g.fillRect(x + step - 2.4, y + 1, 1.4, step - 2);
      }
    }
    g.strokeStyle = theme.grid; // juntas con brillo de color
    g.lineWidth = 1.2;
    g.beginPath();
    for (let x = step; x < w; x += step) { g.moveTo(x + 0.5, 0); g.lineTo(x + 0.5, h); }
    for (let y = step; y < h; y += step) { g.moveTo(0, y + 0.5); g.lineTo(w, y + 0.5); }
    g.stroke();
    g.fillStyle = 'rgba(255,255,255,0.18)'; // cruces en las uniones
    for (let y = step; y < h; y += step) for (let x = step; x < w; x += step) g.fillRect(x - 1, y - 1, 2.4, 2.4);
    g.strokeStyle = 'rgba(0,0,0,0.3)'; // grietas y desgaste
    g.lineWidth = 1.3;
    for (let k = 0; k < Math.round((w * h) / 90000); k++) {
      let x = rnd() * w;
      let y = rnd() * h;
      g.beginPath();
      g.moveTo(x, y);
      for (let s = 0; s < 5; s++) { x += (rnd() - 0.5) * 30; y += (rnd() - 0.3) * 20; g.lineTo(x, y); }
      g.stroke();
    }
    g.fillStyle = 'rgba(255,255,255,0.05)'; // motas
    for (let k = 0; k < Math.round((w * h) / 1500); k++) g.fillRect(rnd() * w, rnd() * h, 1.4, 1.4);
    // emblema central: anillos, marcas y rombos
    const cx = w / 2;
    const cy = h / 2;
    const R = Math.min(w, h) * 0.2;
    g.save();
    g.translate(cx, cy);
    g.strokeStyle = rgba(theme.corner, 0.22);
    g.lineWidth = 2;
    for (const f of [1, 0.66, 0.34]) { g.beginPath(); g.arc(0, 0, R * f, 0, TAU); g.stroke(); }
    g.setLineDash([4, 9]);
    g.beginPath(); g.arc(0, 0, R * 1.18, 0, TAU); g.stroke();
    g.setLineDash([]);
    g.lineWidth = 2.5;
    g.beginPath();
    for (let i = 0; i < 24; i++) { const a = (i * TAU) / 24; const l0 = R * 0.96; const l1 = R * (i % 6 === 0 ? 1.12 : 1.04); g.moveTo(Math.cos(a) * l0, Math.sin(a) * l0); g.lineTo(Math.cos(a) * l1, Math.sin(a) * l1); }
    g.stroke();
    g.fillStyle = rgba(theme.corner, 0.2);
    for (let i = 0; i < 4; i++) { g.save(); g.rotate((i * TAU) / 4); g.beginPath(); g.moveTo(R * 0.5, 0); g.lineTo(R * 0.64, R * 0.07); g.lineTo(R * 0.78, 0); g.lineTo(R * 0.64, -R * 0.07); g.closePath(); g.fill(); g.restore(); }
    g.restore();
    const sh = g.createLinearGradient(0, 0, w, h); // brillo suave en diagonal
    sh.addColorStop(0, 'rgba(255,255,255,0.06)');
    sh.addColorStop(0.5, 'rgba(255,255,255,0)');
    sh.addColorStop(1, 'rgba(0,0,0,0.12)');
    g.fillStyle = sh;
    g.fillRect(0, 0, w, h);
  }

  // ------------------------------------------------------------------ Gemas, corazón, arma
  function gemSprite(color, s) {
    return sprite('gem:' + color + ':' + s, s * 3.2, s * 3.6, (g) => {
      const P = [[0, -1.25], [0.82, -0.45], [0.66, 0.85], [0, 1.3], [-0.66, 0.85], [-0.82, -0.45]].map(([x, y]) => [x * s, y * s]);
      const cx = 0;
      const cy = 0;
      const facets = [[0, 1, 0.45], [1, 2, -0.25], [2, 3, -0.55], [3, 4, -0.4], [4, 5, 0.1], [5, 0, 0.6]];
      for (const [a, b, l] of facets) {
        g.beginPath();
        g.moveTo(cx, cy); g.lineTo(P[a][0], P[a][1]); g.lineTo(P[b][0], P[b][1]);
        g.closePath();
        g.fillStyle = l >= 0 ? mix(color, '#ffffff', l) : shade(color, l);
        g.fill();
      }
      g.beginPath();
      P.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y)));
      g.closePath();
      g.strokeStyle = 'rgba(255,255,255,0.75)';
      g.lineWidth = 1.4;
      g.stroke();
      spec(g, -s * 0.3, -s * 0.55, s * 0.42, s * 0.2, -0.9, 0.9);
    });
  }
  /** Una gema facetada que gira (se aplasta de lado como si diera la vuelta) y brilla. */
  function drawGem(ctx, x, y, size, color, anim, seed) {
    const s = bucket(size) / 2;
    const S = gemSprite(color, s);
    const spin = 0.55 + 0.45 * Math.abs(Math.cos(anim * 2.3 + seed));
    const bob = Math.sin(anim * 3 + seed) * 1.6;
    if (!low) glow(ctx, x, y + bob, size * 3.2, color, 0.55);
    const sc = size / (s * 1.25);
    ctx.drawImage(S.c, x - (S.w * sc * spin) / 2, y + bob - (S.h * sc) / 2, S.w * sc * spin, S.h * sc);
  }

  function heartPathG(g, r) {
    g.beginPath();
    g.moveTo(0, r * 0.95);
    g.bezierCurveTo(-r * 1.6, -r * 0.1, -r * 0.95, -r * 1.15, 0, -r * 0.4);
    g.bezierCurveTo(r * 0.95, -r * 1.15, r * 1.6, -r * 0.1, 0, r * 0.95);
    g.closePath();
  }
  function drawHeart(ctx, r) {
    const S = sprite('heart:' + r, r * 3.6, r * 3.4, (g) => {
      g.translate(0, r * 0.15);

  <script>
/* ===== maze.js ===== */
'use strict';

/**
 * Maze — paredes y laberintos de la arena.
 *
 *  generate(nivel, ancho, alto, esJefe)  coloca las paredes de ese nivel. Es determinista: el mismo nivel y tamaño
 *                                        de arena dan siempre el mismo laberinto. Garantiza que se pueda llegar a todas partes.
 *  resolve(obj)        saca de las paredes a un círculo {x, y, r}
 *  hit(x, y, r)        ¿un círculo toca alguna pared?     isFree(x, y, r)  lo contrario y además dentro de la arena
 *  los(x1,y1,x2,y2,r)  ¿hay línea de visión libre entre dos puntos?     raycast(x, y, ángulo, máx)  distancia hasta la pared
 *  setTarget(x, y) + flowDir(x, y)   búsqueda de camino: dirección que lleva hacia el objetivo rodeando las paredes
 *  prepare(k, tema, ancho, alto) + draw(ctx)   las paredes se dibujan UNA vez con volumen (cara superior, grosor y sombra)
 *
 * Plan por nivel: < firstLevel nada · 5-19 pilares · 20-39 paredes con huecos · 40+ laberinto denso
 * (los pasillos miden 75 px y a partir del nivel 70 miden 100 px, porque los monstruos son enormes).
 */
const Maze = (() => {
  const C = GAME_CONFIG;
  const M = C.maze;
  const CELL = M.cell;
  const FINE = CELL / 2; // resolución del campo de flujo (búsqueda de camino)

  let W = 0;
  let H = 0;
  let cols = 0;
  let rows = 0;
  let ox = 0;
  let oy = 0;
  let walls = [];          // rectángulos {x, y, w, h} en unidades del mundo
  let fw = 0;
  let fh = 0;
  let fblock = new Uint8Array(0);
  let fdist = new Int16Array(0);
  let queue = new Int32Array(0);
  let tcell = -1;
  let cache = null;        // canvas con las paredes ya dibujadas
  const dir = { x: 0, y: 0 };
  const info = { nx: 0, ny: 0 };

  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

  // Números aleatorios propios y deterministas (no usan Math.random: el laberinto de un nivel es siempre el mismo)
  function rng(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function clear() {
    walls = [];
    cache = null;
    tcell = -1;
    fblock = new Uint8Array(0);
  }

  // ---------------------------------------------------------------- Plan por nivel
  function plan(level, boss) {
    if (!M.enabled) return null;
    if (boss) return { arena: true };
    if (level < M.firstLevel) return null;
    let gap = M.gaps[0][1]; // celdas libres mínimas entre paredes (el pasillo mide gap * celda)
    for (let i = 0; i < M.gaps.length; i++) if (level >= M.gaps[i][0]) gap = M.gaps[i][1];
    const pillar = 4; // pilares de 4x4 celdas (100 px)
    if (level < 20) return { pillars: Math.min(6, 2 + Math.floor((level - M.firstLevel) / 2)), pillar, segs: 0, minLen: 0, maxLen: 0, gap };
    return {
      pillars: Math.min(5, 1 + Math.floor((level - 20) / 15)),
      pillar,
      segs: Math.min(M.maxSegments, 5 + Math.floor((level - 20) / 4)),
      minLen: 6,
      maxLen: Math.min(14, 8 + Math.floor((level - 20) / 10)), // paredes de 150-350 px: caben muchas y forman cámaras
      gap,
    };
  }

  // ---------------------------------------------------------------- Generación
  /** Devuelve cuántos rectángulos de pared hay. */
  function generate(level, w, h, boss) {
    clear();
    W = w;
    H = h;
    cols = Math.floor(w / CELL);
    rows = Math.floor(h / CELL);
    ox = (w - cols * CELL) / 2;
    oy = (h - rows * CELL) / 2;
    const pl = plan(level, boss);
    if (!pl || cols < 18 || rows < 18) { buildFlow(); return 0; }

    // En una arena más grande (pantalla ancha) caben más paredes: se escala con el área respecto a la de referencia (24 x 28 celdas)
    const areaK = clamp((cols * rows) / (24 * 28), 0.8, 2.6);
    if (pl.segs) pl.segs = Math.min(M.maxSegments * 2, Math.round(pl.segs * areaK));
    if (pl.pillars) pl.pillars = Math.min(10, Math.round(pl.pillars * areaK));
    const rand = rng(level * 7919 + cols * 31 + rows * 17);
    const grid = new Uint8Array(cols * rows);
    const owner = new Int16Array(cols * rows); // qué pared ocupa cada celda (id + 1)
    const pieces = []; // {c0, r0, cw, rh} de cada pared colocada
    const cc = Math.floor(cols / 2);
    const cr = Math.floor(rows / 2);
    const lo = M.border;
    const T = M.thick;

    const inStart = (c, r) => Math.abs(c - cc) < M.startClear && Math.abs(r - cr) < M.startClear;

    // ¿Se llega desde el centro a TODAS las celdas libres? (4 vecinos)
    function connected() {
      const seen = new Uint8Array(cols * rows);
      const stack = [cr * cols + cc];
      seen[cr * cols + cc] = 1;
      let reach = 1;
      let free = 0;
      for (let i = 0; i < grid.length; i++) if (!grid[i]) free++;
      while (stack.length) {
        const cur = stack.pop();
        const c = cur % cols;
        const r = (cur / cols) | 0;
        const nb = [c > 0 ? cur - 1 : -1, c < cols - 1 ? cur + 1 : -1, r > 0 ? cur - cols : -1, r < rows - 1 ? cur + cols : -1];
        for (let k = 0; k < 4; k++) {
          const n = nb[k];
          if (n < 0 || grid[n] || seen[n]) continue;
          seen[n] = 1;
          reach++;
          stack.push(n);
        }
      }
      return reach === free;
    }

    // Intenta colocar un bloque (c0, r0, ancho, alto en celdas). Devuelve true si cabe y no aísla ninguna zona.
    // parent = pared a la que se pega una bifurcación (T o L): con ella SÍ puede estar en contacto.
    function place(c0, r0, cw, rh, gap, parent) {
      if (c0 < lo || r0 < lo || c0 + cw > cols - lo || r0 + rh > rows - lo) return false;
      for (let r = r0; r < r0 + rh; r++) for (let c = c0; c < c0 + cw; c++) if (inStart(c, r) || grid[r * cols + c]) return false;
      for (let r = Math.max(0, r0 - gap); r < Math.min(rows, r0 + rh + gap); r++) {
        for (let c = Math.max(0, c0 - gap); c < Math.min(cols, c0 + cw + gap); c++) {
          const o = owner[r * cols + c];
          if (o && o !== (parent === undefined ? -1 : parent + 1)) return false; // otra pared demasiado cerca
        }
      }
      const id = pieces.length;
      for (let r = r0; r < r0 + rh; r++) for (let c = c0; c < c0 + cw; c++) { grid[r * cols + c] = 1; owner[r * cols + c] = id + 1; }
      if (!connected()) {
        for (let r = r0; r < r0 + rh; r++) for (let c = c0; c < c0 + cw; c++) { grid[r * cols + c] = 0; owner[r * cols + c] = 0; }
        return false;
      }
      pieces.push({ c0, r0, cw, rh, seg: Math.max(cw, rh) >= 6 });
      walls.push({ x: ox + c0 * CELL, y: oy + r0 * CELL, w: cw * CELL, h: rh * CELL });
      return true;
    }

    const span = (n) => Math.max(1, n - 2 * lo);

    if (pl.arena) {
      // Arena del jefe: cuatro pilares simétricos para esconderse, y el centro libre
      const p = pl.pillar || 4;
      const px = [Math.max(lo, Math.round(cols * 0.15)), cols - Math.max(lo, Math.round(cols * 0.15)) - p];
      const py = [Math.round(rows * 0.25), Math.round(rows * 0.75) - p];
      for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) place(px[i], py[j], p, p, 0);
    } else {
      // Primero las paredes largas; algunas nacen pegadas a otra (bifurcaciones en T y en L: laberinto), luego los pilares
      let placed = 0;
      for (let t = 0; t < 600 && placed < pl.segs; t++) {
        const lenOf = (maxL) => pl.minLen + Math.floor(rand() * (maxL - pl.minLen + 1));
        if (placed >= 1 && rand() < 0.6) {
          // bifurcación: sale perpendicular desde un lado de una pared existente
          const pid = Math.floor(rand() * pieces.length);
          const q = pieces[pid];
          if (!q.seg) continue; // los pilares no se bifurcan
          const horizontalParent = q.cw >= q.rh;
          const len = lenOf(pl.maxLen);
          const up = rand() < 0.5; // hacia arriba/izquierda o abajo/derecha
          if (horizontalParent) {
            const c = q.c0 + Math.floor(rand() * Math.max(1, q.cw - T + 1));
            const r0 = up ? q.r0 - len : q.r0 + q.rh;
            if (place(c, r0, T, len, pl.gap, pid)) placed++;
          } else {
            const r = q.r0 + Math.floor(rand() * Math.max(1, q.rh - T + 1));
            const c0 = up ? q.c0 - len : q.c0 + q.cw;
            if (place(c0, r, len, T, pl.gap, pid)) placed++;
          }
        } else {
          const horizontal = rand() < 0.5;
          const maxL = Math.min(pl.maxLen, (horizontal ? span(cols) : span(rows)) - 1);
          if (maxL < pl.minLen) break;
          const len = lenOf(maxL);
          const cw = horizontal ? len : T;
          const rh = horizontal ? T : len;
          const c0 = lo + Math.floor(rand() * (cols - 2 * lo - cw + 1));
          const r0 = lo + Math.floor(rand() * (rows - 2 * lo - rh + 1));
          if (place(c0, r0, cw, rh, pl.gap)) placed++;
        }
      }
      let pil = 0;
      for (let t = 0; t < 400 && pil < pl.pillars; t++) {
        const sw = pl.pillar + (rand() < 0.35 ? 2 : 0);
        const sh = pl.pillar + (rand() < 0.35 ? 2 : 0);
        const c0 = lo + Math.floor(rand() * (cols - 2 * lo - sw + 1));
        const r0 = lo + Math.floor(rand() * (rows - 2 * lo - sh + 1));
        if (place(c0, r0, sw, sh, pl.gap)) pil++;
      }
    }
    buildFlow();
    return walls.length;
  }

  // ---------------------------------------------------------------- Búsqueda de camino (campo de flujo)
  function buildFlow() {
    fw = Math.max(1, Math.ceil(W / FINE));
    fh = Math.max(1, Math.ceil(H / FINE));
    fblock = new Uint8Array(fw * fh);
    fdist = new Int16Array(fw * fh).fill(-1);
    queue = new Int32Array(fw * fh);
    tcell = -1;
    const pad = M.flowPad;
    for (let n = 0; n < walls.length; n++) {
      const q = walls[n];
      const i0 = Math.max(0, Math.floor((q.x - pad) / FINE));
      const i1 = Math.min(fw - 1, Math.floor((q.x + q.w + pad) / FINE));
      const j0 = Math.max(0, Math.floor((q.y - pad) / FINE));
      const j1 = Math.min(fh - 1, Math.floor((q.y + q.h + pad) / FINE));
      for (let j = j0; j <= j1; j++) {
        for (let i = i0; i <= i1; i++) {
          const cx = (i + 0.5) * FINE;
          const cy = (j + 0.5) * FINE;
          if (cx > q.x - pad && cx < q.x + q.w + pad && cy > q.y - pad && cy < q.y + q.h + pad) fblock[j * fw + i] = 1;
        }
      }
    }
  }

  /** Fija el objetivo (el jugador). Solo recalcula cuando cambia de celda. */
  function setTarget(x, y) {
    if (!walls.length) return;
    let i = clamp(Math.floor(x / FINE), 0, fw - 1);
    let j = clamp(Math.floor(y / FINE), 0, fh - 1);
    let cell = j * fw + i;
    if (cell === tcell) return;
    tcell = cell;
    if (fblock[cell]) { // el jugador está pegado a una pared: se parte de la celda libre más cercana
      let found = -1;
      for (let rad = 1; rad <= 3 && found < 0; rad++) {
        for (let dj = -rad; dj <= rad && found < 0; dj++) {
          for (let di = -rad; di <= rad; di++) {
            const ni = i + di;
            const nj = j + dj;
            if (ni < 0 || nj < 0 || ni >= fw || nj >= fh) continue;
            if (!fblock[nj * fw + ni]) { found = nj * fw + ni; break; }
          }
        }
      }
      if (found < 0) return;
      cell = found;
      i = cell % fw;
      j = (cell / fw) | 0;
    }
    fdist.fill(-1);
    let head = 0;
    let tail = 0;
    queue[tail++] = cell;
    fdist[cell] = 0;
    while (head < tail) {
      const cur = queue[head++];
      const ci = cur % fw;
      const cj = (cur / fw) | 0;
      const d = fdist[cur] + 1;
      for (let dj = -1; dj <= 1; dj++) {
        for (let di = -1; di <= 1; di++) {
          if (!di && !dj) continue;
          const ni = ci + di;
          const nj = cj + dj;
          if (ni < 0 || nj < 0 || ni >= fw || nj >= fh) continue;
          const n = nj * fw + ni;
          if (fblock[n] || fdist[n] >= 0) continue;
          if (di && dj && (fblock[cj * fw + ni] || fblock[nj * fw + ci])) continue; // sin cortar esquinas
          fdist[n] = d;
          queue[tail++] = n;
        }
      }
    }
  }

  /** Dirección unitaria que lleva hacia el objetivo rodeando las paredes (objeto compartido) o null si no hace falta. */
  function flowDir(x, y) {
    if (!walls.length || tcell < 0) return null;
    const i = clamp(Math.floor(x / FINE), 0, fw - 1);
    const j = clamp(Math.floor(y / FINE), 0, fh - 1);
    let best = -1;
    let bd = 32767;
    const here = fdist[j * fw + i];
    if (here === 0) return null; // ya está en la celda del objetivo
    for (let dj = -1; dj <= 1; dj++) {
      for (let di = -1; di <= 1; di++) {
        if (!di && !dj) continue;
        const ni = i + di;
        const nj = j + dj;
        if (ni < 0 || nj < 0 || ni >= fw || nj >= fh) continue;
        const n = nj * fw + ni;
        const d = fdist[n];
        if (d < 0 || fblock[n]) continue;
        if (di && dj && (fblock[j * fw + ni] || fblock[nj * fw + i])) continue;
        if (d < bd) { bd = d; best = n; }
      }
    }
    if (best < 0) return null;
    const cx = ((best % fw) + 0.5) * FINE;
    const cy = (((best / fw) | 0) + 0.5) * FINE;
    const dx = cx - x;
    const dy = cy - y;
    const l = Math.hypot(dx, dy) || 1;
    dir.x = dx / l;
    dir.y = dy / l;
    return dir;
  }

  // ---------------------------------------------------------------- Colisiones y geometría
  function hit(x, y, r) {
    for (let n = 0; n < walls.length; n++) {
      const q = walls[n];
      const cx = clamp(x, q.x, q.x + q.w);
      const cy = clamp(y, q.y, q.y + q.h);
      const dx = x - cx;
      const dy = y - cy;
      if (dx * dx + dy * dy < r * r) return true;
    }
    return false;
  }

  const isFree = (x, y, r) => x > r && y > r && x < W - r && y < H - r && !hit(x, y, r);

  /** Saca el círculo o de las paredes. Devuelve true si tuvo que moverlo (info.nx/ny = hacia dónde lo empujó). */
  function resolve(o) {
    if (!walls.length) return false;
    let moved = false;
    for (let pass = 0; pass < 2; pass++) {
      for (let n = 0; n < walls.length; n++) {
        const q = walls[n];
        const cx = clamp(o.x, q.x, q.x + q.w);
        const cy = clamp(o.y, q.y, q.y + q.h);
        const dx = o.x - cx;
        const dy = o.y - cy;
        const d2 = dx * dx + dy * dy;
        if (d2 >= o.r * o.r) continue;
        moved = true;
        if (d2 > 1e-9) {
          const d = Math.sqrt(d2);
          const push = o.r - d;
          info.nx = dx / d;
          info.ny = dy / d;
          o.x += info.nx * push;
          o.y += info.ny * push;
        } else { // el centro está dentro del rectángulo: sale por el lado más cercano
          const l = o.x - q.x;
          const rr = q.x + q.w - o.x;
          const t = o.y - q.y;
          const b = q.y + q.h - o.y;
          const m = Math.min(l, rr, t, b);
          if (m === l) { info.nx = -1; info.ny = 0; o.x = q.x - o.r; }
          else if (m === rr) { info.nx = 1; info.ny = 0; o.x = q.x + q.w + o.r; }
          else if (m === t) { info.nx = 0; info.ny = -1; o.y = q.y - o.r; }
          else { info.nx = 0; info.ny = 1; o.y = q.y + q.h + o.r; }

    return moved;
  }

  // Intersección segmento-rectángulo (método de las "losas"). Devuelve t de entrada en [0,1] o -1.
  function segRect(x1, y1, x2, y2, rx, ry, rw, rh) {
    let t0 = 0;
    let t1 = 1;
    const dx = x2 - x1;
    const dy = y2 - y1;
    if (Math.abs(dx) < 1e-9) { if (x1 < rx || x1 > rx + rw) return -1; }
    else {
      let a = (rx - x1) / dx;
      let b = (rx + rw - x1) / dx;
      if (a > b) { const t = a; a = b; b = t; }
      t0 = Math.max(t0, a);
      t1 = Math.min(t1, b);
      if (t0 > t1) return -1;
    }
    if (Math.abs(dy) < 1e-9) { if (y1 < ry || y1 > ry + rh) return -1; }
    else {
      let a = (ry - y1) / dy;
      let b = (ry + rh - y1) / dy;
      if (a > b) { const t = a; a = b; b = t; }
      t0 = Math.max(t0, a);
      t1 = Math.min(t1, b);
      if (t0 > t1) return -1;
    }
    return t0;
  }

  /** ¿Hay línea de visión libre entre dos puntos para un cuerpo de radio r? */
  function los(x1, y1, x2, y2, r) {
    for (let n = 0; n < walls.length; n++) {
      const q = walls[n];
      if (segRect(x1, y1, x2, y2, q.x - r, q.y - r, q.w + 2 * r, q.h + 2 * r) >= 0) return false;
    }
    return true;
  }

  /** Distancia desde (x, y) en la dirección ang hasta la primera pared (o max si no hay ninguna). */
  function raycast(x, y, ang, max) {
    if (!walls.length) return max;
    const x2 = x + Math.cos(ang) * max;
    const y2 = y + Math.sin(ang) * max;
    let best = 1;
    for (let n = 0; n < walls.length; n++) {
      const q = walls[n];
      const t = segRect(x, y, x2, y2, q.x, q.y, q.w, q.h);
      if (t >= 0 && t < best) best = t;
    }
    return best * max;
  }

  // ---------------------------------------------------------------- Dibujo con volumen
  const shadeHex = (hex, f) => {
    const h = hex.slice(1);
    const v = [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]
      .map((c) => Math.round(f >= 0 ? c + (255 - c) * f : c * (1 + f)));
    return 'rgb(' + v.join(',') + ')';
  };

  /** Dibuja las paredes una sola vez en un canvas aparte (k = píxeles por unidad de mundo). */
  function prepare(k, theme) {
    if (!walls.length) { cache = null; return; }
    cache = document.createElement('canvas');
    cache.width = Math.max(1, Math.round(W * k));
    cache.height = Math.max(1, Math.round(H * k));
    const g = cache.getContext('2d');
    g.setTransform(k, 0, 0, k, 0, 0);
    Art.walls(g, walls, theme); // materiales, luz y sombras (art.js)
  }

  function draw(ctx) {
    if (cache) ctx.drawImage(cache, 0, 0, W, H);
  }

  return {
    generate, clear, prepare, draw,
    hit, isFree, resolve, los, raycast, setTarget, flowDir,
    active: () => walls.length > 0,
    get walls() { return walls; },
    get info() { return info; },
    get grid() { return { cols, rows, cell: CELL, ox, oy }; },
  };
})();

/* ===== particles.js ===== */
'use strict';

/**
 * Sistema de partículas con POOL: todos los objetos se crean una vez al cargar y se reutilizan.
 * Emitir o morir una partícula no genera basura para el recolector, así que no hay tirones.
 *
 * Tipos: 'dot' (punto), 'spark' (chispa alargada), 'ring' (onda expansiva), 'text' (texto flotante)
 *        y 'confetti' (trocito de color que gira y cae).
 * Todas las coordenadas están en unidades de mundo.
 */
const Particles = (() => {
  let limit = 400;
  const pool = [];
  let n = 0; // las partículas activas son pool[0 .. n-1]

  const rand = (a, b) => a + Math.random() * (b - a);
  // Un valor puede ser un número fijo o un rango [min, max]
  // (el valor por defecto d también puede ser un rango: se sortea igual que si lo hubieran pasado)
  const num = (v, d) => { const x = v === undefined ? d : v; return Array.isArray(x) ? rand(x[0], x[1]) : x; };
  // Un color puede ser un string fijo o una lista entre la que se elige uno al azar
  const pick = (v, d) => { const x = v === undefined ? d : v; return Array.isArray(x) ? x[(Math.random() * x.length) | 0] : x; };

  /** Color del arcoíris (h = 0-360). */
  const hue = (h) => 'hsl(' + (((h % 360) + 360) % 360 | 0) + ', 100%, 62%)';

  function blank() {
    return { kind: 'dot', x: 0, y: 0, vx: 0, vy: 0, life: 0, maxLife: 1, size: 1, color: '#ffffff', drag: 2, r: 0, grow: 0, str: '', rot: 0, vr: 0, g: 0 };
  }

  function fill() {
    while (pool.length < limit) pool.push(blank());
  }

  function setLimit(v) {
    limit = v;
    fill();
    if (n > limit) n = limit;
  }
  fill();

  // Devuelve una partícula libre (o null si está lleno y es de las prescindibles)
  function take(kind) {
    if (n >= limit) {
      if (kind === 'dot' || kind === 'spark' || kind === 'confetti') return null;
      return pool[0]; // anillos y textos desplazan a una partícula antigua
    }
    return pool[n++];
  }

  // Deja a cero los campos que no usa cada tipo (el objeto se reutiliza)
  function reset(p) { p.r = 0; p.grow = 0; p.str = ''; p.rot = 0; p.vr = 0; p.g = 0; }

  /** Una partícula suelta. */
  function emit(o) {
    const kind = o.kind || 'dot';
    const p = take(kind);
    if (!p) return;
    const life = num(o.life, 0.6);
    p.kind = kind;
    p.x = o.x; p.y = o.y;
    p.vx = o.vx || 0; p.vy = o.vy || 0;
    p.life = life; p.maxLife = life;
    p.size = num(o.size, 2);
    p.color = pick(o.color, '#ffffff');
    p.drag = o.drag === undefined ? 2 : o.drag;
    reset(p);
  }

  /** Explosión de partículas desde un punto. */
  function burst(x, y, o) {
    o = o || {};
    const count = o.count === undefined ? 12 : o.count;
    const base = o.angle || 0;
    const spread = o.spread === undefined ? Math.PI : o.spread;
    const kind = o.kind || 'spark';
    for (let i = 0; i < count; i++) {
      const p = take(kind);
      if (!p) return; // lleno: no tiene sentido seguir
      const a = base + rand(-spread, spread);
      const s = num(o.speed, [60, 220]);
      const life = num(o.life, [0.4, 0.8]);
      p.kind = kind;
      p.x = x; p.y = y;
      p.vx = Math.cos(a) * s; p.vy = Math.sin(a) * s;
      p.life = life; p.maxLife = life;
      p.size = num(o.size, [1.5, 3.5]);
      p.color = pick(o.color, '#ffffff');
      p.drag = o.drag === undefined ? 3 : o.drag;
      reset(p);
    }
  }

  /**
   * Confeti: trocitos de color que giran y caen. colors = lista de colores (por defecto, todo el arcoíris).
   * Opciones: count, speed [min,max], life [min,max], size [min,max], gravity.
   */
  function confetti(x, y, o) {
    o = o || {};
    const count = o.count === undefined ? 10 : o.count;
    for (let i = 0; i < count; i++) {
      const p = take('confetti');
      if (!p) return;
      const a = rand(0, Math.PI * 2);
      const s = num(o.speed, [80, 260]);
      const life = num(o.life, [0.7, 1.4]);
      p.kind = 'confetti';
      p.x = x; p.y = y;
      p.vx = Math.cos(a) * s; p.vy = Math.sin(a) * s - 40;
      p.life = life; p.maxLife = life;
      p.size = num(o.size, [2.5, 4.5]);
      p.color = o.colors ? pick(o.colors) : hue(rand(0, 360));
      p.drag = o.drag === undefined ? 2.2 : o.drag;
      reset(p);
      p.rot = rand(0, Math.PI * 2);
      p.vr = rand(-12, 12);
      p.g = o.gravity === undefined ? 160 : o.gravity;
    }
  }

  /** Onda circular que se expande. */
  function ring(x, y, o) {
    o = o || {};
    const p = take('ring');
    if (!p) return;
    const life = num(o.life, 0.5);
    p.kind = 'ring';
    p.x = x; p.y = y; p.vx = 0; p.vy = 0;
    p.r = o.radius || 8;
    p.grow = o.grow || 150;
    p.life = life; p.maxLife = life;
    p.size = o.width || 2;
    p.color = pick(o.color, '#ffffff');
    p.drag = 0; p.str = ''; p.rot = 0; p.vr = 0; p.g = 0;
  }

  /** Texto flotante (por ejemplo el daño recibido). */
  function text(x, y, str, o) {
    o = o || {};
    const p = take('text');
    if (!p) return;
    const life = num(o.life, 0.8);
    p.kind = 'text';
    p.x = x; p.y = y; p.vx = 0;
    p.vy = o.vy === undefined ? -40 : o.vy;
    p.life = life; p.maxLife = life;
    p.size = o.size || 16;
    p.color = pick(o.color, '#ffffff');
    p.str = str;
    p.drag = o.drag === undefined ? 1.5 : o.drag;
    p.r = 0; p.grow = 0; p.rot = 0; p.vr = 0; p.g = 0;
  }

  function update(dt) {
    for (let i = n - 1; i >= 0; i--) {
      const p = pool[i];
      p.life -= dt;
      if (p.life <= 0) {
        // la partícula muerta pasa al final de la zona activa y queda libre para reutilizarse
        n--;
        pool[i] = pool[n];
        pool[n] = p;
        continue;
      }
      if (p.kind === 'ring') {
        p.r += p.grow * dt;
        continue;
      }
      const k = Math.exp(-p.drag * dt);
      p.vx *= k;
      p.vy *= k;
      if (p.g) { p.vy += p.g * dt; p.rot += p.vr * dt; }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }
  }

  function draw(ctx) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter'; // las partículas se suman: brillan como neón
    ctx.lineCap = 'round';

    for (let i = 0; i < n; i++) {
      const p = pool[i];
      const t = p.life / p.maxLife;
      if (p.kind === 'dot') {
        ctx.globalAlpha = t;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(0.1, p.size * (0.4 + 0.6 * t)), 0, Math.PI * 2);
        ctx.fill();
      } else if (p.kind === 'spark') {
        ctx.globalAlpha = t;
        ctx.strokeStyle = p.color;
        ctx.lineWidth = Math.max(0.5, p.size * (0.5 + 0.5 * t));
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - p.vx * 0.04, p.y - p.vy * 0.04);
        ctx.stroke();
      } else if (p.kind === 'ring') {
        ctx.globalAlpha = t * 0.9;
        ctx.strokeStyle = p.color;
        ctx.lineWidth = Math.max(0.5, p.size * t);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    // El confeti es sólido (no se suma): un rombo que gira y se desvanece al final
    ctx.globalCompositeOperation = 'source-over';
    for (let i = 0; i < n; i++) {
      const p = pool[i];
      if (p.kind !== 'confetti') continue;
      const t = p.life / p.maxLife;
      const sz = p.size * (0.5 + 0.5 * Math.min(1, t * 2));
      const sx = Math.abs(Math.cos(p.rot * 1.7)) * 0.8 + 0.2; // simula que se voltea en el aire
      const c = Math.cos(p.rot) * sz;
      const s = Math.sin(p.rot) * sz;
      ctx.globalAlpha = Math.min(1, t * 2.5);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.moveTo(p.x + c, p.y + s * sx);
      ctx.lineTo(p.x - s, p.y + c * sx);
      ctx.lineTo(p.x - c, p.y - s * sx);
      ctx.lineTo(p.x + s, p.y - c * sx);
      ctx.closePath();
      ctx.fill();
    }

    // Los textos van aparte y con mezcla normal para que se lean bien
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let i = 0; i < n; i++) {
      const p = pool[i];
      if (p.kind !== 'text') continue;
      ctx.globalAlpha = Math.min(1, (p.life / p.maxLife) * 1.6);
      ctx.fillStyle = p.color;
      ctx.font = '700 ' + p.size + 'px Impact, "Arial Narrow Bold", sans-serif';
      ctx.fillText(p.str, p.x, p.y);
    }

    ctx.restore();
  }

  function clear() { n = 0; }
  function count() { return n; }

  return { setLimit, emit, burst, confetti, ring, text, hue, update, draw, clear, count };
})();
