  function applySurprise(type, orb) {
    const P = player;
    const S = C.surprise.types[type];
    const m = Surprise.meta(type);
    const secs = S.duration === undefined ? '' : (Number.isInteger(S.duration) ? String(S.duration) : I18n.num(S.duration, 1)); // 3,5 en español / 3.5 en inglés
    Particles.ring(P.x, P.y, { color: m.color, radius: P.r, grow: 420, life: 0.55, width: 4 });
    Particles.confetti(P.x, P.y, { count: 18, colors: [m.color, '#ffffff', Particles.hue(rand(0, 360))], speed: [90, 300] });

    if (type === 'freeze') {
      run.freezeT = S.duration;
      Particles.burst(P.x, P.y, { count: 36, color: [m.color, '#ffffff'], speed: [80, 360], life: [0.5, 1.1], size: [1.5, 3.5], drag: 2 });
      Sfx.play('freeze');
    } else if (type === 'nova') {
      const list = Enemies.list;
      for (let i = list.length - 1; i >= 0; i--) { // de atrás hacia delante: un enemigo puede morir y salir de la lista
        const e = list[i];
        if (e.spawnT > 0) continue;
        const dx = e.x - P.x;
        const dy = e.y - P.y;
        const d = Math.hypot(dx, dy) || 1;
        if (d < S.radius + e.r) Enemies.damage(e, S.damage, dx / d, dy / d);
      }
      Projectiles.clearHostileNear(P.x, P.y, S.radius);
      for (let k = 0; k < 3; k++) Particles.ring(P.x, P.y, { color: Particles.hue(k * 70 + anim * 90), radius: 10, grow: S.radius / (0.28 + k * 0.08), life: 0.3 + k * 0.08, width: 5 - k });
      Particles.burst(P.x, P.y, { count: 60, color: [m.color, '#ffe04a', '#ffffff'], speed: [120, 520], life: [0.4, 1.0], size: [2, 4.5], drag: 2 });
      run.shake = Math.max(run.shake, 12);
      Sfx.play('nova');
    } else if (type === 'star') {
      run.starT = S.duration;
      Sfx.play('star');
    } else if (type === 'xp2') {
      run.xp2T = S.duration;
      Sfx.play('star');
    }
    showToast({ icon: m.icon, name: t('sur.' + type), effect: t('sur.' + type + '.effect', { s: secs }), color: m.color });
  }

  // Barra de efectos con tiempo (arriba a la derecha): icono + segundos que quedan
  function buildFxChips() {
    dom.fxbar.textContent = '';
    fxChips.length = 0;
    [['freezeT', 'freeze'], ['starT', 'star'], ['xp2T', 'xp2']].forEach((k) => {
      const el = document.createElement('div');
      el.className = 'fxchip';
      el.hidden = true;
      el.style.setProperty('--c', Surprise.meta(k[1]).color);
      dom.fxbar.appendChild(el);
      fxChips.push({ el, key: k[0], icon: Surprise.meta(k[1]).icon, shown: -1 });
    });
  }

  function updateFxBar() {
    for (let i = 0; i < fxChips.length; i++) {
      const c = fxChips[i];
      const v = Math.ceil(run[c.key] - 1e-6);
      if (v === c.shown) continue;
      c.shown = v;
      c.el.hidden = v <= 0;
      if (v > 0) c.el.textContent = c.icon + ' ' + v;
    }
  }

  // Al terminar la partida se apagan todos los efectos y avisos de colores
  function endEffects() {
    run.freezeT = 0;
    run.starT = 0;
    run.xp2T = 0;
    run.combo = 0;
    run.comboT = 0;
    Surprise.orb.active = false;
    comboCache.n = 0;
    dom.combo.hidden = true;
    dom.bossBar.hidden = true;
    bossCache.shown = false;
    dom.stage.classList.remove('has-boss');
    for (let i = 0; i < fxChips.length; i++) { fxChips[i].shown = 0; fxChips[i].el.hidden = true; }
  }

  // ---------------------- Fuegos artificiales al ganar ----------------------

  function updateFireworks(dt) {
    if (run.result !== 'won' || run.fw <= 0) return;
    run.fwT -= dt;
    if (run.fwT > 0) return;
    run.fw--;
    run.fwT = 0.13;
    const x = rand(60, world.w - 60);
    const y = rand(60, world.h * 0.6);
    const h = rand(0, 360);
    Particles.burst(x, y, { count: 30, color: [Particles.hue(h), Particles.hue(h + 40), '#ffffff'], speed: [90, 340], life: [0.6, 1.3], size: [1.8, 3.6], drag: 1.7 });
    Particles.ring(x, y, { color: Particles.hue(h), radius: 6, grow: 200, life: 0.5, width: 3 });
    Particles.confetti(x, y, { count: 8, colors: [Particles.hue(h), Particles.hue(h + 60), '#ffffff'], speed: [60, 220] });
    Sfx.play('firework');
  }

  // Coordenadas de pantalla -> coordenadas del mundo
  function toWorld(cx, cy) {
    const r = dom.canvas.getBoundingClientRect();
    return { x: ((cx - (r.left || 0)) / (r.width || 1)) * world.w, y: ((cy - (r.top || 0)) / (r.height || 1)) * world.h };
  }

  // ---------------------- El jefe ----------------------

  // Aparece el jefe del nivel (con aviso de 2 s en el que es inmune) y se prepara su arena
  function startBoss() {
    const BC = C.boss;
    const tier = levelCfg.boss.tier;
    if (!player.hasWeapon) { // sin arma no se puede vencer a un jefe: te dan una
      player.hasWeapon = true;
      Levels.setWeapon();
      showToast({ icon: '🔫', name: t('boss.armed.name'), effect: t('boss.armed.effect'), color: C.colors.accent });
    }
    // Los poderes se reinician en cada nivel: para la pelea te regalan unos cuantos al azar (más cuanto más fuerte es el jefe)
    const free = BC.freePowersBase + Math.floor(tier / BC.freePowersEvery);
    for (let i = 0; i < free; i++) grantRandomPower();
    const md = C.modes[Levels.mode()];
    const hpMult = (BC.hpBase * (1 + BC.hpPerTier * (tier - 1)) * md.enemyHp) / BC.def.hp;
    const r = BC.radius + BC.radiusPerTier * (tier - 1);
    const x = world.w / 2;
    let y = clamp(world.h * 0.24, r + 64, world.h - r - 20); // por debajo de su barra de vida
    for (let k = 0; k < 8 && Maze.active() && !Maze.isFree(x, y, r); k++) y += 40;
    const e = Enemies.spawn('boss', x, y, player, hpMult, 1);
    if (!e) return;
    e.r = r;
    e.spawnT = BC.introTime;
    e.spawnDur = BC.introTime;
    Boss.start(e, tier);
    showBanner(t('boss.warning', { name: t('boss.' + tier) }), true);
    run.shake = Math.max(run.shake, 8);
    Sfx.play('aim');
  }

  // El jefe cae: explosiones de colores y victoria inmediata (sus soldados estallan con él)
  function bossDefeated(e) {
    run.kills++;
    run.bossDown = true;
    const col = Boss.looks[levelCfg.boss.tier - 1].color;
    for (let k = 0; k < 4; k++) Particles.ring(e.x, e.y, { color: k % 2 ? '#ffffff' : col, radius: e.r * 0.5, grow: 260 + k * 120, life: 0.6 + k * 0.15, width: 5 });
    Particles.burst(e.x, e.y, { count: 90, color: [col, '#ffffff', C.colors.accent], speed: [120, 560], life: [0.6, 1.4], size: [2, 5], drag: 1.6 });
    Particles.confetti(e.x, e.y, { count: 50, speed: [120, 420], life: [1, 1.8] });
    run.shake = FX.deathShake;
    Sfx.play('explosion');
    Boss.clear();
    run.winPending = true; // la victoria se aplica al FINAL del fotograma: aquí estamos en medio de un bucle (disparos, contactos...) y terminar la partida vacía sus listas
  }

  const bossCache = { w: -1, shown: false, enraged: false };
  // Barra de vida grande del jefe, arriba en el centro
  function updateBossHud() {
    const e = levelCfg.boss && Boss.active() ? Boss.state.e : null;
    const alive = !!e && Enemies.list.indexOf(e) >= 0;
    if (!alive) {
      if (bossCache.shown) { bossCache.shown = false; dom.bossBar.hidden = true; dom.stage.classList.remove('has-boss'); }
      return;
    }
    if (!bossCache.shown) {
      bossCache.shown = true;
      bossCache.w = -1;
      dom.bossBar.hidden = false;
      dom.stage.classList.add('has-boss');
      dom.bossName.textContent = t('boss.' + levelCfg.boss.tier);
    }
    const q = Math.round(clamp(e.hp / e.maxHp, 0, 1) * 200);
    if (q !== bossCache.w) { bossCache.w = q; dom.bossFill.style.transform = 'scaleX(' + (q / 200) + ')'; }
    const en = Boss.state.phase >= 2;
    if (en !== bossCache.enraged) { bossCache.enraged = en; dom.bossBar.classList.toggle('is-enraged', en); }
  }

  // ---------------------- El corazón (solo 6 segundos para cogerlo) ----------------------

  function spawnHeart() {
    const P = player;
    const H = C.heart;
    let x = 0;
    let y = 0;
    let found = false;
    for (let i = 0; i < 60 && !found; i++) {
      const a = rand(0, TAU);
      const d = rand(H.minDistance, H.maxDistance);
      x = P.x + Math.cos(a) * d;
      y = P.y + Math.sin(a) * d;
      found = x > H.wallMargin && x < world.w - H.wallMargin && y > H.wallMargin && y < world.h - H.wallMargin && Maze.isFree(x, y, H.radius + 8);
    }
    if (!found) { // arena pequeña o jugador pegado a una pared: se coloca lo más lejos posible dentro de la arena
      x = clamp(P.x < world.w / 2 ? P.x + H.minDistance : P.x - H.minDistance, H.wallMargin, world.w - H.wallMargin);
      y = clamp(P.y, H.wallMargin, world.h - H.wallMargin);
    }
    heart.x = x;
    heart.y = y;
    heart.t = H.lifetime;
    heart.active = true;
    heart.spawned = true;
    Particles.ring(x, y, { color: '#ff4d6d', radius: 6, grow: 260, life: 0.6, width: 3 });
    Particles.burst(x, y, { count: 14, color: ['#ff4d6d', '#ffd0da', '#ffffff'], speed: [40, 200], life: [0.3, 0.7], size: [1.5, 3.2] });
    Sfx.play('pickup');
  }

  function collectHeart() {
    const P = player;
    heart.active = false;
    healPlayer(C.heart.heal);
    Particles.ring(P.x, P.y, { color: '#ff4d6d', radius: P.r, grow: 340, life: 0.5, width: 4 });
    Particles.burst(heart.x, heart.y, { count: 22, color: ['#ff4d6d', '#ffd0da', '#ffffff'], speed: [60, 280], life: [0.4, 0.9], size: [2, 4], drag: 2 });
    Sfx.play('heart');
  }

  function updateHeart(dt) {
    if (!C.heart.enabled) return;
    if (!heart.spawned && run.elapsed >= heart.at) spawnHeart();
    if (!heart.active) return;
    heart.t -= dt;
    const P = player;
    const reach = P.r + C.heart.radius * 0.9;
    const dx = P.x - heart.x;
    const dy = P.y - heart.y;
    if (dx * dx + dy * dy < reach * reach) { collectHeart(); return; }
    if (heart.t <= 0) { // se acabó el tiempo: desaparece
      heart.active = false;
      Particles.ring(heart.x, heart.y, { color: '#ff4d6d', radius: C.heart.radius, grow: 120, life: 0.35, width: 2 });
      Particles.burst(heart.x, heart.y, { count: 10, color: ['#ff4d6d', '#8a2a45'], speed: [30, 120], life: [0.3, 0.6], size: [1.5, 2.8] });
    }
  }

  function heartPath(r) {
    ctx.beginPath();
    ctx.moveTo(0, r * 0.95);
    ctx.bezierCurveTo(-r * 1.6, -r * 0.1, -r * 0.95, -r * 1.15, 0, -r * 0.4);
    ctx.bezierCurveTo(r * 0.95, -r * 1.15, r * 1.6, -r * 0.1, 0, r * 0.95);
    ctx.closePath();
  }

  function drawHeart() {
    if (!heart.active) return;
    const H = C.heart;
    const r = H.radius;
    const frac = clamp(heart.t / H.lifetime, 0, 1);
    const warn = heart.t < H.warnSeconds;
    const dim = warn && Math.sin(anim * 22) > 0; // parpadea en los últimos segundos
    ctx.save();
    ctx.translate(heart.x, heart.y + Math.sin(anim * 5) * 2.5);

    ctx.globalAlpha = dim ? 0.08 : 0.2;
    ctx.fillStyle = '#ff4d6d';
    ctx.beginPath();
    ctx.arc(0, 0, r * 2.6, 0, TAU);
    ctx.fill();

    // Anillo de cuenta atrás: se va vaciando; se vuelve amarillo cuando queda poco
    ctx.globalAlpha = dim ? 0.35 : 0.95;
    ctx.strokeStyle = warn ? C.colors.accent : '#ffffff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, r * 2.1, -Math.PI / 2, -Math.PI / 2 + TAU * frac);
    ctx.stroke();

    ctx.globalAlpha = dim ? 0.45 : 1;
    const pulse = 1 + 0.08 * Math.sin(anim * 8);
    ctx.scale(pulse, pulse);
    Art.glow(ctx, 0, 0, r * 2.4, '#ff3b5c', 0.85);
    Art.drawHeart(ctx, r); // corazón con volumen, brillo y borde (art.js)
    ctx.restore();
  }

  function updateCrate(dt) {
    const P = player;
    if (P.hasWeapon) { crate.active = false; return; }
    if (!crate.spawned && currentLevel >= Levels.weaponLevel && run.elapsed >= C.weapon.spawnAt) spawnCrate();
    if (!crate.active) return;
    crate.t += dt;
    const reach = P.r + crate.r;
    const dx = P.x - crate.x;
    const dy = P.y - crate.y;
    if (dx * dx + dy * dy < reach * reach) grantWeapon();
  }

  function drawCrate() {
    if (!crate.active) return;
    const r = crate.r;
    const bob = Math.sin(anim * 4) * 3;
    ctx.save();
    ctx.translate(crate.x, crate.y + bob);

    ctx.globalAlpha = 0.16 + 0.1 * Math.sin(anim * 5);
    ctx.fillStyle = C.colors.accent;
    ctx.beginPath();
    ctx.arc(0, 0, r * 2.8, 0, TAU);
    ctx.fill();

    ctx.save();
    ctx.rotate(anim * 1.4);
    ctx.globalAlpha = 0.75;
    ctx.setLineDash([6, 8]);
    ctx.strokeStyle = C.colors.accent;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, r * 1.9, 0, TAU);
    ctx.stroke();
    ctx.restore();

    ctx.globalAlpha = 1;
    Art.glow(ctx, 0, 0, r * 2.2, C.colors.accent, 0.9);
    Art.drawCrate(ctx, r, C.colors.accent); // caja metálica con una pistola láser (art.js)

    ctx.fillStyle = '#ffffff';
    ctx.font = '700 15px Impact, "Arial Narrow Bold", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(t('crate.label'), 0, -r * 2.3);
    ctx.restore();
  }

  // ------------------------------------------------------------------
  // HUD
  // ------------------------------------------------------------------
  const hudCache = { hp: -1, maxHp: -1, time: -1, phase: -1, xp: -1, level: -1, weapon: -1, dashLv: -1, dashCd: -1, segs: [] };

  function buildSegments() {
    dom.timeSegs.textContent = '';
    segEls.length = 0;
    for (let i = 0; i < SpawnManager.stageCount(); i++) {
      const seg = document.createElement('span');
      seg.className = 'seg';
      const fill = document.createElement('i');
      seg.appendChild(fill);
      dom.timeSegs.appendChild(seg);
      segEls.push(fill);
      hudCache.segs[i] = -1;
    }
  }

  function resetHud() {
    hudCache.hp = -1;
    hudCache.maxHp = -1;
    hudCache.time = -1;
    hudCache.phase = -1;
    hudCache.xp = -1;
    hudCache.level = -1;
    hudCache.weapon = -1;
    hudCache.dashLv = -1;
    hudCache.dashCd = -1;
    for (let i = 0; i < hudCache.segs.length; i++) hudCache.segs[i] = -1;
    dom.timeValue.classList.remove('is-danger');
    dom.hpBox.classList.remove('is-low');
    dom.xpBox.classList.remove('is-pop');
    dom.dashBtn.hidden = true;

    // Las barras vuelven a su estado inicial sin animación
    dom.hpFill.style.transition = 'none';
    dom.hpGhost.style.transition = 'none';
    dom.xpFill.style.transition = 'none';
    const startPct = player ? Math.round(clamp((player.hp / player.stats.get('maxHp')) * 100, 0, 100) * 100) / 100 : 100; // empieza con la vida arrastrada
    dom.hpFill.style.width = startPct + '%';
    dom.hpGhost.style.width = startPct + '%';
    dom.xpFill.style.transform = 'scaleX(0)';
    void dom.hpFill.offsetWidth; // fuerza el reflow para aplicar el cambio sin transición
    dom.hpFill.style.transition = '';
    dom.hpGhost.style.transition = '';
    dom.xpFill.style.transition = '';
  }

  function pulseXpBar() {
    dom.xpBox.classList.remove('is-pop');
    void dom.xpBox.offsetWidth;
    dom.xpBox.classList.add('is-pop');
  }

  function updateHud(force) {
    if (!run || !player) return;

    const hp = Math.round(player.hp);
    const maxHp = Math.round(player.stats.get('maxHp'));
    if (force || hp !== hudCache.hp || maxHp !== hudCache.maxHp) {
      hudCache.hp = hp;
      hudCache.maxHp = maxHp;
      const pct = Math.round((hp / maxHp) * 10000) / 100;
      dom.hpFill.style.width = pct + '%';
      dom.hpGhost.style.width = pct + '%';
      dom.hpValue.textContent = String(hp);
      dom.hpBox.classList.toggle('is-low', hp <= FX.lowHpThreshold);
    }

    const shown = Math.max(0, Math.ceil(run.duration - run.elapsed - 1e-6));
    if (force || shown !== hudCache.time) {
      hudCache.time = shown;
      dom.timeValue.textContent = String(shown);
      dom.timeValue.classList.toggle('is-danger', shown <= 10 && shown > 0);
    }

    if (force || run.phase !== hudCache.phase) {
      hudCache.phase = run.phase;
      dom.phaseName.textContent = levelCfg.boss ? t('boss.' + levelCfg.boss.tier) : stageLabel(run.phase);
    }

    for (let i = 0; i < segEls.length; i++) {
      const ph = SpawnManager.stage(i);
      const p = clamp((run.elapsed - ph.from) / (ph.to - ph.from), 0, 1);
      const q = Math.round(p * 100);
      if (force || q !== hudCache.segs[i]) {
        hudCache.segs[i] = q;
        segEls[i].style.transform = 'scaleX(' + (q / 100) + ')';
      }
    }

    // La barra de XP solo tiene sentido con arma (sin ella no hay combate)
    const hw = player.hasWeapon ? 1 : 0;
    if (force || hw !== hudCache.weapon) {
      hudCache.weapon = hw;
      dom.xpBox.style.visibility = hw ? 'visible' : 'hidden';
    }

    // Barra de XP y nivel
    const xq = Math.round(clamp(run.xp / run.xpNeed, 0, 1) * 1000);
    if (force || xq !== hudCache.xp) {
      hudCache.xp = xq;
      dom.xpFill.style.transform = 'scaleX(' + (xq / 1000) + ')';
    }
    if (force || run.level !== hudCache.level) {
      hudCache.level = run.level;
      dom.levelLabel.textContent = t('hud.nv', { n: run.level });
    }

    // Botón de dash: aparece al desbloquearlo y muestra su recarga
    const dashLv = UpgradeSystem.levelOf('dash');
    if (force || dashLv !== hudCache.dashLv) {
      hudCache.dashLv = dashLv;
      dom.dashBtn.hidden = dashLv === 0;
      hudCache.dashCd = -1;
    }
    if (dashLv > 0) {
      const cd = player.dash.cd;
      const q = cd > 0 ? Math.max(1, Math.round((cd / AbilityStats.dashCooldown(dashLv)) * 100)) : 0;
      if (q !== hudCache.dashCd) {
        hudCache.dashCd = q;
        dom.dashBtn.style.setProperty('--cd', q + '%');
        dom.dashBtn.classList.toggle('is-ready', q === 0);
      }
    }
  }

  // Mejoras que llevas, abajo a la izquierda de la arena (icono + nivel)
  function refreshBuffs() {
    dom.buffs.textContent = '';
    const list = UpgradeSystem.owned();
    for (let i = 0; i < list.length; i++) {
      const o = list[i];
      const chip = document.createElement('span');
      chip.className = o.level >= o.maxLevel ? 'buff is-max' : 'buff';
      chip.style.setProperty('--c', o.color);
      chip.textContent = o.icon + ' ' + o.level;
      dom.buffs.appendChild(chip);
    }
  }

  function shakeHud() {
    if (!dom.hpBox.animate) return;
    dom.hpBox.animate(
      [
        { transform: 'translateX(0)' },
        { transform: 'translateX(-6px)' },
        { transform: 'translateX(5px)' },
        { transform: 'translateX(-3px)' },
        { transform: 'translateX(0)' },
      ],
      { duration: 260, easing: 'ease-out' }
    );
  }

  function showBanner(text, hot) {
    dom.banner.textContent = text;
    dom.banner.classList.toggle('is-hot', !!hot);
    if (!dom.banner.animate) return;
    if (bannerAnim) bannerAnim.cancel();
    bannerAnim = dom.banner.animate(
      [
        { opacity: 0, transform: 'scale(1.3)' },
        { opacity: 1, transform: 'scale(1)', offset: 0.16 },
        { opacity: 1, transform: 'scale(1)', offset: 0.68 },
        { opacity: 0, transform: 'scale(0.97)' },
      ],
      { duration: 1500, easing: 'ease-out' }
    );
  }

  // ------------------------------------------------------------------
  // Render
  // ------------------------------------------------------------------
  const gfx = {
    anim: 0,
    frozen: false,
    target: null,
    glow(color, blur) {
      if (!glowOn) return;
      ctx.shadowColor = color;
      ctx.shadowBlur = blur * view.k;
    },
    noGlow() { ctx.shadowBlur = 0; },
  };

  // Resplandor general: la imagen se reduce (se desenfoca sola) y se suma encima: todo lo brillante "sangra" luz
  const bloomCv = document.createElement('canvas');
  const bloomCtx = bloomCv.getContext('2d');
  function bloomPass() {
    if (!glowOn || !FX.bloom) return;
    const W = dom.canvas.width;
    const H = dom.canvas.height;
    const bw = Math.max(16, Math.round(W / 5));
    const bh = Math.max(16, Math.round(H / 5));
    if (bloomCv.width !== bw || bloomCv.height !== bh) { bloomCv.width = bw; bloomCv.height = bh; }
    bloomCtx.globalCompositeOperation = 'copy';
    bloomCtx.drawImage(dom.canvas, 0, 0, W, H, 0, 0, bw, bh);
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = FX.bloom;
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(bloomCv, 0, 0, bw, bh, 0, 0, W, H);
    ctx.restore();
  }

  function render() {
    const k = view.k;
    gfx.anim = anim;
    gfx.frozen = !!(run && run.freezeT > 0);
    gfx.target = player && player.alive && (state === 'playing' || state === 'ending') ? player : null; // los monstruos te miran
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, dom.canvas.width, dom.canvas.height);

    let sx = 0;
    let sy = 0;
    if (run && run.shake > 0) {
      const m = run.shake * motionScale;
      sx = rand(-m, m);
      sy = rand(-m, m);
    }

    ctx.setTransform(k, 0, 0, k, sx * k, sy * k);
    ctx.drawImage(gridCanvas, 0, 0, world.w, world.h);
    drawNebula();
    drawStars();
    drawWalls();
    Maze.draw(ctx);                  // paredes del laberinto, con volumen
    drawLight();
    drawMotes();

    Pickups.draw(ctx, anim);         // gemas en el suelo, bajo los enemigos
    drawCrate();                     // el arma, si está en la arena
    drawHeart();                     // el corazón (cuenta atrás de 6 s)
    Surprise.draw(ctx, anim);        // el orbe sorpresa, si lo hay
    Enemies.drawGround(ctx, anim, Maze); // zonas de explosión y láseres (el láser se corta en las paredes)
    Boss.drawGround(ctx, anim);          // franja de embestida, círculos de aviso y ondas del jefe
    Enemies.draw(ctx, gfx);
    Enemies.drawBars(ctx);
    Projectiles.draw(ctx, gfx);
    if (player && player.alive) drawPlayer();
    Particles.draw(ctx);
    bloomPass();

    ctx.setTransform(k, 0, 0, k, 0, 0);
    drawVignette();
  }

  function drawWalls() {
    const danger = state === 'playing' && run && run.duration - run.elapsed <= 10;
    const color = danger ? C.colors.enemy : theme.wall;
    const p = 4;
    const w = world.w;
    const h = world.h;

    ctx.save();
    gfx.glow(color, 16);
    ctx.strokeStyle = color;
    ctx.lineWidth = 2.5;
    ctx.strokeRect(p, p, w - p * 2, h - p * 2);

    // Esquinas reforzadas
    const L = 28;
    ctx.strokeStyle = danger ? '#ff9cc8' : theme.corner;
    ctx.lineWidth = 4;
    ctx.lineCap = 'square';
    ctx.beginPath();
    ctx.moveTo(p, p + L); ctx.lineTo(p, p); ctx.lineTo(p + L, p);
    ctx.moveTo(w - p - L, p); ctx.lineTo(w - p, p); ctx.lineTo(w - p, p + L);
    ctx.moveTo(w - p, h - p - L); ctx.lineTo(w - p, h - p); ctx.lineTo(w - p - L, h - p);
    ctx.moveTo(p + L, h - p); ctx.lineTo(p, h - p); ctx.lineTo(p, h - p - L);
    ctx.stroke();
    ctx.restore();
  }

  function drawShield(P) {
    const sh = P.shield;
    const level = UpgradeSystem.levelOf('shield');
    if (level <= 0) return;

    if (sh.t > 0) {
      // Burbuja activa; parpadea en el último medio segundo para avisar de que se acaba
      let a = 1;
      if (sh.t < 0.6) a = Math.sin(anim * 36) > 0 ? 1 : 0.35;
      const R = P.r * 2.5;
      ctx.save();
      ctx.globalAlpha = 0.16 * a;
      ctx.fillStyle = C.colors.shield;
      ctx.beginPath();
      ctx.arc(0, 0, R, 0, TAU);
      ctx.fill();
      ctx.globalAlpha = 0.9 * a;
      ctx.strokeStyle = C.colors.shield;
      ctx.lineWidth = 2.5;
      gfx.glow(C.colors.shield, 14);
      ctx.beginPath();
      ctx.arc(0, 0, R, 0, TAU);
      ctx.stroke();
      gfx.noGlow();
      ctx.rotate(-anim * 1.2);
      ctx.setLineDash([8, 10]);
      ctx.globalAlpha = 0.5 * a;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(0, 0, R * 0.86, 0, TAU);
      ctx.stroke();
      ctx.restore();
    } else {
      // Recargando: arco que se completa cuando el escudo está listo
      const frac = clamp(1 - sh.cd / AbilityStats.shieldCooldown(level), 0, 1);
      ctx.save();
      ctx.globalAlpha = 0.45;
      ctx.strokeStyle = C.colors.shield;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, P.r * 2.2, -Math.PI / 2, -Math.PI / 2 + TAU * frac);
      ctx.stroke();
      ctx.restore();
    }
  }

  // Degradado esférico del jugador (se crea una vez)
  let playerGradCache = null;
  let playerGradR = 0;
  function playerGradient(r) {
    if (!playerGradCache || playerGradR !== r) {
      const g = ctx.createRadialGradient(-r * 0.36, -r * 0.4, r * 0.1, 0, 0, r * 1.35);
      g.addColorStop(0, '#eaffff');
      g.addColorStop(0.35, C.colors.player);
      g.addColorStop(1, '#04505a');
      playerGradCache = g;
      playerGradR = r;
    }
    return playerGradCache;
  }

  // Resplandores de color reutilizables: degradado de radio 1 que se coloca con translate+scale (sin crear objetos por frame)
  const unitGlowCache = {};
  function glowGradient(color) {
    if (!unitGlowCache[color]) {
      const h = color.slice(1);
      const rgb = parseInt(h.slice(0, 2), 16) + ',' + parseInt(h.slice(2, 4), 16) + ',' + parseInt(h.slice(4, 6), 16);
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
      g.addColorStop(0, 'rgba(' + rgb + ', 0.6)');
      g.addColorStop(0.5, 'rgba(' + rgb + ', 0.2)');
      g.addColorStop(1, 'rgba(' + rgb + ', 0)');
      unitGlowCache[color] = g;
    }
    return unitGlowCache[color];
  }

  function paintGlow(x, y, radius, color, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, y);
    ctx.scale(radius, radius);
    ctx.fillStyle = glowGradient(color);
    ctx.fillRect(-1, -1, 2, 2);
    ctx.restore();
  }

  // Nebulosas de colores que flotan despacio por el fondo: el escenario "respira"
  function drawNebula() {
    const w = world.w;
    const h = world.h;
    const m = Math.max(w, h);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    paintGlow(w * (0.3 + 0.12 * Math.sin(anim * 0.11)), h * (0.3 + 0.1 * Math.cos(anim * 0.09)), m * 0.55, theme.wall, 0.2);
    paintGlow(w * (0.72 + 0.1 * Math.cos(anim * 0.08)), h * (0.65 + 0.1 * Math.sin(anim * 0.13)), m * 0.5, theme.corner, 0.15);
    paintGlow(w * (0.5 + 0.15 * Math.sin(anim * 0.07 + 2)), h * (0.88 + 0.05 * Math.cos(anim * 0.1)), m * 0.45, theme.stars[0], 0.12);
    ctx.restore();
  }

  // Charco de luz alrededor del jugador: ilumina el suelo y los monstruos cercanos
  function drawLight() {
    if (!player || !player.alive || state !== 'playing') return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    paintGlow(player.x, player.y, 250, theme.corner, 0.2);
    paintGlow(player.x, player.y, 90, '#ffffff', 0.1);
    ctx.restore();
  }

  function drawPlayer() {
    const P = player;
    const r = P.r;
    const dashing = P.dash.t > 0;
    const blink = !dashing && run.starT <= 0 && P.invuln > 0 && Math.floor(P.invuln * 16) % 2 === 0;
    const alpha = dashing ? 0.55 : blink ? 0.35 : 1;

    ctx.save();
    ctx.translate(P.x, P.y);

    // Alcance de ataque (muy tenue), solo con arma
    if (state === 'playing' && P.hasWeapon) {
      ctx.globalAlpha = 0.09;
      ctx.setLineDash([3, 9]);
      ctx.strokeStyle = C.colors.player;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(0, 0, P.stats.get('range'), 0, TAU);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    ctx.globalAlpha = alpha;

    // Anillo orbital
    ctx.save();
    ctx.rotate(anim * 1.6);
    ctx.setLineDash([5, 7]);
    ctx.strokeStyle = C.colors.player;
    ctx.globalAlpha = alpha * 0.7;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, 0, r * 1.65, 0, TAU);
    ctx.stroke();
    ctx.restore();

    // Resplandor blanco mientras es invulnerable (tras un golpe o al reanudar)
    if (P.invuln > 0 && !dashing && run.starT <= 0) {
      ctx.globalAlpha = 0.25 + 0.5 * Math.min(1, P.invuln / P.invulnTime);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, r * 2.05, 0, TAU);
      ctx.stroke();
      ctx.globalAlpha = alpha;
    }

    // Aura arcoíris con combo alto o con la estrella
    if (rainbowOn()) {
      ctx.save();
      ctx.rotate(-anim * 2.4);
      ctx.lineWidth = 3;
      ctx.globalAlpha = 0.9;
      for (let k = 0; k < 6; k++) {
        ctx.strokeStyle = Particles.hue(anim * 200 + k * 60);
        ctx.beginPath();
        ctx.arc(0, 0, r * 2.3, (k * TAU) / 6, (k * TAU) / 6 + TAU / 6 - 0.15);
        ctx.stroke();
      }
      ctx.restore();
      ctx.globalAlpha = alpha;
    }

    // Sombra en el suelo (la luz cae desde arriba a la izquierda)
    ctx.globalAlpha = alpha * 0.45;
    ctx.fillStyle = '#000000';
    ctx.beginPath();
    ctx.ellipse(0, r * 0.85, r * 0.95, r * 0.38, 0, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = alpha;

    // Cuerpo esférico que flota: base oscura (grosor) + degradado con luz + brillo
    const bob = Math.sin(anim * 5) * 1.2;
    ctx.translate(0, bob);

    // propulsor: llama que se alarga al moverse
    const mv = Math.min(1, Math.hypot(P.vx, P.vy) / 200);
    Art.glow(ctx, 0, r * 1.25, r * (1.2 + mv * 0.8), '#7fd8ff', 0.5 + 0.4 * mv);
    ctx.fillStyle = '#e8fbff';
    ctx.beginPath();
    ctx.moveTo(-r * 0.28, r * 0.82);
    ctx.lineTo(0, r * (1.2 + mv * 0.7 + Math.random() * 0.25));
    ctx.lineTo(r * 0.28, r * 0.82);
    ctx.closePath();
    ctx.fill();

    // mitad de atrás del anillo metálico
    const ringArc = (a0, a1) => { ctx.save(); ctx.rotate(-0.18); ctx.scale(1, 0.32); ctx.beginPath(); ctx.arc(0, 0, r * 1.38, a0, a1); ctx.restore(); };
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#7a8fb0';
    ctx.lineWidth = r * 0.2;
    ringArc(Math.PI, TAU);
    ctx.stroke();
    ctx.fillStyle = '#0a5f68';
    ctx.beginPath();
    ctx.arc(0, r * 0.22, r, 0, TAU);
    ctx.fill();

    gfx.glow(C.colors.player, 22);
    ctx.fillStyle = playerGradient(r);
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, TAU);
    ctx.fill();
    gfx.noGlow();
    ctx.strokeStyle = 'rgba(220, 255, 255, 0.6)';
    ctx.lineWidth = 1.4;
    ctx.stroke();

    ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
    ctx.beginPath();
    ctx.ellipse(-r * 0.36, -r * 0.42, r * 0.3, r * 0.15, -0.6, 0, TAU);
    ctx.fill();

    // Visor con dos ojos brillantes: mira hacia donde dispara (o hacia donde se mueve)
    ctx.save();
    ctx.rotate(P.angle);
    ctx.fillStyle = 'rgba(6, 12, 30, 0.9)';
    ctx.beginPath();
    ctx.ellipse(r * 0.3, 0, r * 0.52, r * 0.64, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#dffcff';
    ctx.beginPath();
    ctx.arc(r * 0.46, -r * 0.24, r * 0.15, 0, TAU);
    ctx.arc(r * 0.46, r * 0.24, r * 0.15, 0, TAU);
    ctx.fill();
    ctx.restore();
    // mitad de delante del anillo metálico, con luces que giran
    ringArc(0, Math.PI);
    ctx.strokeStyle = '#c3d3ee';
    ctx.lineWidth = r * 0.2;
    ctx.stroke();
    ctx.save();
    ctx.rotate(-0.18);
    ctx.scale(1, 0.32);
    for (let k = 0; k < 4; k++) {
      const a = anim * 2.2 + (k * TAU) / 4;
      if (Math.sin(a) <= 0) continue; // solo las de delante
      ctx.fillStyle = C.colors.player;
      ctx.beginPath();
      ctx.arc(Math.cos(a) * r * 1.38, Math.sin(a) * r * 1.38, r * 0.13, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
    // antena con luz
    ctx.strokeStyle = '#b8c6e0';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(r * 0.3, -r * 0.92);
    ctx.lineTo(r * 0.55 + Math.sin(anim * 5) * 1.5, -r * 1.55);
    ctx.stroke();
    Art.glow(ctx, r * 0.55 + Math.sin(anim * 5) * 1.5, -r * 1.55, r * 0.5, Math.sin(anim * 7) > 0 ? '#ffe04a' : '#ff5f8f', 0.95);
    ctx.translate(0, -bob);

    ctx.globalAlpha = 1;
    drawShield(P);

    ctx.restore();
  }

  function drawVignette() {
    let a = run ? run.flash : 0;
    if (state === 'playing' && player && player.hp <= FX.lowHpThreshold) {
      a = Math.max(a, 0.2 + 0.12 * Math.sin(anim * 6));
    }
    const w = world.w;
    const h = world.h;
    if (run && run.freezeT > 0) { // los bordes se tiñen de hielo mientras dura la congelación
      const ia = Math.min(1, run.freezeT / 0.6) * (0.3 + 0.08 * Math.sin(anim * 5));
      const gi = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.2, w / 2, h / 2, Math.max(w, h) * 0.75);
      gi.addColorStop(0, 'rgba(143, 233, 255, 0)');
      gi.addColorStop(1, 'rgba(143, 233, 255, ' + ia.toFixed(3) + ')');
      ctx.fillStyle = gi;
      ctx.fillRect(0, 0, w, h);
    }
    if (a <= 0.01) return;

    const g = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.25, w / 2, h / 2, Math.max(w, h) * 0.75);
    g.addColorStop(0, 'rgba(255, 45, 138, 0)');
    g.addColorStop(1, 'rgba(255, 45, 138, ' + (a * 0.7).toFixed(3) + ')');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
  }

  // ------------------------------------------------------------------
  // Bucle principal (único)
  // ------------------------------------------------------------------
  // Lo que necesita la música: ¿estamos en un nivel (cuánto queda, qué jefe) o en los menús?
  function musicInfo() {
    if ((state === 'playing' || state === 'ending') && run) {
      return {
        scene: 'level',
        runId: run.id,
        level: currentLevel,
        tier: levelCfg.boss ? levelCfg.boss.tier : 0,
        boss: !!levelCfg.boss,
        total: run.duration,
        remaining: Math.max(0, run.duration - run.elapsed),
        phase: levelCfg.boss && Boss.active() ? Boss.state.phase : 1,
        paused: false,
      };
    }
    return { scene: 'menu', runId: 0 };
  }

  function frame(ts) {
    requestAnimationFrame(frame);
    const raw = (ts - last) / 1000;
    const dt = clamp(raw, 0, 0.05); // si la pestaña estuvo oculta, no hay saltos de tiempo
    last = ts;
    anim += dt;

    // Calidad automática: si hay muchos frames lentos seguidos, se apaga el resplandor (lo más caro)
    if (FX.autoQuality && glowOn && state === 'playing' && raw < 0.25) {
      slowTime = raw > 0.028 ? slowTime + raw : Math.max(0, slowTime - raw * 2);
      if (slowTime > 2.5) { glowOn = false; Art.setLow(true); }
    }

    step(dt);
    Music.update(dt, musicInfo());
    render();
  }

  // ------------------------------------------------------------------
  // Inicio
  // ------------------------------------------------------------------
  function init() {
    if (initialized) return;
    initialized = true;

    Particles.setLimit(C.limits.maxParticles);
    buildSegments();
    buildToasts();
    buildLevelGrid();
    buildLangGrid();
    buildFxChips();
    buildStars();
    modeBtns = Array.prototype.slice.call(document.querySelectorAll('.mode-btn'));
    I18n.onChange(onLanguageChanged);
    Input.attach({ area: dom.stage, base: dom.joystick, knob: dom.knob });

    // Todos los botones con data-action pasan por un único listener
    dom.app.addEventListener('click', (e) => {
      const btn = e.target.closest && e.target.closest('[data-action]');
      if (!btn) return;
      const action = btn.dataset.action;
      if (action === 'play') startGame(Levels.unlocked());
      else if (action === 'retry') startGame(currentLevel);
      else if (action === 'next') { if (currentLevel + 1 <= Levels.unlocked()) startGame(currentLevel + 1); }
      else if (action === 'level') { const n = Number(btn.dataset.level); if (n >= 1 && n <= Levels.unlocked()) startGame(n); }
      else if (action === 'levels') openLevels();
      else if (action === 'lang') openLang();
      else if (action === 'setlang') I18n.setLang(btn.dataset.lang);
      else if (action === 'mode') chooseMode(btn.dataset.mode);
      else if (action === 'menu') goMenu();
      else if (action === 'mute') toggleMute();
      else if (action === 'music') toggleMusic();
      else if (action === 'fullscreen') toggleFullscreen();
    });

    // Botón de dash: pointerdown para respuesta inmediata en móvil (no inicia el joystick)
    dom.dashBtn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      requestDash();
    });

    window.addEventListener('keydown', (e) => {
      if (e.repeat) return;
      if (e.code === 'KeyM') toggleMute();
      else if (e.code === 'KeyN') toggleMusic();
      else if (e.code === 'KeyF' && fsSupported) toggleFullscreen();
      else if ((e.code === 'Space' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') && state === 'playing') {
        e.preventDefault();
        requestDash();
      }
    });

    // Interactividad: ondas de color al tocar la arena, y estela de colores que sigue al puntero en el menú
    let trailX = -999;
    let trailY = -999;
    let trailHue = 0;
    dom.stage.addEventListener('pointerdown', (e) => {
      if (!FX.ripples || state !== 'playing') return;
      const w = toWorld(e.clientX, e.clientY);
      const h = rand(0, 360);
      Particles.ring(w.x, w.y, { color: Particles.hue(h), radius: 4, grow: 190, life: 0.45, width: 3 });
      Particles.burst(w.x, w.y, { count: 5, color: [Particles.hue(h), Particles.hue(h + 60)], speed: [40, 150], life: [0.2, 0.45], size: [1.5, 2.8] });
    });
    dom.app.addEventListener('pointermove', (e) => {
      if (!FX.menuTrail || (state !== 'menu' && state !== 'over')) return;
      const w = toWorld(e.clientX, e.clientY);
      if (Math.hypot(w.x - trailX, w.y - trailY) < 16 || Particles.count() > 260) return;
      trailX = w.x;
      trailY = w.y;
      trailHue += 13;
      Particles.emit({ x: w.x, y: w.y, vx: rand(-30, 30), vy: rand(-30, 30), life: 0.85, size: 3.4, drag: 2.5, color: Particles.hue(trailHue) });
      Particles.burst(w.x, w.y, { count: 2, color: [Particles.hue(trailHue + 40), '#ffffff'], speed: [30, 110], life: [0.25, 0.5], size: [1.2, 2.2] });
    });

    window.addEventListener('resize', layout);
    // El navegador no deja sonar nada hasta el primer gesto: el primer toque o tecla activa el audio (y con él la música del menú)
    const unlockAudio = () => { Sfx.unlock(); const ac = Sfx.ctx(); if (ac && ac.state === 'suspended') ac.resume(); };
    window.addEventListener('pointerdown', unlockAudio, { passive: true });
    window.addEventListener('keydown', unlockAudio);
    dom.fsBtn.hidden = !fsSupported;
    window.addEventListener('orientationchange', layout);
    if (window.ResizeObserver) new ResizeObserver(layout).observe(dom.stage);
    document.addEventListener('visibilitychange', () => { last = performance.now(); });

    // Solo lectura: permite inspeccionar el estado desde la consola o en pruebas automáticas
    window.__SURVIVE__ = {
      get state() { return state; },
      get player() { return player; },
      get run() { return run; },
      get glowOn() { return glowOn; },
      get upgradeCtx() { return upgradeCtx; },
      get level() { return currentLevel; },
      get mode() { return Levels.mode(); },
      get crate() { return crate; },
      get heart() { return heart; },
      get boss() { return Boss.state; },
      get musicInfo() { return musicInfo(); },
      get surprise() { return Surprise.orb; },
      get stars() { return stars; },
      get theme() { return theme; },
      get levelCfg() { return levelCfg; },
    };

    layout();
    I18n.apply();
    updateMuteLabel();
    updateMusicBtn();
    refreshMenu();
    refreshModeUI();
    refreshLangUI();
    refreshLevelTips();
    dom.menuTitle.setAttribute('aria-label', t('title.top') + ' 60 ' + t('title.bottom'));
    showScreen('menu');
    last = performance.now();
    requestAnimationFrame(frame);
  }

  init();
})();

</script>

        // Con file:// el navegador oculta el nombre del archivo que falla ("Script error."): se deduce del primero que no llegó a definirse
        var culprit = missing.length ? missing[0] : '';
        var detail = /^script error/i.test(B.crashed[0]) ? '' : ' (' + B.crashed[0] + ')';
        msg = es
          ? 'El archivo ' + (culprit || 'del juego') + ' existe pero no pudo ejecutarse' + detail + '. Prueba con un navegador actualizado (Chrome, Edge, Firefox o Safari recientes) o vuelve a descargar el archivo.'
          : 'The file ' + (culprit || 'of the game') + ' exists but could not run' + detail + '. Try an up-to-date browser (recent Chrome, Edge, Firefox or Safari) or download the file again.';
      } else {
        msg = es
          ? 'Faltan archivos junto a index.html: ' + missing.join(', ') + '. Copia los 22 archivos en la misma carpeta y recarga.' + zipTip
          : 'Files missing next to index.html: ' + missing.join(', ') + '. Copy all 22 files into the same folder and reload.' + zipTip;
      }
      var box = document.createElement('p');
      box.className = 'boot-error';
      box.setAttribute('role', 'alert');
      box.textContent = msg;
      var menu = document.getElementById('menuScreen');
      var play = menu.querySelector('[data-action="play"]');
      menu.insertBefore(box, play);
      play.disabled = true;
      play.style.opacity = '0.4';
      play.style.cursor = 'not-allowed';
    })();
  </script>
</body>
</html>
