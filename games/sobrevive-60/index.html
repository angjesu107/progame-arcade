/* ===== audio.js ===== */
'use strict';

/**
 * Efectos de sonido sintetizados con Web Audio (osciladores + ruido): cero archivos, funciona sin conexión.
 * El navegador solo permite audio tras un gesto del usuario, por eso Sfx.unlock() se llama al pulsar JUGAR.
 * Cada sonido tiene un intervalo mínimo para que no se acumulen decenas a la vez.
 *
 * API: Sfx.unlock(), Sfx.play(nombre), Sfx.toggleMute() -> bool, Sfx.isMuted(), Sfx.ctx()
 */
const Sfx = (() => {
  const cfg = GAME_CONFIG.audio;
  const STORE_KEY = 'sobrevive60-muted';

  let ac = null;
  let master = null;
  let noiseBuf = null;
  let muted = !cfg.enabled;
  const lastAt = {};

  try {
    if (window.localStorage && window.localStorage.getItem(STORE_KEY) === '1') muted = true;
  } catch (_) { /* con file:// algunos navegadores bloquean el almacenamiento: no pasa nada */ }

  // Segundos mínimos entre dos reproducciones del mismo sonido
  const MIN_GAP = {
    shoot: 0.07, hit: 0.045, kill: 0.04, hurt: 0.1, explosion: 0.08,
    warn: 0.09, aim: 0.3, snipe: 0.1, win: 0.5, lose: 0.5, ui: 0.05,
    combo: 0.07, freeze: 0.3, nova: 0.2, star: 0.3, firework: 0.09, orb: 0.2, heart: 0.2, pickup: 0.05, levelup: 0.5, upgrade: 0.3, dash: 0.15, shield: 0.3,
  };

  function unlock() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try { ac = new AC(); } catch (_) { ac = null; return; }
      master = ac.createGain();
      master.gain.value = cfg.volume;
      master.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const data = noiseBuf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    }
    if (ac.state === 'suspended') ac.resume();
  }

  function tone(type, f0, f1, dur, vol, delay) {
    const t = ac.currentTime + (delay || 0);
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) osc.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain);
    gain.connect(master);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  }

  function noise(dur, vol, f0, f1, delay) {
    const t = ac.currentTime + (delay || 0);
    const src = ac.createBufferSource();
    const filter = ac.createBiquadFilter();
    const gain = ac.createGain();
    src.buffer = noiseBuf;
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(f0, t);
    filter.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(filter);
    filter.connect(gain);
    gain.connect(master);
    src.start(t);
    src.stop(t + dur + 0.02);
  }

  const SOUNDS = {
    shoot() { tone('square', 880, 420, 0.07, 0.035); },
    hit() { tone('triangle', 320, 130, 0.06, 0.07); },
    kill() { tone('sawtooth', 240, 60, 0.18, 0.08); noise(0.14, 0.06, 3200, 400); },
    hurt() { tone('sawtooth', 170, 50, 0.25, 0.14); noise(0.16, 0.09, 2400, 300); },
    explosion() { noise(0.55, 0.28, 2000, 70); tone('sine', 95, 32, 0.45, 0.28); },
    warn() { tone('square', 1250, 1250, 0.045, 0.05); },
    aim() { tone('sine', 320, 1200, 0.9, 0.04); },
    snipe() { tone('sawtooth', 720, 110, 0.2, 0.1); noise(0.12, 0.07, 4000, 600); },
    win() {
      tone('triangle', 523, 523, 0.18, 0.12, 0);
      tone('triangle', 659, 659, 0.18, 0.12, 0.12);
      tone('triangle', 784, 784, 0.18, 0.12, 0.24);
      tone('triangle', 1047, 1047, 0.4, 0.12, 0.36);
    },
    lose() { tone('sawtooth', 320, 40, 0.9, 0.16); noise(0.5, 0.1, 1500, 100); },
    ui() { tone('square', 660, 880, 0.06, 0.05); },
    // el tono sube con el combo (arg = nº de bajas encadenadas)
    combo(n) { const f = 520 * Math.pow(2, Math.min(n || 2, 24) / 12); tone('triangle', f, f * 1.5, 0.12, 0.09); tone('sine', f * 2, f * 2, 0.08, 0.04, 0.05); },
    freeze() { tone('sine', 1500, 300, 0.5, 0.1); tone('triangle', 2200, 900, 0.35, 0.05, 0.05); noise(0.3, 0.05, 6000, 1200); },
    nova() { noise(0.5, 0.26, 2600, 90); tone('sawtooth', 220, 40, 0.45, 0.2); tone('sine', 880, 110, 0.3, 0.1); },
    star() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone('triangle', f, f, 0.14, 0.1, i * 0.07)); },
    firework() { noise(0.22, 0.12, 5000, 700); tone('sine', 900 + Math.random() * 500, 300, 0.2, 0.06); },
    orb() { tone('sine', 520, 1040, 0.12, 0.08); tone('sine', 780, 1560, 0.12, 0.07, 0.07); },
    heart() { tone('sine', 660, 990, 0.14, 0.12, 0); tone('sine', 880, 1320, 0.2, 0.12, 0.1); },
    pickup() { tone('sine', 880, 1500, 0.06, 0.045); },
    levelup() {
      tone('triangle', 392, 392, 0.12, 0.12, 0);
      tone('triangle', 523, 523, 0.12, 0.12, 0.09);
      tone('triangle', 659, 659, 0.12, 0.12, 0.18);
      tone('triangle', 784, 784, 0.3, 0.13, 0.27);
    },
    upgrade() { tone('square', 520, 1040, 0.12, 0.07); tone('triangle', 1040, 1560, 0.2, 0.08, 0.08); },
    dash() { noise(0.16, 0.12, 5000, 500); tone('sine', 300, 900, 0.14, 0.05); },
    shield() { tone('sine', 400, 800, 0.25, 0.08); tone('triangle', 800, 1200, 0.2, 0.05, 0.1); },
  };

  function play(name, arg) {
    if (muted || !ac || ac.state !== 'running') return;
    const fn = SOUNDS[name];
    if (!fn) return;
    const now = ac.currentTime;
    if (now - (lastAt[name] === undefined ? -1 : lastAt[name]) < (MIN_GAP[name] || 0.03)) return;
    lastAt[name] = now;
    try { fn(arg); } catch (_) { /* un fallo de audio nunca debe romper el juego */ }
  }

  function toggleMute() {
    muted = !muted;
    try { window.localStorage.setItem(STORE_KEY, muted ? '1' : '0'); } catch (_) { /* ignorar */ }
    if (!muted && ac) play('ui');
    return muted;
  }

  function isMuted() { return muted; }

  /** El AudioContext (null hasta el primer gesto del usuario): la música (Music) lo comparte. */
  function ctx() { return ac; }

  return { unlock, play, toggleMute, isMuted, ctx };
})();

/* ===== music.js ===== */
'use strict';

/**
 * Music — música sintetizada en directo con Web Audio (osciladores y ruido): cero archivos, funciona sin conexión.
 *
 * Cómo suena
 *  · Cada nivel usa una de 8 "tonalidades" (una por paleta de color: neon, jade, sunset...). Cuanto más alto el nivel,
 *    más rápida (+0,28 pulsaciones/min por nivel) y más intensa.
 *  · Dentro de un nivel la música CRECE con el tiempo: primero bajo y pad, luego arpegio, charles, bombo, caja y por
 *    último una melodía. El menú tiene una versión tranquila y misteriosa.
 *  · Los niveles de jefe tienen su propio tema (frigio dominante, bombo desde el principio, golpes de metal) que se
 *    vuelve más pesado en cada fase de furia.
 *  · SUSPENSO: en los últimos `tensionSeconds` segundos (20 en los jefes) cambia todo: el tempo sube un 18 %, el pad se
 *    vuelve un cluster disonante que tiembla, el arpegio se convierte en un ostinato de segunda menor, entra un latido
 *    que se acelera, una subida de tono continua y, en los últimos 5 s, un relojito.
 *  · Victoria y derrota tienen su propio efecto de sonido musical.
 *
 * Cómo funciona: un secuenciador por pasos (semicorcheas) que programa las notas por adelantado en el reloj de audio;
 * se alimenta desde el bucle del juego (Music.update), sin temporizadores. El motor (createEngine) no depende de la
 * página, por eso las pruebas lo renderizan sin conexión (OfflineAudioContext) y miden el resultado.
 *
 * API: update(dt, info), stinger('win'|'lose'), toggle() -> bool apagada, isOff(), themeInfo(), renderOffline(spec, s)
 *   info = { scene: 'menu'|'level', runId, level, tier, boss, total, remaining, phase, paused }
 */
const Music = (() => {
  const C = GAME_CONFIG.music;
  const STORE_KEY = 'sobrevive60-music-off';
  const TAU = Math.PI * 2;
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

  let off = false;
  try { off = !!(window.localStorage && window.localStorage.getItem(STORE_KEY) === '1'); } catch (_) { /* file:// puede bloquear el almacenamiento */ }

  // ---------------------------------------------------------------- Teoría musical
  const SCALES = {
    aeolian:  [0, 2, 3, 5, 7, 8, 10],
    dorian:   [0, 2, 3, 5, 7, 9, 10],
    phrygian: [0, 1, 3, 5, 7, 8, 10],
    harmonic: [0, 2, 3, 5, 7, 8, 11],
    phrygDom: [0, 1, 4, 5, 7, 8, 10],
  };

  // root = nota MIDI grave de la tonalidad; prog = grados de los acordes (uno por compás); arp = patrón de arpegio
  const THEME_ORDER = ['neon', 'jade', 'sunset', 'ocean', 'candy', 'toxic', 'aurora', 'ember'];
  const THEMES = {
    neon:   { root: 45, scale: 'aeolian',  bpm: 112, prog: [0, 5, 2, 6], arp: 0, lead: [0, 2, 4, 2, 5, 4, 2, 1] },
    jade:   { root: 38, scale: 'dorian',   bpm: 104, prog: [0, 3, 6, 0], arp: 1, lead: [0, 4, 2, 4, 6, 4, 2, 0] },
    sunset: { root: 40, scale: 'aeolian',  bpm: 118, prog: [0, 5, 2, 6], arp: 0, lead: [4, 2, 0, 2, 4, 5, 4, 2] },
    ocean:  { root: 42, scale: 'aeolian',  bpm: 96,  prog: [0, 2, 5, 4], arp: 2, lead: [0, 1, 2, 4, 2, 1, 0, 2] },
    candy:  { root: 36, scale: 'aeolian',  bpm: 124, prog: [0, 5, 2, 6], arp: 3, lead: [0, 2, 4, 5, 4, 2, 4, 2] },
    toxic:  { root: 40, scale: 'phrygian', bpm: 120, prog: [0, 1, 0, 6], arp: 3, lead: [0, 1, 0, 3, 1, 0, 6, 0] },
    aurora: { root: 47, scale: 'dorian',   bpm: 100, prog: [0, 3, 6, 0], arp: 2, lead: [0, 2, 4, 6, 4, 2, 4, 2] },
    ember:  { root: 45, scale: 'harmonic', bpm: 128, prog: [0, 4, 0, 3], arp: 0, lead: [0, 2, 4, 6, 5, 4, 2, 0] },
  };
  const MENU_THEME = { root: 45, scale: 'aeolian', bpm: 82, prog: [0, 5, 2, 4], arp: 2, lead: [0, 2, 4, 2, 0, 2, 4, 6] };
  const BOSS_THEME = { root: 40, scale: 'phrygDom', bpm: 140, prog: [0, 1, 0, 5], arp: 3, lead: [0, 1, 2, 1, 4, 3, 1, 0] };

  const BASS = [
    [1, 0, 0, 1, 0, 0, 1, 0, 1, 0, 0, 1, 0, 2, 0, 3],
    [1, 0, 1, 0, 0, 1, 0, 0, 1, 0, 1, 0, 0, 2, 3, 0],
  ];
  const ARP = [
    [0, 1, 2, 3, 2, 1, 2, 1, 0, 1, 2, 3, 2, 1, 2, 3],
    [0, -1, 2, -1, 1, -1, 3, -1, 0, -1, 2, -1, 1, -1, 3, -1],
    [0, -1, -1, 2, -1, -1, 1, -1, -1, 3, -1, -1, 2, -1, 1, -1],
    [0, 0, 2, 0, 1, 0, 3, 0, 0, 0, 2, 0, 1, 0, 3, 2],
  ];

  const midiHz = (m) => 440 * Math.pow(2, (m - 69) / 12);
  function degreeMidi(th, d) {
    const sc = SCALES[th.scale];
    return th.root + sc[((d % 7) + 7) % 7] + 12 * Math.floor(d / 7);
  }

  function themeFor(info) {
    if (info.scene === 'menu') return { name: 'menu', th: MENU_THEME };
    if (info.boss) return { name: 'boss', th: BOSS_THEME };
    const name = THEME_ORDER[(Math.max(1, info.level || 1) - 1) % THEME_ORDER.length];
    return { name, th: THEMES[name] };
  }

  function bpmFor(info, tension) {
    const { th } = themeFor(info);
    let bpm = th.bpm;
    if (info.scene === 'level') bpm += info.boss ? (info.tier || 1) * 1.5 + ((info.phase || 1) - 1) * 6 : (Math.max(1, info.level) - 1) * 0.28;
    return bpm * (1 + 0.18 * tension);
  }

  // Intensidad 0..1: decide cuántas capas suenan
  function intensityFor(info) {
    if (info.scene === 'menu') return 0.1;
    const f = clamp(1 - info.remaining / Math.max(1, info.total), 0, 1);
    const lv = clamp((info.level || 1) / 99, 0, 1);
    return clamp(f * 0.65 + lv * 0.3 + (info.boss ? 0.4 : 0) + ((info.phase || 1) - 1) * 0.1, 0, 1);
  }

  // ---------------------------------------------------------------- Motor (independiente de la página)
  /** ac = AudioContext o OfflineAudioContext; out = nodo de destino (ya conectado al altavoz) */
  function createEngine(ac, out) {
    const stats = { steps: 0, voices: 0, heartbeats: 0, ticks: 0, risers: 0, stingers: 0, maxVoices: 0 };
    const S = { scene: 'menu', level: 1, tier: 0, boss: false, total: 60, remaining: 60, phase: 1, runId: 0 };
    let nextT = 0;
    let stepIdx = 0;
    const ends = []; // instantes en que terminan las notas programadas (para limitar las voces simultáneas)
    let tensionOn = false;
    let lay = { arp: false, hat: false, kick: false, snare: false, lead: false };
    let lastTension = 0;
    let stingerUntil = 0;

    const noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    { const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }

    // Voces sonando en el instante t: se cuentan por su hora programada, así vale en directo y renderizando sin conexión
    function busy(t) {
      let w = 0;
      for (let i = 0; i < ends.length; i++) if (ends[i] > t) ends[w++] = ends[i];
      ends.length = w;
      return w;
    }

    function track(src, gain, endT) {
      ends.push(endT);
      stats.voices++;
      if (ends.length > stats.maxVoices) stats.maxVoices = ends.length;
      src.onended = () => { try { gain.disconnect(); } catch (_) { /* ya desconectado */ } };
    }

    // Una nota: oscilador -> (filtro) -> envolvente -> salida
    function voice(type, f, t, dur, vol, o) {
      o = o || {};
      if (busy(t) > 70 && !o.important) return null; // tope de voces simultáneas
      const osc = ac.createOscillator();
      const g = ac.createGain();
      const a = o.attack || 0.005;
      osc.type = type;
      osc.frequency.setValueAtTime(f, t);
      if (o.slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.slideTo), t + a + dur);
      if (o.detune) osc.detune.value = o.detune;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol, t + a);
      g.gain.exponentialRampToValueAtTime(0.0001, t + a + dur);
      if (o.cutoff) {
        const fl = ac.createBiquadFilter();
        fl.type = 'lowpass';
        fl.frequency.setValueAtTime(o.cutoff, t);
        if (o.cutoffEnd) fl.frequency.exponentialRampToValueAtTime(o.cutoffEnd, t + a + dur);
        fl.Q.value = o.q || 0.8;
        osc.connect(fl);
        fl.connect(g);
      } else {
        osc.connect(g);
      }
      g.connect(o.dest || out);
      osc.start(t);
      osc.stop(t + a + dur + 0.05);
      track(osc, g, t + a + dur + 0.05);
      return osc;
    }

    function noiseHit(t, dur, vol, type, freq, q, freqEnd) {
      if (busy(t) > 70) return;
      const src = ac.createBufferSource();
      src.buffer = noiseBuf;
      const fl = ac.createBiquadFilter();
      fl.type = type;
      fl.frequency.setValueAtTime(freq, t);
      if (freqEnd) fl.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);
      fl.Q.value = q || 0.7;
      const g = ac.createGain();
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(fl);
      fl.connect(g);
      g.connect(out);
      src.start(t, Math.random() * 0.7);
      src.stop(t + dur + 0.03);
      track(src, g, t + dur + 0.03);
    }

    // ---- instrumentos
    const kick = (t, v) => { voice('sine', 150, t, 0.17, v || 0.55, { slideTo: 42, important: true }); };
    const hat = (t, v) => noiseHit(t, 0.045, v || 0.05, 'highpass', 7500, 0.7);
    const snare = (t) => { noiseHit(t, 0.14, 0.2, 'bandpass', 1900, 0.9); voice('triangle', 200, t, 0.1, 0.14, { slideTo: 120 }); };
    const bass = (m, t, dur, v) => voice('sawtooth', midiHz(m), t, dur, v, { cutoff: 520, cutoffEnd: 180, q: 1.4, attack: 0.008 });
    const pluck = (m, t, dur, v, cut) => voice('triangle', midiHz(m), t, dur, v, { cutoff: cut || 2400, cutoffEnd: 700, attack: 0.004 });
    const lead = (m, t, dur, v) => { voice('square', midiHz(m), t, dur, v, { cutoff: 2100, attack: 0.012 }); voice('triangle', midiHz(m) * 2, t, dur, v * 0.5, { attack: 0.012 }); };
    const stab = (ms, t, v) => { for (const m of ms) voice('sawtooth', midiHz(m), t, 0.2, v, { cutoff: 1800, cutoffEnd: 500, attack: 0.004 }); };

    // Pad: varios sierras desafinadas por un filtro común; con tremolo opcional (cuerdas que tiemblan)
    function pad(ms, t, dur, vol, cutoff, tremolo) {
      if (busy(t) > 60) return;
      const g = ac.createGain();
      const fl = ac.createBiquadFilter();
      fl.type = 'lowpass';
      fl.frequency.value = cutoff;
      fl.Q.value = 0.6;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol, t + Math.min(0.4, dur * 0.3));
      g.gain.setValueAtTime(vol, t + dur * 0.7);
      g.gain.linearRampToValueAtTime(0.0001, t + dur);
      fl.connect(g);
      g.connect(out);
      let last = null;
      for (const m of ms) {
        for (const dt of [-7, 7]) {
          const osc = ac.createOscillator();
          osc.type = 'sawtooth';
          osc.frequency.value = midiHz(m);
          osc.detune.value = dt;
          osc.connect(fl);
          osc.start(t);
          osc.stop(t + dur + 0.05);
          track(osc, g, t + dur + 0.05);
          last = osc;
        }
      }
      if (tremolo && last) { // modulación de volumen rápida: el temblor de las cuerdas de suspenso
        const lfo = ac.createOscillator();
        const depth = ac.createGain();
        lfo.frequency.value = tremolo;
        depth.gain.value = vol * 0.55;
        lfo.connect(depth);
        depth.connect(g.gain);
        lfo.start(t);
        lfo.stop(t + dur + 0.05);
      }
    }

    function heartbeat(t, v) {
      voice('sine', 72, t, 0.15, v, { slideTo: 38, important: true });
      voice('sine', 62, t + 0.15, 0.17, v * 0.75, { slideTo: 34, important: true });
      stats.heartbeats++;
    }
    function tick(t, v) { voice('sine', 1900, t, 0.035, v, { important: true }); voice('triangle', 950, t, 0.05, v * 0.6, { important: true }); stats.ticks++; }

    // Subida de tono que dura hasta el final del tiempo: ruido que se abre y una sierra que sube
    function riser(t, dur) {
      if (dur < 0.5) return;
      stats.risers++;
      const src = ac.createBufferSource();
      src.buffer = noiseBuf;
      src.loop = true;
      const fl = ac.createBiquadFilter();
      fl.type = 'bandpass';
      fl.Q.value = 1.2;
      fl.frequency.setValueAtTime(400, t);
      fl.frequency.exponentialRampToValueAtTime(7000, t + dur);
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.16, t + dur);
      src.connect(fl);
      fl.connect(g);
      g.connect(out);
      src.start(t);
      src.stop(t + dur + 0.05);
      track(src, g, t + dur + 0.05);
      const o = ac.createOscillator();
      const og = ac.createGain();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(110, t);
      o.frequency.exponentialRampToValueAtTime(1100, t + dur);
      og.gain.setValueAtTime(0.0001, t);
      og.gain.exponentialRampToValueAtTime(0.05, t + dur);
      const fl2 = ac.createBiquadFilter();
      fl2.type = 'lowpass';
      fl2.frequency.setValueAtTime(500, t);
      fl2.frequency.exponentialRampToValueAtTime(5000, t + dur);
      o.connect(fl2);
      fl2.connect(og);
      og.connect(out);
      o.start(t);
      o.stop(t + dur + 0.05);
      track(o, og, t + dur + 0.05);
    }

    // ---- secuenciador
    function tensionNow() {
      if (S.scene !== 'level') return 0;
      const T = S.boss ? C.bossTensionSeconds : C.tensionSeconds;
      return S.remaining <= T ? clamp(1 - S.remaining / T, 0.02, 1) : 0;
    }

    function scheduleStep(t, st, bar) {
      stats.steps++;
      const info = S;
      const { th } = themeFor(info);
      const tension = tensionNow();
      lastTension = tension;
      const inten = intensityFor(info);

      if (st === 0) { // las capas solo cambian al empezar un compás
        lay = {
          arp: inten >= 0.12, hat: inten >= 0.2, kick: inten >= 0.3, snare: inten >= 0.45, lead: inten >= 0.65,
        };
      }
      const d = th.prog[bar % th.prog.length];
      const rootM = degreeMidi(th, d);
      const chord = [rootM, degreeMidi(th, d + 2), degreeMidi(th, d + 4)];
      const barDur = (60 / bpmFor(info, tension)) * 4;

      // suspenso: empieza la subida de tono (una sola vez) y cambia el carácter de todo
      if (tension > 0 && !tensionOn) { tensionOn = true; riser(t, Math.max(1, S.remaining)); }
      if (tension === 0) tensionOn = false;

      if (st === 0) {
        if (tension > 0) {
          // cluster disonante: fundamental, segunda menor y tritono (temblando)
          pad([rootM + 12, rootM + 13, rootM + 18], t, barDur * 1.05, 0.05 + 0.03 * tension, 1100, 6 + 6 * tension);
        } else {
          pad([chord[0] + 12, chord[1] + 12, chord[2] + 12], t, barDur * 1.05, info.scene === 'menu' ? 0.045 : 0.06, 900 + 600 * inten);
        }
      }

      // bajo
      if (info.scene !== 'menu') {
        const bp = BASS[bar % 2];
        const b = bp[st];
        if (b) {
          const semis = b === 1 ? 0 : b === 2 ? 7 : 12;
          const v = (0.2 + 0.1 * inten) * (tension > 0 ? 1.15 : 1);
          bass(rootM + semis, t, (60 / bpmFor(info, tension)) * 0.9, v);
        }
      }

      // arpegio (o el ostinato de segunda menor del suspenso)
      if (tension > 0) {
        if (st % 2 === 0) {
          const m = rootM + 36 + ((st / 2) % 2 === 0 ? 0 : 1);
          pluck(m, t, 0.12, 0.05 + 0.05 * tension, 1500 + 3000 * tension);
        }
      } else if (lay.arp || info.scene === 'menu') {
        const idx = ARP[th.arp][st];
        if (idx >= 0) {
          const m = (idx === 3 ? chord[0] + 12 : chord[idx]) + 24;
          pluck(m, t, 0.2, info.scene === 'menu' ? 0.05 : 0.07, 1800 + 1800 * inten);
        }
      }

      // percusión
      if (info.scene === 'level') {
        if (lay.kick && (st % 4 === 0 || (info.boss && ((info.phase || 1) >= 2) && st === 10))) kick(t, 0.5);
        if (lay.snare && (st === 4 || st === 12)) snare(t);
        if (lay.hat) {
          const dense = inten > 0.75 || tension > 0.4;
          if (dense ? true : st % 4 === 2) hat(t, st % 2 === 0 ? 0.045 : 0.03);
        }
      }

      // melodía y golpes de metal
      if (lay.lead && tension === 0 && info.scene === 'level' && st % 2 === 0) {
        const note = th.lead[(st / 2) % th.lead.length];
        lead(degreeMidi(th, note + d) + 24, t, 0.2, 0.035);
      }
      if (info.boss && lay.kick && [0, 3, 6, 10, 12].includes(st) && tension === 0) stab([rootM + 12, rootM + 19], t, 0.04);

      // suspenso: latido que se acelera y relojito en los últimos segundos
      if (tension > 0) {
        const beat = tension < 0.5 ? (st === 0 || st === 8) : (st % 4 === 0);
        if (beat) heartbeat(t, 0.55 + 0.35 * tension);
        if (S.remaining <= 5 && ((S.remaining <= 2.5) ? st % 2 === 0 : st % 4 === 2)) tick(t, 0.16);
      }
    }

    function currentStepDur() { return 60 / bpmFor(S, tensionNow()) / 4; }

    return {
      S, stats, ac,
      get nextT() { return nextT; },
      get tension() { return lastTension; },
      get stingerUntil() { return stingerUntil; },
      setInfo(info) { Object.assign(S, info); },
      /** Reinicia el compás (cambio de escena o de nivel). */
      restart(t) { nextT = t; stepIdx = 0; tensionOn = false; lay = { arp: false, hat: false, kick: false, snare: false, lead: false }; },
      resync(t) { if (nextT < t) nextT = t; },
      /** Programa todas las notas que caigan antes de `until` (segundos del reloj de audio). */
      schedule(until) {
        let guard = 0;
        while (nextT < until && guard++ < 64) {
          scheduleStep(nextT, stepIdx % 16, Math.floor(stepIdx / 16));
          nextT += currentStepDur();
          stepIdx++;
        }
      },
      /** Efecto musical de victoria o derrota (no depende del compás). */
      stinger(kind, t) {
        stats.stingers++;
        if (kind === 'win') {
          [69, 73, 76, 81, 85, 88, 93].forEach((m, i) => { lead(m, t + i * 0.085, 0.35, 0.09); pluck(m - 12, t + i * 0.085, 0.4, 0.09, 3500); });
          pad([57, 61, 64, 69], t + 0.55, 2.2, 0.08, 2200);
          kick(t, 0.5);
          kick(t + 0.55, 0.45);
          stingerUntil = t + 3;
        } else {
          [69, 65, 62, 57, 50].forEach((m, i) => { voice('sawtooth', midiHz(m), t + i * 0.2, 0.5, 0.11, { cutoff: 1200, cutoffEnd: 200, attack: 0.01, important: true }); });
          voice('sine', 55, t, 2.6, 0.3, { slideTo: 40, attack: 0.05, important: true });
          noiseHit(t + 0.1, 1.5, 0.14, 'lowpass', 2500, 0.7, 120);
          stingerUntil = t + 3;
        }
      },
      pauseUntil(t) { stingerUntil = Math.max(stingerUntil, t); },
    };
  }

  // ---------------------------------------------------------------- Parte viva (el juego)
  let eng = null;
  let busGain = null;
  let curKey = '';
  let lastNow = 0;
  let pendingKey = null;

  function ensure() {
    const ac = Sfx.ctx();
    if (!ac) return null;
    if (eng && eng.ac === ac) return eng;
    busGain = ac.createGain();
    busGain.gain.value = 0.0001;
    const comp = ac.createDynamicsCompressor(); // evita que se sature cuando suenan todas las capas a la vez
    comp.threshold.value = -20;
    comp.knee.value = 10;
    comp.ratio.value = 6;
    comp.attack.value = 0.004;
    comp.release.value = 0.2;
    const soft = ac.createBiquadFilter(); // suaviza los agudos para que no canse
    soft.type = 'lowpass';
    soft.frequency.value = 9000;
    busGain.connect(soft);
    soft.connect(comp);
    comp.connect(ac.destination);
    eng = createEngine(ac, busGain);
    return eng;
  }

  function update(dt, info) {
    if (!C.enabled) return;
    const e = ensure();
    if (!e) return;
    const ac = e.ac;
    if (ac.state !== 'running') return;
    const now = ac.currentTime;
    const silent = off || Sfx.isMuted() || !!info.paused;
    const target = silent ? 0.0001 : C.volume;

    const key = info.scene + ':' + (info.scene === 'level' ? info.runId : 0);
    const locked = now < e.stingerUntil; // suena el efecto de victoria/derrota: no se interrumpe
    if (key !== curKey) {
      if (locked) { pendingKey = key; } else { startScene(e, now, key, target); }
    } else if (pendingKey && !locked) {
      pendingKey = null;
      startScene(e, now, key, target);
    }
    if (pendingKey && !locked) { startScene(e, now, key, target); pendingKey = null; }

    // volumen general (suave: sin chasquidos al silenciar)
    busGain.gain.setTargetAtTime(target, now, 0.12);

    e.setInfo({ scene: info.scene, level: info.level || 1, tier: info.tier || 0, boss: !!info.boss, total: info.total || 60, remaining: info.remaining === undefined ? 60 : info.remaining, phase: info.phase || 1, runId: info.runId || 0 });
    if (silent || locked) { e.resync(now + 0.05); lastNow = now; return; }
    if (now - lastNow > 0.8) e.resync(now + 0.05); // el navegador estuvo parado: sin atrasos acumulados
    lastNow = now;
    e.schedule(now + C.lookahead);
  }

  function startScene(e, now, key, target) {
    curKey = key;
    const g = busGain.gain;
    g.cancelScheduledValues(now);
    g.setValueAtTime(Math.max(0.0001, g.value), now);
    g.linearRampToValueAtTime(0.0001, now + 0.2);          // se apaga lo que sonaba
    g.setValueAtTime(0.0001, now + 0.25);
    g.linearRampToValueAtTime(target, now + 1.4);          // y entra la música nueva poco a poco
    e.restart(now + 0.25);
  }

  function stinger(kind) {
    if (!C.enabled || off || Sfx.isMuted()) return;
    const e = ensure();
    if (!e || e.ac.state !== 'running') return;
    const now = e.ac.currentTime;
    const g = busGain.gain;
    g.cancelScheduledValues(now);
    g.setValueAtTime(Math.max(0.0001, g.value), now);
    g.linearRampToValueAtTime(C.volume * 1.1, now + 0.08);
    e.stinger(kind, now + 0.05);
  }

  function toggle() {
    off = !off;
    try { window.localStorage.setItem(STORE_KEY, off ? '1' : '0'); } catch (_) { /* ignorar */ }
    return off;
  }

  /** Renderiza `seconds` s de música sin conexión (para las pruebas). spec = { scene, level, tier, boss, total, phase }. */
  async function renderOffline(spec, seconds) {
    const sr = 22050;
    const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    const oac = new OAC(1, Math.ceil(seconds * sr), sr);
    const bus = oac.createGain();
    bus.gain.value = C.volume;
    const comp = oac.createDynamicsCompressor();
    comp.threshold.value = -20; comp.knee.value = 10; comp.ratio.value = 6; comp.attack.value = 0.004; comp.release.value = 0.2;
    bus.connect(comp);
    comp.connect(oac.destination);
    const e = createEngine(oac, bus);
    e.restart(0.05);
    const total = spec.total || 60;
    for (let t = 0; t < seconds; t += 0.25) {
      e.setInfo({ scene: spec.scene || 'level', level: spec.level || 1, tier: spec.tier || 0, boss: !!spec.boss, total, remaining: Math.max(0, total - t), phase: spec.phase || 1, runId: 1 });
      e.schedule(t + 0.5);
    }
    const buf = await oac.startRendering();
    return { data: buf.getChannelData(0), sampleRate: sr, stats: e.stats };
  }

  return {
    update, stinger, toggle,
    isOff: () => off,
    themeInfo: (info) => { const r = themeFor(info); return { name: r.name, root: r.th.root, scale: r.th.scale, bpm: Math.round(bpmFor(info, 0) * 10) / 10 }; },
    intensity: intensityFor,
    renderOffline,
    get engine() { return eng; },
    THEME_ORDER,
  };
})();

/* ===== input.js ===== */
'use strict';

/**
 * Entrada del jugador: teclado (WASD + flechas) y joystick virtual flotante.
 * El joystick aparece donde el dedo toca la arena y sigue al dedo si se aleja del centro,
 * así cambiar de dirección siempre es inmediato.
 *
 * API: Input.attach({ area, base, knob }), Input.setEnabled(bool), Input.getVector() -> {x, y}
 */
const Input = (() => {
  const cfg = GAME_CONFIG.joystick;

  const BY_CODE = {
    KeyW: 'up', ArrowUp: 'up',
    KeyS: 'down', ArrowDown: 'down',
    KeyA: 'left', ArrowLeft: 'left',
    KeyD: 'right', ArrowRight: 'right',
  };
  const BY_KEY = { w: 'up', s: 'down', a: 'left', d: 'right' }; // respaldo para otras distribuciones de teclado

  const keys = new Map(); // tecla física -> dirección
  const out = { x: 0, y: 0 }; // objeto reutilizado para no generar basura en cada frame
  const stick = { active: false, id: null, ox: 0, oy: 0, x: 0, y: 0 };

  let enabled = false;
  let attached = false;
  let baseEl = null;
  let knobEl = null;

  // ---------------- Teclado ----------------

  function dirOf(e) {
    return BY_CODE[e.code] || BY_KEY[(e.key || '').toLowerCase()] || null;
  }

  function onKeyDown(e) {
    const dir = dirOf(e);
    if (!dir) return;
    keys.set(e.code || e.key, dir);
    if (e.code && e.code.startsWith('Arrow')) e.preventDefault(); // evita que las flechas desplacen la página
  }

  function onKeyUp(e) {
    keys.delete(e.code || e.key);
  }

  // ---------------- Joystick ----------------

  function showStick(x, y) {
    if (!baseEl) return;
    baseEl.hidden = false;
    baseEl.style.left = x + 'px';
    baseEl.style.top = y + 'px';
    knobEl.style.transform = 'translate(0px, 0px)';
  }

  function resetStick() {
    stick.active = false;
    stick.id = null;
    stick.x = 0;
    stick.y = 0;
    if (baseEl) baseEl.hidden = true;
  }

  function onPointerDown(e) {
    if (!enabled || stick.active) return;
    if (e.target && e.target.closest && e.target.closest('[data-nostick]')) return; // botones sobre la arena (dash)
    if (e.pointerType === 'mouse' && (!cfg.allowMouse || e.button !== 0)) return;
    e.preventDefault();
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) { /* no pasa nada si no se puede capturar */ }
    stick.active = true;
    stick.id = e.pointerId;
    stick.ox = e.clientX;
    stick.oy = e.clientY;
    stick.x = 0;
    stick.y = 0;
    showStick(stick.ox, stick.oy);
  }

  function onPointerMove(e) {
    if (!stick.active || e.pointerId !== stick.id) return;
    e.preventDefault();

    const R = cfg.radius;
    let dx = e.clientX - stick.ox;
    let dy = e.clientY - stick.oy;
    let dist = Math.hypot(dx, dy);

    // Si el dedo se sale del círculo, el centro lo sigue
    if (dist > R) {
      const excess = dist - R;
      stick.ox += (dx / dist) * excess;
      stick.oy += (dy / dist) * excess;
      dx = e.clientX - stick.ox;
      dy = e.clientY - stick.oy;
      dist = Math.hypot(dx, dy);
      baseEl.style.left = stick.ox + 'px';
      baseEl.style.top = stick.oy + 'px';
    }

    const m = Math.min(1, dist / R);
    if (m < cfg.deadZone || dist === 0) {
      stick.x = 0;
      stick.y = 0;
    } else {
      const scale = (m - cfg.deadZone) / (1 - cfg.deadZone); // remapea para que el recorrido útil llegue a 1
      stick.x = (dx / dist) * scale;
      stick.y = (dy / dist) * scale;
    }
    knobEl.style.transform = 'translate(' + dx.toFixed(1) + 'px, ' + dy.toFixed(1) + 'px)';
  }

  function onPointerEnd(e) {
    if (!stick.active) return;
    if (e && e.pointerId !== undefined && e.pointerId !== stick.id) return;
    resetStick();
  }

  // ---------------- API pública ----------------

  /** Conecta los eventos. Es seguro llamarlo más de una vez: solo se engancha una. */
  function attach({ area, base, knob }) {
    if (attached) return;
    attached = true;
    baseEl = base;
    knobEl = knob;

    // Tamaño del joystick según la configuración
    const size = cfg.radius * 2;
    const knobSize = Math.round(cfg.radius * 0.86);
    base.style.width = size + 'px';
    base.style.height = size + 'px';
    base.style.margin = (-cfg.radius) + 'px 0 0 ' + (-cfg.radius) + 'px';
    knob.style.width = knobSize + 'px';
    knob.style.height = knobSize + 'px';
    knob.style.margin = (-knobSize / 2) + 'px 0 0 ' + (-knobSize / 2) + 'px';

    area.addEventListener('pointerdown', onPointerDown);
    area.addEventListener('pointermove', onPointerMove);
    area.addEventListener('pointerup', onPointerEnd);
    area.addEventListener('pointercancel', onPointerEnd);
    area.addEventListener('lostpointercapture', onPointerEnd);
    area.addEventListener('contextmenu', (e) => e.preventDefault());
    area.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false }); // evita el "rebote" de iOS

    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('keyup', onKeyUp);
    window.addEventListener('blur', () => { keys.clear(); resetStick(); });
  }

  /** Activa o desactiva la entrada táctil. Al desactivar se suelta el joystick. */
  function setEnabled(value) {
    enabled = !!value;
    if (!enabled) resetStick();
  }

  /** Dirección de movimiento normalizada (longitud 0-1). El joystick manda sobre el teclado. */
  function getVector() {
    if (stick.active && (stick.x !== 0 || stick.y !== 0)) {
      out.x = stick.x;
      out.y = stick.y;
      return out;
    }

    let left = false, right = false, up = false, down = false;
    for (const dir of keys.values()) {
      if (dir === 'left') left = true;
      else if (dir === 'right') right = true;
      else if (dir === 'up') up = true;
      else if (dir === 'down') down = true;
    }
    let x = (right ? 1 : 0) - (left ? 1 : 0);
    let y = (down ? 1 : 0) - (up ? 1 : 0);
    if (x !== 0 && y !== 0) { // en diagonal no se va más rápido
      x *= Math.SQRT1_2;
      y *= Math.SQRT1_2;
    }
    out.x = x;
    out.y = y;
    return out;
  }

  return { attach, setEnabled, getVector };
})();

  <script>
/* ===== projectiles.js ===== */
'use strict';

/**
 * Proyectiles del jugador y de los enemigos.
 *
 * - Pool de objetos: los proyectiles destruidos se reciclan, no se crean objetos nuevos en cada disparo.
 * - Límite duro (GAME_CONFIG.limits): si se alcanza, el disparo simplemente no sale.
 * - Colisión "barrida": se comprueba el segmento recorrido en el frame, no solo el punto final,
 *   así un proyectil rápido no atraviesa a un enemigo pequeño aunque haya un tirón de frames.
 * - Se eliminan al impactar, al recorrer su alcance máximo o al salir de la arena.
 */
const Projectiles = (() => {
  const L = GAME_CONFIG.limits;
  const TAU = Math.PI * 2;

  const mine = [];       // activos del jugador
  const hostile = [];    // activos de los enemigos
  const freeMine = [];
  const freeHostile = [];

  function blank() {
    return { x: 0, y: 0, px: 0, py: 0, vx: 0, vy: 0, speed: 0, r: 4, damage: 0, travel: 0, maxTravel: 0, color: '#ffffff' };
  }

  function launch(list, free, limit, x, y, angle, speed, damage, range, radius, color) {
    if (list.length >= limit) return null;
    const b = free.pop() || blank();
    b.x = x; b.y = y; b.px = x; b.py = y;
    b.vx = Math.cos(angle) * speed;
    b.vy = Math.sin(angle) * speed;
    b.speed = speed;
    b.r = radius;
    b.damage = damage;
    b.travel = 0;
    b.maxTravel = range;
    b.color = color;
    list.push(b);
    return b;
  }

  function release(list, free, i) {
    const b = list[i];
    list[i] = list[list.length - 1];
    list.pop();
    free.push(b);
  }

  function firePlayer(x, y, angle, speed, damage, range, radius, color) {
    return launch(mine, freeMine, L.maxPlayerProjectiles, x, y, angle, speed, damage, range, radius, color);
  }

  function fireHostile(x, y, angle, speed, damage, range, radius, color) {
    return launch(hostile, freeHostile, L.maxHostileProjectiles, x, y, angle, speed, damage, range, radius, color);
  }

  // Distancia al cuadrado entre el punto (cx, cy) y el segmento (ax, ay)-(bx, by)
  function segDist2(ax, ay, bx, by, cx, cy) {
    const dx = bx - ax;
    const dy = by - ay;
    const len2 = dx * dx + dy * dy;
    let t = len2 > 0 ? ((cx - ax) * dx + (cy - ay) * dy) / len2 : 0;
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    const ex = ax + dx * t - cx;
    const ey = ay + dy * t - cy;
    return ex * ex + ey * ey;
  }

  /**
   * Mueve los proyectiles del jugador y resuelve impactos contra los enemigos.
   * env: { w, h }   enemies: lista de enemigos   onHit(enemigo, proyectil)
   */
  function updatePlayerShots(dt, env, enemies, onHit) {
    for (let i = mine.length - 1; i >= 0; i--) {
      if (i >= mine.length) { i = mine.length; continue; } // un impacto pudo vaciar la lista (p. ej. al acabar la partida)
      const b = mine[i];
      b.px = b.x;
      b.py = b.y;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.travel += b.speed * dt;

      // los disparos del jugador se detienen en las paredes
      if (env.maze && env.maze.hit(b.x, b.y, b.r)) {
        release(mine, freeMine, i);
        if (env.onWallHit) env.onWallHit(b);
        continue;
      }

      let target = null;
      for (let j = 0; j < enemies.length; j++) {
        const e = enemies[j];
        if (e.spawnT > 0) continue; // los enemigos que aún están apareciendo no se pueden golpear
        const rr = e.r + b.r;
        if (segDist2(b.px, b.py, b.x, b.y, e.x, e.y) <= rr * rr) { target = e; break; }
      }

      if (target) {
        release(mine, freeMine, i); // el proyectil desaparece al impactar
        onHit(target, b);           // b sigue siendo válido: solo se reutiliza en el próximo disparo
      } else if (b.travel >= b.maxTravel || b.x < -20 || b.y < -20 || b.x > env.w + 20 || b.y > env.h + 20) {
        release(mine, freeMine, i);
      }
    }
  }

  /** Mueve los proyectiles enemigos y resuelve impactos contra el jugador. onHit(proyectil) */
  function updateHostileShots(dt, env, player, onHit) {
    for (let i = hostile.length - 1; i >= 0; i--) {
      if (i >= hostile.length) { i = hostile.length; continue; }
      const b = hostile[i];
      b.px = b.x;
      b.py = b.y;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.travel += b.speed * dt;

      // y los de los enemigos también: las paredes sirven de cobertura
      if (env.maze && env.maze.hit(b.x, b.y, b.r)) {
        release(hostile, freeHostile, i);
        if (env.onWallHit) env.onWallHit(b);
        continue;
      }

      const rr = player.r + b.r;
      if (player.alive && segDist2(b.px, b.py, b.x, b.y, player.x, player.y) <= rr * rr) {
        release(hostile, freeHostile, i);
        onHit(b);
      } else if (b.travel >= b.maxTravel || b.x < -20 || b.y < -20 || b.x > env.w + 20 || b.y > env.h + 20) {
        release(hostile, freeHostile, i);
      }
    }
  }

  function draw(ctx, gfx) {
    ctx.save();
    for (let i = 0; i < mine.length; i++) Art.playerBolt(ctx, mine[i], gfx.anim);
    for (let i = 0; i < hostile.length; i++) Art.hostileOrb(ctx, hostile[i], gfx.anim);
    ctx.restore();
  }

  /** Elimina los proyectiles enemigos dentro de un radio (la Nova los barre). Devuelve cuántos. */
  function clearHostileNear(x, y, r) {
    let removed = 0;
    for (let i = hostile.length - 1; i >= 0; i--) {
      const b = hostile[i];
      const dx = b.x - x;
      const dy = b.y - y;
      if (dx * dx + dy * dy <= r * r) { release(hostile, freeHostile, i); removed++; }
    }
    return removed;
  }

  function clear() {
    while (mine.length) freeMine.push(mine.pop());
    while (hostile.length) freeHostile.push(hostile.pop());
  }

  function count() { return mine.length; }
  function countHostile() { return hostile.length; }

  return { firePlayer, fireHostile, updatePlayerShots, updateHostileShots, draw, clear, clearHostileNear, count, countHostile, get hostileList() { return hostile; } }; // hostileList: solo lectura, para depurar y probar
})();

  <script>
/* ===== enemies.js ===== */
'use strict';

/**
 * Enemigos: Perseguidor, Rápido, Tanque, Explosivo y Francotirador.
 *
 * - Los datos de cada tipo (vida, velocidad, color...) están en GAME_CONFIG.enemies.
 * - Los objetos se reciclan con un pool: matar y reaparecer no genera basura.
 * - Mientras "aparece" (spawnT > 0) un enemigo es inofensivo e invulnerable: solo se ve el aviso.
 *
 * API: spawn, damage, update, drawGround, draw, drawBars, count, countOf, clear, setOnKill, list
 */
const Enemies = (() => {
  const C = GAME_CONFIG;
  const FX = C.effects;
  const TAU = Math.PI * 2;

  const list = [];   // enemigos vivos
  const free = [];   // objetos reciclados
  const counts = {}; // vivos por tipo
  let killHook = null;

  const rand = (a, b) => a + Math.random() * (b - a);
  const wrapPi = (a) => {
    while (a > Math.PI) a -= TAU;
    while (a < -Math.PI) a += TAU;
    return a;
  };

  // Todos los enemigos comparten la misma forma de objeto (campos de todos los comportamientos)
  function blank() {
    return {
      id: '', def: null, idx: 0,
      x: 0, y: 0, vx: 0, vy: 0, kx: 0, ky: 0,
      r: 10, hp: 1, maxHp: 1, speed: 0, angle: 0,
      spawnT: 0, spawnDur: 1, seed: 0,
      flash: 0, barT: 0,
      fuseOn: false, fuse: 0, beepT: 0,                      // explosivo
      cd: 0, aim: 0, aimAngle: 0, locked: false, strafe: 1,  // francotirador
      face: 1, starCd: 0, minion: false, dmgMul: 1,                              // soldados del jefe / daño de contacto del jefe
    };
  }

  function count() { return list.length; }
  function countOf(id) { return counts[id] || 0; }
  function setOnKill(fn) { killHook = fn; }

  /** Crea un enemigo (o devuelve null si se alcanzó el límite global). */
  function spawn(id, x, y, target, hpMult, sizeMult) {
    if (list.length >= C.limits.maxEnemies) return null;
    const def = C.enemies[id] || (id === 'boss' ? C.boss.def : null);
    if (!def) return null;

    const e = free.pop() || blank();
    e.id = id;
    e.def = def;
    e.x = x; e.y = y;
    e.vx = 0; e.vy = 0; e.kx = 0; e.ky = 0;
    e.r = def.radius * (sizeMult || 1) * rand(0.95, 1.05); // más grandes según el nivel, y cada uno algo distinto
    e.maxHp = def.hp * (hpMult || 1);
    e.hp = e.maxHp;
    e.speed = def.speed * (1 + rand(-def.speedJitter, def.speedJitter));
    e.angle = Math.atan2(target.y - y, target.x - x);
    e.spawnT = C.spawn.telegraph;
    e.spawnDur = C.spawn.telegraph;
    e.seed = Math.random() * TAU;
    e.flash = 0; e.barT = 0;
    e.fuseOn = false; e.fuse = 0; e.beepT = 0;
    e.cd = def.fireCooldown ? rand(0.8, def.fireCooldown) : 0;
    e.aim = 0; e.aimAngle = e.angle; e.locked = false;
    e.strafe = Math.random() < 0.5 ? 1 : -1;
    e.minion = false;
    e.dmgMul = 1;
    e.starCd = 0;

    e.idx = list.length;
    list.push(e);
    counts[id] = (counts[id] || 0) + 1;
    return e;
  }

  // Quita un enemigo de la lista (intercambiando con el último) y lo devuelve al pool
  function remove(e) {
    const i = e.idx;
    const last = list.pop();
    if (last !== e) {
      list[i] = last;
      last.idx = i;
    }
    counts[e.id]--;
    free.push(e);
  }

  function deathEffects(e) {
    const d = e.def;
    Particles.burst(e.x, e.y, {
      count: Math.round(10 + e.r), color: [d.color, d.core, '#ffffff'],
      speed: [60, 300], life: [0.35, 0.9], size: [1.8, 3.8], drag: 2.2,
    });
    Particles.ring(e.x, e.y, { color: d.color, radius: e.r, grow: 150 + e.r * 6, life: 0.45, width: 3 });
  }

  function kill(e) {
    deathEffects(e);
    Sfx.play('kill');
    remove(e);
    if (killHook) killHook(e);
  }

  /** Elimina (con efecto de muerte, sin contar como baja ni dar XP) los enemigos que cumplan el filtro. */
  function purge(filter) {
    for (let i = list.length - 1; i >= 0; i--) {
      const e = list[i];
      if (!filter(e)) continue;
      deathEffects(e);
      remove(e);
    }
  }

  /** Quita todos los enemigos (con efecto de explosión opcional, p. ej. al ganar). */
  function clear(withEffects) {
    while (list.length) {
      const e = list[list.length - 1];
      if (withEffects) deathEffects(e);
      remove(e);
    }
  }

  /** Aplica daño. dx, dy = dirección del golpe (normalizada). Devuelve true si el enemigo muere. */
  function damage(e, amount, dx, dy) {
    e.hp -= amount;
    e.flash = FX.enemyHitFlash;
    e.barT = FX.hpBarSeconds;
    const k = C.player.projectile.hitKnockback * (12 / e.r);
    e.kx += dx * k;
    e.ky += dy * k;
    if (e.hp <= 0) {
      kill(e);
      return true;
    }
    return false;
  }

  // ------------------------------------------------------------------
  // Movimiento
  // ------------------------------------------------------------------
  function steer(e, dt, dirx, diry, speed) {
    const turn = 1 - Math.exp(-e.def.turnRate * dt);
    e.vx += (dirx * speed - e.vx) * turn;
    e.vy += (diry * speed - e.vy) * turn;
  }

  function integrate(e, dt, env) {
    const kk = Math.exp(-7 * dt);
    e.kx *= kk;
    e.ky *= kk;
    e.x += (e.vx + e.kx) * dt;
    e.y += (e.vy + e.ky) * dt;
    const m = C.world.wallPadding + e.r;
    if (e.x < m) e.x = m; else if (e.x > env.w - m) e.x = env.w - m;
    if (e.y < m) e.y = m; else if (e.y > env.h - m) e.y = env.h - m;
    if (env.maze) env.maze.resolve(e); // las paredes del laberinto los frenan
  }

  // Perseguidor, Rápido y Tanque: van directos hacia el jugador
  function chase(e, dt, env, mult) {
    const P = env.player;
    const dx = P.x - e.x;
    const dy = P.y - e.y;
    const d = Math.hypot(dx, dy) || 1;
    let tx = dx / d;
    let ty = dy / d;
    // Si hay una pared de por medio, ya no va en línea recta: sigue el camino que rodea las paredes
    if (env.maze && env.maze.active() && !env.maze.los(e.x, e.y, P.x, P.y, e.r + 4)) {
      const f = env.maze.flowDir(e.x, e.y);
      if (f) { tx = f.x; ty = f.y; }
    }
    steer(e, dt, tx, ty, e.speed * env.speedMult * mult);
    integrate(e, dt, env);
    e.angle += wrapPi(Math.atan2(ty, tx) - e.angle) * Math.min(1, dt * 14);
  }


  function updateExplosive(e, dt, env) {
    const d = e.def;
    const P = env.player;
    const dist = Math.hypot(P.x - e.x, P.y - e.y);

    if (!e.fuseOn && dist < d.fuseTrigger) {
      e.fuseOn = true;
      e.fuse = d.fuseTime;
      e.beepT = 0;
    }
    if (e.fuseOn) {
      e.fuse -= dt;
      e.beepT -= dt;
      if (e.beepT <= 0) {
        e.beepT = 0.07 + 0.12 * Math.max(0, e.fuse / d.fuseTime); // los pitidos se aceleran
        Sfx.play('warn');
      }
      if (e.fuse <= 0) {
        const x = e.x;
        const y = e.y;
        remove(e);
        env.explode(x, y, d);
        return;
      }
    }
    chase(e, dt, env, e.fuseOn ? d.fuseSpeedMult : 1);
  }

  function updateSniper(e, dt, env) {
    const d = e.def;
    const P = env.player;
    const dx = P.x - e.x;
    const dy = P.y - e.y;
    const dist = Math.hypot(dx, dy) || 1;
    const nx = dx / dist;
    const ny = dy / dist;

    e.cd -= dt;

    if (e.aim > 0) {
      // Apuntando: casi quieto. El láser sigue al jugador y se fija en los últimos lockTime segundos.
      e.aim -= dt;
      if (!e.locked) {
        e.aimAngle = Math.atan2(dy, dx);
        if (e.aim <= d.lockTime) e.locked = true;
      }
      steer(e, dt, 0, 0, 0);
      e.angle = e.aimAngle;
      if (e.aim <= 0) {
        e.aim = 0;
        e.locked = false;
        e.cd = d.fireCooldown * (0.85 + Math.random() * 0.3);
        const ca = Math.cos(e.aimAngle);
        const sa = Math.sin(e.aimAngle);
        env.shoot(e.x + ca * (e.r + 6), e.y + sa * (e.r + 6), e.aimAngle, d);
        e.kx -= ca * 120; // retroceso
        e.ky -= sa * 120;
      }
    } else {
      // Posicionamiento: mantiene su distancia ideal y se desplaza lateralmente
      const m = C.world.wallPadding + e.r + 6;
      const nearWall = e.x < m || e.x > env.w - m || e.y < m || e.y > env.h - m;
      let vx;
      let vy;
      if (dist < d.keepMin && !nearWall) { vx = -nx; vy = -ny; }                          // demasiado cerca: se aleja
      else if (dist > d.keepMax) { vx = nx; vy = ny; }                                     // demasiado lejos: se acerca
      else { vx = -ny * e.strafe * 0.7; vy = nx * e.strafe * 0.7; }                        // distancia buena (o acorralado): rodea
      steer(e, dt, vx, vy, e.speed * env.speedMult);
      e.angle += wrapPi(Math.atan2(dy, dx) - e.angle) * Math.min(1, dt * 10);

      if (e.cd <= 0 && dist <= d.shootRange) {
        e.aim = d.aimTime;
        e.locked = false;
        e.aimAngle = Math.atan2(dy, dx);
        Sfx.play('aim');
      }
    }
    integrate(e, dt, env);
  }

  // Los enemigos no se funden en un punto: se empujan según su masa (radio al cuadrado)
  function separate() {
    for (let i = 0; i < list.length; i++) {
      const a = list[i];
      if (a.spawnT > 0) continue;
      for (let j = i + 1; j < list.length; j++) {
        const b = list[j];
        if (b.spawnT > 0) continue;
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const minD = (a.r + b.r) * 0.95;
        const d2 = dx * dx + dy * dy;
        if (d2 >= minD * minD || d2 < 0.0001) continue;
        const d = Math.sqrt(d2);
        const push = minD - d;
        const ma = a.r * a.r;
        const mb = b.r * b.r;
        const wa = mb / (ma + mb);
        const wb = ma / (ma + mb);
        const nx = dx / d;
        const ny = dy / d;
        a.x -= nx * push * wa; a.y -= ny * push * wa;
        b.x += nx * push * wb; b.y += ny * push * wb;
      }
    }
  }

  /**
   * env: { w, h, player, speedMult, explode(x, y, def), shoot(x, y, angle, def) }
   */
  function update(dt, env) {
    const P = env.player;
    // De atrás hacia delante: un enemigo puede eliminarse a sí mismo (explosivo) sin romper el bucle
    for (let i = list.length - 1; i >= 0; i--) {
      const e = list[i];
      if (e.flash > 0) e.flash = Math.max(0, e.flash - dt);
      if (e.starCd > 0) e.starCd -= dt;
      if (e.barT > 0) e.barT -= dt;

      if (e.spawnT > 0) {
        e.spawnT -= dt;
        e.angle += wrapPi(Math.atan2(P.y - e.y, P.x - e.x) - e.angle) * Math.min(1, dt * 6);
        if (e.spawnT <= 0) {
          e.spawnT = 0;
          Particles.burst(e.x, e.y, { count: 10, color: [e.def.color, e.def.core], speed: [40, 180], life: [0.25, 0.5] });
          Particles.ring(e.x, e.y, { color: e.def.color, radius: e.r, grow: 140, life: 0.35, width: 2 });
        }
        continue;
      }

      if (e.id === 'boss') Boss.update(e, dt, env);
      else if (e.id === 'explosivo') updateExplosive(e, dt, env);
      else if (e.id === 'francotirador') updateSniper(e, dt, env);
      else chase(e, dt, env, 1);
    }
    separate();
  }

  // ------------------------------------------------------------------
  // Dibujo
  // ------------------------------------------------------------------

  /** Capa bajo los enemigos: zonas de explosión y láseres de francotirador (las advertencias). */
  function drawGround(ctx, anim, maze) {
    for (let i = 0; i < list.length; i++) {
      const e = list[i];
      if (e.spawnT > 0) continue;
      const d = e.def;

      if (e.id === 'explosivo' && e.fuseOn) {
        const t = 1 - Math.max(0, e.fuse) / d.fuseTime;
        const blink = Math.sin(e.fuse * 38) > 0;
        ctx.save();
        ctx.globalAlpha = 0.1 + 0.16 * t + (blink ? 0.08 : 0);
        ctx.fillStyle = C.colors.danger;
        ctx.beginPath();
        ctx.arc(e.x, e.y, d.blastRadius, 0, TAU);
        ctx.fill();

        ctx.globalAlpha = blink ? 0.95 : 0.55;
        ctx.strokeStyle = C.colors.danger;
        ctx.lineWidth = 2;
        ctx.setLineDash([7, 6]);
        ctx.lineDashOffset = -anim * 40;
        ctx.beginPath();
        ctx.arc(e.x, e.y, d.blastRadius, 0, TAU);
        ctx.stroke();
        ctx.setLineDash([]);

        // Círculo que crece hasta el borde: cuando llega, explota
        ctx.globalAlpha = 0.9;
        ctx.strokeStyle = C.colors.accent;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(e.x, e.y, Math.max(1, d.blastRadius * t), 0, TAU);
        ctx.stroke();
        ctx.restore();
      } else if (e.id === 'francotirador' && e.aim > 0) {
        const t = 1 - e.aim / d.aimTime;
        const ca = Math.cos(e.aimAngle);
        const sa = Math.sin(e.aimAngle);
        ctx.save();
        if (e.locked) {
          ctx.globalAlpha = 0.75 + 0.25 * Math.sin(anim * 60);
          ctx.strokeStyle = C.colors.danger;
          ctx.lineWidth = 2.5;
        } else {
          ctx.globalAlpha = 0.18 + 0.4 * t;
          ctx.strokeStyle = d.color;
          ctx.lineWidth = 1.5;
          ctx.setLineDash([9, 9]);
          ctx.lineDashOffset = -anim * 60;
        }
        ctx.beginPath();
        ctx.moveTo(e.x, e.y);
        const len = maze ? maze.raycast(e.x, e.y, e.aimAngle, 900) : 900; // se corta en la primera pared
        ctx.lineTo(e.x + ca * len, e.y + sa * len);
        ctx.stroke();
        ctx.setLineDash([]);

        // Carga en la boca del cañón
        ctx.globalAlpha = 0.95;
        ctx.fillStyle = e.locked ? C.colors.danger : '#ffffff';
        ctx.beginPath();
        ctx.arc(e.x + ca * (e.r + 8), e.y + sa * (e.r + 8), 2 + 4 * t, 0, TAU);
        ctx.fill();
        ctx.restore();
      }
    }
  }

  // ------------------------------------------------------------------
  // Dibujo: el arte de cada criatura vive en art.js (Art.drawEnemy). Aquí solo se ordena el dibujado.
  // ------------------------------------------------------------------
  const order = [];

  /** gfx: { anim, target, frozen, glow(color, blur), noGlow() } */
  function draw(ctx, gfx) {
    // 1) sombras en el suelo (todas en un solo trazo) y luz de color bajo cada monstruo
    ctx.save();
    ctx.fillStyle = 'rgba(0, 0, 0, 0.42)';
    ctx.beginPath();
    for (let i = 0; i < list.length; i++) {
      const e = list[i];
      if (e.spawnT > 0 || e.id === 'boss') continue;
      const r = e.r;
      ctx.moveTo(e.x + r * 0.95, e.y + r * 0.8);
      ctx.ellipse(e.x, e.y + r * 0.8, r * 0.95, r * 0.36, 0, 0, TAU);
    }
    ctx.fill();
    ctx.restore();
    for (let i = 0; i < list.length; i++) {
      const e = list[i];
      if (e.spawnT <= 0 && e.id !== 'boss') Art.enemyGlow(ctx, e);
    }

    // 2) cuerpos, de arriba a abajo: el que está más abajo se dibuja encima (profundidad)
    order.length = 0;
    for (let i = 0; i < list.length; i++) {
      const e = list[i];
      let j = order.length;
      order.push(e);
      while (j > 0 && order[j - 1].y > e.y) { order[j] = order[j - 1]; j--; }
      order[j] = e;
    }
    for (let i = 0; i < order.length; i++) {
      const e = order[i];
      if (e.id === 'boss') { Boss.draw(ctx, e, gfx); continue; }
      if (e.spawnT > 0) {
        // aviso de aparición: anillo que se cierra y criatura que se materializa
        const t = 1 - e.spawnT / e.spawnDur;
        ctx.save();
        ctx.translate(e.x, e.y);
        ctx.globalAlpha = 0.25 + 0.6 * t;
        ctx.strokeStyle = e.def.color;
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 5]);
        ctx.lineDashOffset = -gfx.anim * 20;
        ctx.beginPath();
        ctx.arc(0, 0, e.r * (2.6 - 1.4 * t), 0, TAU);
        ctx.stroke();
        ctx.restore();
        Art.drawEnemy(ctx, e, gfx, t);
      } else {
        Art.drawEnemy(ctx, e, gfx, null);
      }
    }
  }

  /** Barras de vida: el Tanque la muestra siempre; el resto solo un rato tras recibir daño. */
  function drawBars(ctx) {
    ctx.save();
    for (let i = 0; i < list.length; i++) {
      const e = list[i];
      if (e.spawnT > 0) continue;
      const mode = e.def.hpBar;
      if (mode === 'never') continue;
      let alpha = 1;
      if (mode === 'damaged') {
        if (e.barT <= 0) continue;
        alpha = Math.min(1, e.barT / 0.5);
      }
      const w = Math.max(18, e.r * 2.2);
      const h = 3.5;
      const x = e.x - w / 2;
      const y = e.y - e.r - 11;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = 'rgba(8, 5, 15, 0.85)';
      ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
      ctx.fillStyle = e.flash > 0 ? '#ffffff' : e.def.color;
      ctx.fillRect(x, y, w * Math.max(0, e.hp / e.maxHp), h);
    }
    ctx.restore();
  }

  return { list, spawn, damage, update, drawGround, draw, drawBars, count, countOf, clear, purge, setOnKill };
})();

  <script>
/* ===== boss.js ===== */
'use strict';

/**
 * Boss — el jefe de los niveles 10, 20 ... 90 y del 99.
 *
 * El jefe es un enemigo más dentro de Enemies.list (id 'boss'), así que los disparos del jugador, las explosiones, la
 * Nova y la Estrella le afectan igual que a los demás. Aquí vive todo lo que lo hace especial: su IA, sus ataques
 * y su dibujo. Hace daño de contacto y ataca con patrones que van apareciendo según su número de jefe (tier 1-10):
 *
 *   fan     abanico de proyectiles            summon  llama a sus soldados ("hijitos")
 *   charge  embestida (avisa con una franja)  zones   círculos rojos que explotan al cabo de un segundo
 *   wave    onda expansiva con un hueco       spiral  espiral de proyectiles
 *
 * A los 2/3 y a 1/3 de vida se enfurece: se mueve más, dispara más y descansa menos.
 * Los efectos sobre el juego (daño al jugador, proyectiles, soldados) los hace game.js mediante los ganchos de env:
 *   env.bossShot, env.summon, env.bossHurt, env.bossBoom, env.bossPhase, env.shake
 *
 * API: start(e, tier), update(e, dt, env), draw(ctx, e, gfx), drawGround(ctx, anim), clear(), force(patrón), state
 */
const Boss = (() => {
  const C = GAME_CONFIG;
  const BC = C.boss;
  const TAU = Math.PI * 2;

  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const wrapPi = (a) => {
    while (a > Math.PI) a -= TAU;
    while (a < -Math.PI) a += TAU;
    return a;
  };

  // Aspecto de cada jefe (1-10): color, lados del cuerpo, púas, ojos, patas y satélites que giran a su alrededor
  const LOOKS = [
    { color: '#ffb02e', sides: 6, spikes: 0, eyes: 2, legs: 0, orbit: 0 },                       // 1 Reina Colmena
    { color: '#b583ff', sides: 9, spikes: 0, eyes: 1, legs: 0, orbit: 2 },                       // 2 Cíclope Abisal
    { color: '#ff6a3c', sides: 8, spikes: 8, eyes: 2, legs: 0, orbit: 0 },                       // 3 Rey Bomba
    { color: '#3dffb0', sides: 7, spikes: 0, eyes: 4, legs: 8, orbit: 0 },                       // 4 Araña Neón
    { color: '#9ff7ff', sides: 5, spikes: 5, eyes: 2, legs: 0, orbit: 4 },                       // 5 Golem de Cristal
    { color: '#ffe04a', sides: 10, spikes: 0, eyes: 2, legs: 0, orbit: 6 },                      // 6 Serpiente Eléctrica
    { color: '#ff2d8a', sides: 6, spikes: 6, eyes: 2, legs: 0, orbit: 5 },                       // 7 Fénix Oscuro
    { color: '#7b4dff', sides: 12, spikes: 0, eyes: 1, legs: 0, orbit: 7 },                      // 8 Coloso del Vacío
    { color: '#fff0b0', sides: 8, spikes: 8, eyes: 3, legs: 0, orbit: 8 },                       // 9 Emperador Estelar
    { color: '#ff3b3b', sides: 12, spikes: 12, eyes: 5, legs: 6, orbit: 8, rainbow: true },      // 10 El Devorador
  ];

  const S = {
    e: null, tier: 1, phase: 1,
    state: 'idle',          // idle | attack | dead
    pat: '', last: '',
    cd: 2, clock: 0, events: [],
    dir: 1, dirT: 2,
    cdx: 0, cdy: 0, charging: false, aimLocked: false,
    spiralOn: false, spiralA: 0, spiralT: 0,
    started: false,
  };
  const waves = []; // ondas expansivas {x, y, r, gap, speed, hit}
  const zones = []; // círculos de aviso {x, y, r, t}

  function clear() {
    S.e = null;
    S.state = 'idle';
    S.started = false;
    S.events = [];
    S.charging = false;
    S.spiralOn = false;
    waves.length = 0;
    zones.length = 0;
  }

  /** Prepara la pelea. e = el enemigo que ya creó game.js; tier = número de jefe (1-10). */
  function start(e, tier) {
    clear();
    S.e = e;
    S.tier = clamp(tier, 1, LOOKS.length);
    S.phase = 1;
    S.state = 'idle';
    S.pat = '';
    S.cd = 2.2; // respira un momento tras aparecer
    S.last = '';
    S.started = true;
    e.dmgMul = 1;
    e.speed = BC.speed + BC.speedPerTier * (S.tier - 1);
  }

  // ---------------------------------------------------------------- Ataques
  function available(env) {
    const t = S.tier;
    const list = ['fan'];
    if (env.minionRoom && env.minionRoom() > 0) list.push('summon', 'summon'); // las invocaciones salen más a menudo
    if (t >= 2) list.push('charge');
    if (t >= 3) list.push('zones');
    if (t >= 4) list.push('wave');
    if (t >= 6) list.push('spiral');
    return list;
  }

  const gap = () => Math.max(0.8, 3.2 - 0.18 * S.tier) * (S.phase === 3 ? 0.6 : S.phase === 2 ? 0.8 : 1) + rand(0, 0.5);

  function scriptFor(p) {
    const t = S.tier;
    switch (p) {
      case 'fan': return [{ t: 0.6, f: 'fire' }, ...(t >= 3 ? [{ t: 1.0, f: 'fire' }] : []), ...(t >= 7 ? [{ t: 1.4, f: 'fire' }] : []), { t: 1.7 + (t >= 7 ? 0.3 : 0), f: 'end' }];
      case 'summon': return [{ t: 0.9, f: 'summon' }, { t: 1.7, f: 'end' }];
      case 'charge': return [{ t: 0.95, f: 'dashStart' }, { t: 1.7, f: 'dashEnd' }, { t: 2.5, f: 'end' }];
      case 'zones': return [{ t: 0.3, f: 'zones' }, { t: 1.5, f: 'end' }];
      case 'wave': return [{ t: 0.7, f: 'wave' }, ...(t >= 7 ? [{ t: 1.25, f: 'wave' }] : []), { t: 1.9 + (t >= 7 ? 0.5 : 0), f: 'end' }];
      case 'spiral': return [{ t: 0.6, f: 'spiralOn' }, { t: 3.0, f: 'spiralOff' }, { t: 3.5, f: 'end' }];
      default: return [{ t: 0.5, f: 'end' }];
    }
  }

  function begin(p) {
    S.pat = p;
    S.state = 'attack';
    S.clock = 0;
    S.events = scriptFor(p);
    S.aimLocked = false;
  }

  function choose(env) {
    const list = available(env).filter((p) => p !== S.last);
    const p = list[(Math.random() * list.length) | 0] || 'fan';
    S.last = p;
    begin(p);
  }

  const shotDamage = () => BC.shotDamage + BC.shotDamagePerTier * S.tier + (S.phase - 1);

  function act(f, e, env) {
    const P = env.player;
    const t = S.tier;
    if (f === 'fire') {
      const n = Math.min(13, 5 + t + (S.phase - 1) * 2);
      const base = Math.atan2(P.y - e.y, P.x - e.x);
      const spread = 1.15;
      const speed = 240 + 12 * t;
      for (let k = 0; k < n; k++) {
        const a = base + (k - (n - 1) / 2) * (spread / Math.max(1, n - 1));
        env.bossShot(e.x + Math.cos(a) * e.r * 0.9, e.y + Math.sin(a) * e.r * 0.9, a, speed, shotDamage(), 6, LOOKS[t - 1].color);
      }
      Sfx.play('snipe');
    } else if (f === 'summon') {
      env.summon(e, Math.min(8, 2 + Math.ceil(t / 2) + (S.phase - 1)));
    } else if (f === 'dashStart') {
      const d = Math.hypot(P.x - e.x, P.y - e.y) || 1;
      S.cdx = (P.x - e.x) / d;
      S.cdy = (P.y - e.y) / d;
      S.charging = true;
      e.dmgMul = 1.8;
      Sfx.play('warn');
    } else if (f === 'dashEnd') {
      S.charging = false;
      e.dmgMul = 1;
      e.vx = 0;
      e.vy = 0;
    } else if (f === 'zones') {
      const n = 3 + Math.floor(t / 2) + (S.phase - 1);
      for (let i = 0; i < n; i++) {
        const ang = rand(0, TAU);
        const dist = i === 0 ? 0 : rand(60, 190);
        zones.push({ x: clamp(P.x + Math.cos(ang) * dist, 40, env.w - 40), y: clamp(P.y + Math.sin(ang) * dist, 40, env.h - 40), r: 62, t: 1.15 });
      }
      Sfx.play('aim');
    } else if (f === 'wave') {
      waves.push({ x: e.x, y: e.y, r: e.r, gap: rand(0, TAU), speed: 220 + 10 * t, hit: false });
      Sfx.play('explosion');
      env.shake(5);
    } else if (f === 'spiralOn') {
      S.spiralOn = true;
      S.spiralT = 0;
    } else if (f === 'spiralOff') {
      S.spiralOn = false;
    } else if (f === 'end') {
      S.state = 'idle';
      S.charging = false;
      S.spiralOn = false;
      e.dmgMul = 1;
      S.cd = gap();
    }
  }

  // ---------------------------------------------------------------- Movimiento
  function move(e, dt, env, mult) {
    const P = env.player;
    const dx = P.x - e.x;
    const dy = P.y - e.y;
    const d = Math.hypot(dx, dy) || 1;
    const want = 230 + e.r * 0.4;
    let tx;
    let ty;
    if (d > want + 50) { tx = dx / d; ty = dy / d; }
    else if (d < want - 60) { tx = -dx / d; ty = -dy / d; }
    else { tx = (-dy / d) * S.dir; ty = (dx / d) * S.dir; } // da vueltas alrededor del jugador
    S.dirT -= dt;
    if (S.dirT <= 0) { S.dir = Math.random() < 0.5 ? 1 : -1; S.dirT = rand(2, 4); }
    if (env.maze && env.maze.active() && !env.maze.los(e.x, e.y, P.x, P.y, e.r + 4) && d > want) {
      const f = env.maze.flowDir(e.x, e.y);
      if (f) { tx = f.x; ty = f.y; }
    }
    const sp = e.speed * env.speedMult * (1 + (S.phase - 1) * 0.22) * mult;
    const k = 1 - Math.exp(-2.5 * dt);
    e.vx += (tx * sp - e.vx) * k;
    e.vy += (ty * sp - e.vy) * k;
    integrate(e, dt, env);
    e.angle += wrapPi(Math.atan2(dy, dx) - e.angle) * Math.min(1, dt * 6);
  }

  function integrate(e, dt, env) {
    const kk = Math.exp(-7 * dt);
    e.kx *= kk;
    e.ky *= kk;
    e.x += (e.vx + e.kx) * dt;
    e.y += (e.vy + e.ky) * dt;
    const m = C.world.wallPadding + e.r;
    e.x = clamp(e.x, m, env.w - m);
    e.y = clamp(e.y, m, env.h - m);
    if (env.maze) return env.maze.resolve(e);
    return false;
  }

  // ---------------------------------------------------------------- Actualización
  function updateWaves(dt, env) {
    const P = env.player;
    const maxR = Math.hypot(env.w, env.h);
    for (let i = waves.length - 1; i >= 0; i--) {
      const w = waves[i];
      w.r += w.speed * dt;
      if (w.r > maxR) { waves.splice(i, 1); continue; }
      if (w.hit || !P.alive) continue;
      const d = Math.hypot(P.x - w.x, P.y - w.y);
      if (Math.abs(d - w.r) < 13 + P.r) {
        const ang = Math.atan2(P.y - w.y, P.x - w.x);
        if (Math.abs(wrapPi(ang - w.gap)) > 0.55) { // fuera del hueco
          w.hit = true;
          env.bossHurt(10 + 1.5 * S.tier, w.x, w.y);
        }
      }
    }
  }

  function updateZones(dt, env) {
    const P = env.player;
    for (let i = zones.length - 1; i >= 0; i--) {
      const z = zones[i];
      z.t -= dt;
      if (z.t > 0) continue;
      zones.splice(i, 1);
      env.bossBoom(z.x, z.y, z.r);
      if (P.alive && Math.hypot(P.x - z.x, P.y - z.y) < z.r + P.r) env.bossHurt(12 + 2 * S.tier, z.x, z.y);
    }
  }

  /** Una vez por frame mientras el jefe está activo (llamado desde Enemies.update). */
  function update(e, dt, env) {
    if (!S.started || S.e !== e) return;
    const P = env.player;

    // Fases de furia según la vida que le queda
    const frac = e.hp / e.maxHp;
    const ph = frac < BC.phases[1] ? 3 : frac < BC.phases[0] ? 2 : 1;
    if (ph !== S.phase) {
      S.phase = ph;
      S.cd = Math.min(S.cd, 0.6);
      env.bossPhase(e, ph);
    }

    updateWaves(dt, env);
    updateZones(dt, env);

    if (S.state === 'idle') {
      move(e, dt, env, 1);
      S.cd -= dt;
      if (S.cd <= 0) choose(env);
      return;
    }

    // atacando
    S.clock += dt;
    while (S.events.length && S.events[0].t <= S.clock) act(S.events.shift().f, e, env);

    if (S.pat === 'charge') {
      if (S.charging) {
        e.vx = S.cdx * 560;
        e.vy = S.cdy * 560;
        if (integrate(e, dt, env) || e.x <= e.r + C.world.wallPadding + 1 || e.x >= env.w - e.r - C.world.wallPadding - 1 || e.y <= e.r + C.world.wallPadding + 1 || e.y >= env.h - e.r - C.world.wallPadding - 1) {
          env.shake(9); // se estrella: se queda aturdido y vulnerable
          S.clock = Math.max(S.clock, 1.7);
        }
      } else if (S.clock < 0.65) { // antes de embestir apunta; después se fija la dirección
        e.angle += wrapPi(Math.atan2(P.y - e.y, P.x - e.x) - e.angle) * Math.min(1, dt * 10);
        S.cdx = Math.cos(e.angle);
        S.cdy = Math.sin(e.angle);
      }
    } else {
      move(e, dt, env, 0.35);
    }

    if (S.spiralOn) {
      S.spiralT -= dt;
      if (S.spiralT <= 0) {
        S.spiralT = 0.075;
        S.spiralA += 0.42;
        const speed = 200 + 8 * S.tier;
        for (let arm = 0; arm < 2; arm++) {
          const a = S.spiralA + arm * Math.PI;
          env.bossShot(e.x + Math.cos(a) * e.r, e.y + Math.sin(a) * e.r, a, speed, shotDamage() * 0.9, 5, LOOKS[S.tier - 1].color);
        }
      }
    }
  }

  /** Para las pruebas y la depuración: lanza un ataque ya. */
  function force(p) {
    if (!S.e) return false;
    S.last = p;
    begin(p);
    return true;
  }

  // ---------------------------------------------------------------- Dibujo
  const shadeCache = {};
  function shade(hex, f) {
    const key = hex + '|' + f;
    if (shadeCache[key]) return shadeCache[key];
    const h = hex.slice(1);
    const v = [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]
      .map((c) => Math.round(f >= 0 ? c + (255 - c) * f : c * (1 + f)));
    shadeCache[key] = 'rgb(' + v.join(',') + ')';
    return shadeCache[key];
  }

  function bodyPath(ctx, r, look, rot, oy) {
    const n = look.spikes ? look.sides * 2 : look.sides;
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const a = rot + (i * TAU) / n;
      const rr = look.spikes ? (i % 2 === 0 ? r * 1.22 : r * 0.9) : r;
      const x = Math.cos(a) * rr;
      const y = Math.sin(a) * rr + oy;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  function eyeAt(ctx, x, y, er, lx, ly, pupil) {
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(x, y, er, 0, TAU);
    ctx.fill();
    ctx.fillStyle = pupil;
    ctx.beginPath();
    ctx.arc(x + lx * er * 0.4, y + ly * er * 0.4, er * 0.55, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(x + lx * er * 0.4 - er * 0.17, y + ly * er * 0.4 - er * 0.2, er * 0.15, 0, TAU);
    ctx.fill();
  }

  /** Zona del suelo: franja de embestida, círculos de aviso y ondas expansivas. Va por debajo de los cuerpos. */
  function drawGround(ctx, anim) {
    if (!S.started) return;
    const look = LOOKS[S.tier - 1];
    const e = S.e;

    if (e && S.state === 'attack' && S.pat === 'charge' && !S.charging && S.clock < 0.95) {
      const len = 900;
      ctx.save();
      ctx.translate(e.x, e.y);
      ctx.rotate(Math.atan2(S.cdy, S.cdx));
      ctx.globalAlpha = 0.2 + 0.2 * Math.abs(Math.sin(anim * 14));
      ctx.fillStyle = C.colors.danger;
      ctx.fillRect(0, -e.r * 0.85, len, e.r * 1.7);
      ctx.globalAlpha = 0.8;
      ctx.strokeStyle = C.colors.danger;
      ctx.lineWidth = 2;
      ctx.strokeRect(0, -e.r * 0.85, len, e.r * 1.7);
      ctx.restore();
    }

    for (let i = 0; i < zones.length; i++) {
      const z = zones[i];
      const t = clamp(1 - z.t / 1.15, 0, 1);
      ctx.save();
      ctx.globalAlpha = 0.12 + 0.2 * t + (Math.sin(anim * 20) > 0 ? 0.05 : 0);
      ctx.fillStyle = C.colors.danger;
      ctx.beginPath();
      ctx.arc(z.x, z.y, z.r, 0, TAU);
      ctx.fill();
      ctx.globalAlpha = 0.9;
      ctx.strokeStyle = C.colors.danger;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(z.x, z.y, z.r, 0, TAU);
      ctx.stroke();
      ctx.strokeStyle = C.colors.accent;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(z.x, z.y, Math.max(1, z.r * t), 0, TAU);
      ctx.stroke();
      ctx.restore();
    }

    for (let i = 0; i < waves.length; i++) {
      const w = waves[i];
      ctx.save();
      ctx.lineWidth = 13;
      ctx.lineCap = 'round';
      ctx.strokeStyle = look.color;
      ctx.shadowColor = look.color;
      ctx.shadowBlur = 14;
      ctx.globalAlpha = 0.9;
      ctx.beginPath();
      ctx.arc(w.x, w.y, w.r, w.gap + 0.55, w.gap - 0.55 + TAU); // todo el anillo MENOS el hueco por el que se pasa
      ctx.stroke();
      ctx.restore();
    }
  }

  /** Dibuja al jefe: sombra, patas, satélites, cuerpo con grosor y luz, ojos que miran al jugador y aura de furia. */
  function draw(ctx, e, gfx) {
    if (!S.started || S.e !== e) return;
    const look = LOOKS[S.tier - 1];
    const r = e.r;
    const anim = gfx.anim;
    const tgt = gfx.target;
    const attacking = S.state === 'attack';

    ctx.save();
    ctx.translate(e.x, e.y);

    // --- aparición: aviso rojo y silueta que se materializa
    if (e.spawnT > 0) {
      const t = 1 - e.spawnT / e.spawnDur;
      ctx.globalAlpha = 0.3 + 0.5 * t;
      ctx.strokeStyle = C.colors.danger;
      ctx.lineWidth = 4;
      ctx.setLineDash([10, 8]);
      ctx.lineDashOffset = -anim * 40;
      ctx.beginPath();
      ctx.arc(0, 0, r * (3.2 - 2 * t), 0, TAU);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = t * 0.85;
      ctx.scale(0.3 + 0.7 * t, 0.3 + 0.7 * t);
      bodyPath(ctx, r, look, anim * 0.2, 0);
      ctx.fillStyle = shade(look.color, -0.3);
      ctx.fill();
      ctx.restore();
      return;
    }

    // --- sombra sobre el suelo
    ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
    ctx.beginPath();
    ctx.ellipse(0, r * 0.9, r * 1.1, r * 0.42, 0, 0, TAU);
    ctx.fill();

    const bob = Math.sin(anim * 2.2) * r * 0.03;
    ctx.translate(0, bob);
    const hit = e.flash > 0;
    const enraged = S.phase >= 2;
    const base = hit ? '#ffffff' : look.color;

    // --- patas (araña y devorador)
    if (look.legs) {
      ctx.strokeStyle = shade(look.color, -0.45);
      ctx.lineWidth = Math.max(3, r * 0.1);
      ctx.lineCap = 'round';
      for (let k = 0; k < look.legs; k++) {
        const a = (k * TAU) / look.legs + 0.2;
        const w = Math.sin(anim * 3 + k * 1.3) * 0.25;
        const kx = Math.cos(a + w) * r * 1.35;
        const ky = Math.sin(a + w) * r * 1.35;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * r * 0.8, Math.sin(a) * r * 0.8);
        ctx.lineTo(kx, ky);
        ctx.lineTo(Math.cos(a + w * 0.5) * r * 1.85, Math.sin(a + w * 0.5) * r * 1.85 + r * 0.12);
        ctx.stroke();
      }
    }

    // --- satélites que giran
    for (let k = 0; k < look.orbit; k++) {
      const a = anim * 0.9 + (k * TAU) / look.orbit;
      const ox = Math.cos(a) * r * 1.55;
      const oy = Math.sin(a) * r * 0.62; // órbita aplastada: se ve en perspectiva
      ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
      ctx.beginPath();
      ctx.ellipse(ox, oy + r * 0.45, r * 0.15, r * 0.06, 0, 0, TAU);
      ctx.fill();
      gfx.glow(look.color, 12);
      ctx.fillStyle = look.rainbow ? 'hsl(' + (((anim * 120 + k * 45) % 360) | 0) + ', 100%, 62%)' : shade(look.color, 0.35);
      ctx.beginPath();
      ctx.arc(ox, oy, r * 0.12, 0, TAU);
      ctx.fill();
      gfx.noGlow();
    }

    // --- cuerpo: coraza con placas y pinchos, núcleo que late y anillo de runas (art.js)
    Art.bossBody(ctx, look, r, anim, { hit, enraged });

    // grietas cuando está herido
    if (S.phase >= 2) {
      ctx.strokeStyle = 'rgba(8, 5, 15, 0.7)';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(-r * 0.7, -r * 0.5); ctx.lineTo(-r * 0.3, -r * 0.1); ctx.lineTo(-r * 0.5, r * 0.3);
      if (S.phase >= 3) { ctx.moveTo(r * 0.6, -r * 0.6); ctx.lineTo(r * 0.2, -r * 0.05); ctx.lineTo(r * 0.45, r * 0.4); }
      ctx.stroke();
    }

    // --- ojos que miran al jugador (rojos si está furioso o atacando)
    if (!hit) {
      ctx.save();
      ctx.translate(0, -r * 0.2);
      let lx = 0;
      let ly = 0;
      if (tgt) {
        const dx = tgt.x - e.x;
        const dy = tgt.y - e.y;
        const d = Math.hypot(dx, dy) || 1;
        lx = dx / d;
        ly = dy / d;
      }
      const pupil = enraged || attacking ? '#ff2a2a' : '#10061c';
      const n = look.eyes;
      const er = r * (n === 1 ? 0.3 : n <= 3 ? 0.2 : 0.14);
      for (let k = 0; k < n; k++) {
        let ex;
        let ey;
        if (n === 1) { ex = 0; ey = -r * 0.05; }
        else if (n === 2) { ex = (k ? 1 : -1) * r * 0.3; ey = -r * 0.1; }
        else if (n === 3) { ex = (k - 1) * r * 0.34; ey = -r * 0.12 + (k === 1 ? -r * 0.1 : r * 0.02); }
        else { ex = ((k % 4) < 2 ? -1 : 1) * r * (0.16 + 0.17 * ((k + 1) % 2)); ey = -r * 0.28 + Math.floor(k / 2) * r * 0.25 * (k < 4 ? 1 : 0) + (k === 4 ? r * 0.45 : 0); }
        eyeAt(ctx, ex, ey, er, lx, ly, pupil);
        if (enraged) { // cejas enfadadas
          ctx.strokeStyle = '#10061c';
          ctx.lineWidth = Math.max(3, r * 0.06);
          ctx.lineCap = 'round';
          const sg = ex >= 0 ? 1 : -1;
          ctx.beginPath();
          ctx.moveTo(ex - sg * er * 1.1, ey - er * 0.8);
          ctx.lineTo(ex + sg * er * 1.2, ey - er * 1.65);
          ctx.stroke();
        }
      }
      ctx.restore();
    }

    // --- aura de furia
    if (enraged) {
      ctx.globalAlpha = 0.25 + 0.15 * Math.sin(anim * 8);
      ctx.strokeStyle = C.colors.danger;
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(0, 0, r * 1.45, 0, TAU);
      ctx.stroke();
    }
    ctx.restore();
  }

  return {
    start, update, draw, drawGround, clear, force,
    names: LOOKS.map((l, i) => 'boss.' + (i + 1)),
    looks: LOOKS,
    waves, zones,
    get state() { return S; },
    active: () => S.started && !!S.e,
  };
})();
